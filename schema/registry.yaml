# Single registry of entity types. Code reads this; nothing else hardcodes directories.
contract_version: "1.3"
# Every contract version and the date it took effect. A run records the version it was written under;
# E028 accepts any version listed here that is not newer than contract_version, so run files never need rewriting.
contract_history:
  "1.0": "2026-10-23"
  "1.1": "2026-10-25"
  "1.2": "2026-10-26"
  "1.3": "2026-11-03"
# Limits checked on pull requests by scripts/pr_scope.py (E039) and calibration gates (E036).
contribution:
  max_records_per_pr: 10        # games, mechanics, techniques, opportunities added, changed, or deleted in one PR
  max_sources_per_pr: 30        # source files added or changed in one PR
  bulk_label: bulk              # a maintainer-applied PR label that lifts both limits
  run_typo_label: run-typo      # a maintainer-applied PR label that allows editing a merged run file
  calibration_set: calibration/mechanics-v1.yaml   # the current set; retired sets stay in calibration/ so merged runs are judged against the set they name
  calibration_min_within_one: 0.8   # share of calibration scores within one anchor of the frozen set
types:
  game:
    dir: data/games
    schema: schema/game.schema.json
    label: Game
    plural: games
  mechanic:
    dir: data/mechanics
    schema: schema/mechanic.schema.json
    label: Mechanic
    plural: mechanics
  technique:
    dir: data/techniques
    schema: schema/technique.schema.json
    label: Technique
    plural: techniques
  opportunity:
    dir: data/opportunities
    schema: schema/opportunity.schema.json
    label: Opportunity
    plural: opportunities
  source:
    dir: data/sources
    schema: schema/source.schema.json
    label: Source
    plural: sources
  run:
    dir: log/runs
    schema: schema/run.schema.json
    label: Run
    plural: runs
    meta: true
