function chipOf(c){

  if (c.kind === "technique") return `ai technique · ${c.name} · ${c.maturity}`;

let GRID = null;  // {rows:[[col,core]...] per game oldest first, names:[], years:[], top:[col names]}

// ---- the 8-dpx grid and motion (ADR-0006; render.js drives the steps)
const BAYER8 = [[0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],[12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],
  [3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],[15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21]];
// a frame whose content runs past the stage (into the header, chip, or caption): templates that read f.fit draw it a size step smaller
function overStage(st){
  const s = st.getBoundingClientRect();
  let lo = Infinity, hi = -Infinity;
  for (const e of st.querySelectorAll("#frame .f-u, #frame .f-lab, #frame .f-mono, #frame .f-name, #frame img")) {
    const b = e.getBoundingClientRect();

// move each layout unit so its first sprite sits on the 8-dpx grid of the page: the dither of neighbouring sprites lines up
function snap(root){

    const im = u.querySelector("img.f-ic");
    if (!im) continue;
    const r = im.getBoundingClientRect();
    const dx = Math.round(r.left / g) * g - r.left, dy = Math.round(r.top / g) * g - r.top;

const MASKS = {};
function maskURL(level){
  const k = PX() + ":" + level;
  if (!MASKS[k]) {
    const c = document.createElement("canvas"), px = PX(); c.width = c.height = 8 * px;
    const x = c.getContext("2d"); x.fillStyle = "#000";
    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) if (BAYER8[i][j] < level) x.fillRect(j * px, i * px, px, px);

// reveal an element through the Bayer matrix: level 0 hides it, 64 shows it whole; cells are anchored to the page grid

let TR = null;

function transStep(k){
