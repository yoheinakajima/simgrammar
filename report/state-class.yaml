# The state class of every live mechanic: simulation state, presentation, control, or meta-structure (Explore Science
# review finding D6). The admission tests (CONTRACT.md I12) let interface, control, and goal and session structures in
# beside the rules that model a world, and §5.1 had only a family-level proxy for telling them apart (nonstate_families in
# report/analysis.yaml). This file classes each mechanic on its own, by the rules below, so §5.1, §5.3, and §5.4 can re-run
# on the simulation-state subset.
#
# Made by run 2026-11-01-es-v3-state-classes (operator yoheinakajima, model claude-opus-5-5, Claude Code). The rater wrote
# the rules while reading the definitions in data/mechanics/, then classed every mechanic from its definition against
# them, and fixed every class before any statistic on the subset was computed. One rater made every call; no second
# coder has repeated them, so agreement on the classes is unmeasured. The rules are written to
# be quoted word for word on a blind coding sheet: they name no mechanic except the worked examples, which a sample for a
# second coder should leave out.
#
# scripts/analyze.py (_state_class) reads this file. The build fails when a live mechanic has no entry, when an entry
# names a mechanic that is not live or appears twice, when an entry names a class not listed under `classes`, when a
# worked example is not live or its entry gives another class, or when `made_by.run` is not a run in log/runs/.
# An entry carries `why` wherever the call is not obvious from the definition; the rest follow directly from the rules.
made_by:
  run: 2026-11-01-es-v3-state-classes
  operator: yoheinakajima
  model: claude-opus-5-5
procedure: >-
  Class a mechanic by what its update rule writes, as its definition describes it. Count the variables the definition
  names as the state the mechanic owns, and any other variable its rule changes on every cycle or on every use. Do not
  count a variable that only some of the games using the mechanic write, or one written only to charge a cost. Sort each
  counted variable into one of the four classes below. The mechanic takes the first class, in the order simulation state,
  control, meta-structure, presentation, that any of its counted variables belongs to. How the player reaches the
  mechanic, and which family it belongs to, do not decide its class.
classes:
- id: simulation-state
  label: Simulation state
  definition: >-
    A variable of the modelled world that the mechanic's rule computes from other world variables, from chance, or
    from elapsed time, and that other rules of the simulation read: a stock or a flow, a price, a need or a mood, a
    relationship, a body or a disease, a position or a motion the player does not steer directly, a field such as heat
    or pollution, terrain, weather, an event in progress, or the world's starting conditions. A variable the player
    sets or spends is still simulation state when the rule also changes it on its own.
  examples:
  - mechanic: needs-decay
    why: Each agent's need stocks fall every tick and actions restore them; mood, action selection, and health read them.
  - mechanic: budget-treasury
    why: The player sets funding and spends money, but the balance also changes each period by taxes, upkeep, wages,
      and interest, so it is not a pool that only the player's actions spend.
- id: control
  label: Control
  definition: >-
    The player's means of acting on the simulation, and the pace at which simulated time runs against the player's
    time: orders, designations, queues, and priorities; programs and other standing instructions the player writes or
    wires up, and the state of running them; settings, allocations, and adopted policies whose effect follows from the
    choice alone; structures and terrain edits written where the player puts them, once checked and paid for; the
    mapping from the player's input to a body or machine the player steers, and its motion under that input; a pool
    that only the player's own actions spend, however it fills; and how fast simulated time runs or when it advances,
    whether the player sets that or a clock outside the game does.
  examples:
  - mechanic: variable-speed
    why: It writes the time scale the player picks, paused or one of several multipliers; every other mechanic's
      update runs at the tick rate it sets.
  - mechanic: free-placement
    why: It writes each structure where the player puts it, once the footprint is checked and the cost paid; pathing,
      coverage, and adjacency read the layout, but they are other mechanics.
- id: meta-structure
  label: Meta-structure
  definition: >-
    The frame around play rather than the modelled world: goals, objectives, and win or loss conditions, and scores,
    ratings, and records of how well a player has done, where what they pay out is score, unlocks, or the end of a
    run rather than a change to the modelled world; unlocks of what a player may build or use, and the progress and
    choices that lead to them; the session, meaning how the game is saved, kept and shared among players, or ended and
    started again; and content or rules brought in from outside the session, such as player-made modifications and
    shared creations. A standing or a rating that characters or markets in the modelled world react to is simulation
    state.
  examples:
  - mechanic: modding-api
    why: It loads content and rules from outside the session and lets scripts change them; nothing in the modelled
      world computes what it writes.
  - mechanic: milestone-unlocks
    why: It records which thresholds have been reached and unlocks buildings and areas; progress comes from growth,
      but what the rule writes is an unlock.
- id: presentation
  label: Presentation
  definition: >-
    What the player is shown: a selection, a view or map mode, a panel, a summary, a record kept for the player to
    browse, an alert, an explanation, a forecast, or what each player can see of the world, all computed from
    variables that other mechanics own and read by no other rule of the simulation.
  examples:
  - mechanic: data-overlays
    why: It recolors the map by a field other mechanics own and stores only which map mode is shown and the color ramp.
  - mechanic: fog-of-war
    why: Its visibility state decides what each player sees of positions and changes that other mechanics own; no
      rule of the modelled world reads it.
