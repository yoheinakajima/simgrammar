- decision: horizon
  item: voyager-skill-libraries
  value: 3-5y
  rationale: '3-5y: dependable reusable skills need better spatial reasoning, code correctness and recovery,
    alongside affordable inference and game API integration.'
- decision: horizon
  item: wave-function-collapse
  value: now
  rationale: 'Now: shipped real-time and offline generation, public implementations and established engine
    adaptations make production use available today.'
