  item: muse-wham
  value: 3-5y
  rationale: '3-5y: useful simulation ideation needs research on reliable state, persistent edits and
    lower data requirements, plus practical designer tools.'
- decision: horizon
  item: neural-cellular-automata
  value: 3-5y
  rationale: '3-5y: robust simulation-scale growth under player interference needs research plus controllable
    training and editing tools.'
- decision: horizon
  item: neural-rendering-shaders
  value: now
  rationale: 'Now: shipping simulation titles and mature DLSS integrations demonstrate production use
    on supported GPUs; newer relighting features have separate quality and hardware limits.'
- decision: horizon
  item: on-device-language-models
  value: now
  rationale: 'Now: inZOI and the available in-game inference SDK support production today on suitable
    GPUs, despite the hardware floor and rendering contention.'
- decision: horizon
  item: open-ended-environment-generation
  value: 3-5y
  rationale: '3-5y: reliable interestingness, success tests and meaningful generated challenges require
    research alongside faster training and authoring tools.'
- decision: horizon
  item: open-interactive-video-models
  value: 3-5y
  rationale: '3-5y: stable long-term state and game verbs beyond locomotion need research, with substantial
    improvements to serving cost and control tooling.'
- decision: horizon
  item: physical-world-foundation-models
  value: 5y-plus
  rationale: '5y-plus: game-ready general physical prediction depends on unsolved reliable plausibility
    and long-horizon dynamics, with near-chance benchmark results and very large models.'
- decision: horizon
  item: physics-based-character-control
  value: 1-2y
  rationale: '1-2y: working unified controllers need production retargeting, edge-case QA and runtime-budget
    tooling for bounded character counts.'
- decision: horizon
  item: quality-diversity-search
  value: 1-2y
  rationale: '1-2y: established archive search needs better game-specific descriptors, affordable evaluation
    and designer integration rather than a new search principle.'
- decision: horizon
  item: real-time-video-restyling
  value: 1-2y
  rationale: '1-2y: controllable restyling already runs interactively, while affordable per-player serving
    and more stable visual legibility need another generation of improvement.'
- decision: horizon
  item: realtime-voice-models
  value: now
  rationale: 'Now: commercial character conversations and low-latency streaming TTS demonstrate production
    usability, with ongoing talk-time cost and consent constraints.'
- decision: horizon
  item: satellite-world-reconstruction
  value: now
  rationale: 'Now: two shipped Flight Simulator titles demonstrate production readiness given licensed
    imagery and sufficient streaming infrastructure.'
- decision: horizon
  item: simulation-based-inference
  value: now
  rationale: 'Now: a title started today can use existing likelihood-free inference offline on forward
    simulator runs when measurable telemetry targets and sufficient compute are available.'
- decision: horizon
  item: story-sifting
  value: now
  rationale: 'Now: a new discrete-action simulation can integrate Viv and authored patterns today; automatic
    narrativization is a separate unsolved extension rather than a prerequisite for sifting.'
- decision: horizon
  item: subspace-neural-physics
  value: now
  rationale: 'Now: Unreal''s documented training and runtime pipeline supports production cosmetic deformation
    today, given offline caches and adequate pose coverage.'
- decision: horizon
  item: text-to-3d-assets
  value: now
