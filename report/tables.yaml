- name: top-mechanics
  kind: rows
  entity: mechanic
  columns:
  - name
  - family
  - path: _derived.prevalence
    label: games
  - path: _derived.core_count
    label: core in
  - path: _derived.earliest_year
    label: earliest
  - legibility
  - emergence_potential
  - ai_leverage
  sort:
  - -_derived.prevalence
  - name
  limit: 15
  caption: Most-used mechanics across all families. Scores are rubric anchors (1-5).
