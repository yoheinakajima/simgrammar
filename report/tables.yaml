  - maturity
  - trl
  - horizon
  - determinism_impact
  - path: _derived.window
    label: window
  sort:
  - category
  - -year
  - name
  caption: The set covers techniques whose key result falls in 2019 or later. An older technique is kept as a historical
    exception only when an in-window technique builds on it, a catalog game released in the window deploys it, or it
    cites later work from the window; the window column names which (report/analysis.yaml, techniques.window_start).
