# Parameters for scripts/analyze.py. Changing a value changes generated numbers; record why in the commit message.
cooccurrence:
  min_support: 3          # pair must co-occur in at least this many games to be ranked by lift
  top_n: 30
  # Fixed-margin null for pair coverage and white space (§5.3, §5.5): curveball trades keep every game's size and every
  # mechanic's prevalence. 499 null catalogs give p-values in steps of 0.002. A burn-in of about 110 trades per game and
  # 1,000 trades between catalogs left the coverage of successive catalogs uncorrelated (lag-1 r about 0.01) when set on
  # 2026-10-31, and a chain from another seed gave the same mean coverage.
  null_samples: 499
  null_burnin: 20000
  null_thin: 1000
  null_seed: 20261028
  restricted_min_games: 3   # the restricted coverage counts only pairs whose mechanics each appear in at least this many games
whitespace:
  # Both mechanics used by at least this many games. A count, not a share of the catalog: with a share, adding games
  # with neither mechanic pushed one under the bar, so a catalog PR could break §5.5 without changing any finding
  # (AI contributor pilot, 2026-10-25). 14 was 8% of the catalog when fixed; revisit past about 250 games.
  min_prevalence_games: 14
  max_observed: 1              # pair co-occurs at most this many times
  exclude_same_family: true
  exclude_families: [time-pacing]   # pacing controls are interface choices fixed by the time model, not design gaps
  top_n: 30
clustering:
  # k is not tuned. It is the smallest k in [k_min, k_max] whose mean subsample ARI reaches min_mean_ari, selected on
  # 2026-10-25 (k=24), re-selected by the rule on 2026-10-31 (k=17, run 2026-10-31-tag-audit) and again the same day
  # after further sourced tags (k=22, run 2026-10-31-tag-audit-follow-up), and fixed here so a data PR does not
  # reshuffle every cluster (ADR-0004). W107 warns when the rule would now pick another k; re-select only in a
  # maintenance run, by the rule, and rewrite the prose it breaks.
  k: 22
  stability:
    k_min: 2
    k_max: 30
    subsamples: 1000       # re-clusterings of subsamples
    fraction: 0.8          # each game joins a subsample when sha256(seed:b:id) < fraction, so adding a game redraws nothing else
    seed: 20261025         # fixed so the build is deterministic
    min_mean_ari: 0.75     # selection threshold on mean adjusted Rand index between full and subsample clusterings (a convention adopted here; Hennig's 0.75 is for cluster-wise Jaccard)
    drift_tolerance: 0.02  # W107 fires only when the configured k misses the threshold, or a smaller k clears it, by more than this
    stable_cluster: 0.75   # a cluster whose mean best-match Jaccard across subsamples reaches this is stable (Hennig 2007 convention)
    # ... and holds at least this many games. Fixed before looking at which clusters pass (Explore Science review E28):
    # a pair or trio is described by how often its games co-cluster, which `together` and `apart` already govern, and
    # five is also where the agreement check below starts treating a subgenre label as large.
    min_family_size: 5
    together: 0.9          # an assertion that two games share a cluster needs co-clustering in at least this share of subsamples
    apart: 0.1             # an assertion that two games differ needs co-clustering in at most this share
    permutations_seed: 20261026
    permutations: 999      # shuffles of subgenre labels for the ARI/NMI/AMI and mixed-cluster nulls
    alternatives:          # sensitivity of the conventions above (review B2); reported, never used to pick anything
      stable_cluster: [0.6, 0.85]   # Hennig's lower and upper marks for cluster-wise Jaccard
      min_mean_ari: [0.7, 0.8]      # what the k-selection rule would pick at other thresholds
      core_weight: [1.0, 3.0]       # re-cluster at k with other core weights and compare by ARI
  core_weight: 2.0         # weight of core vs supporting mechanics in game vectors
  idf: true                # weight each mechanic by log(N / prevalence) so ubiquitous mechanics (pause, placement) do not dominate
  top_mechanics_per_cluster: 5
  # Robustness checks of the partition (review findings B2, D2, E8, E10, E27, E28, E32). None of them feeds back into k
  # or the clusters; they are reported in section 5.4 and the tables cluster-k-sensitivity and family-robustness.
  report_k: [8, 14, 18, 19, 20, 21, 22, 26, 30]   # rows of cluster-k-sensitivity (the configured k is always included)
  mixed_shares: [0.8, 0.6]   # a cluster is also counted as mixed when its largest subgenre holds less than this share
  small_subgenre_games: 5    # subgenre labels with fewer games are pooled, or their games left out, in a second agreement check
  consensus_k: [14, 30]      # co-association over every subsample clustering at every k in this range
  granularity:
    rare_max_games: 5        # rare mechanics, paired at random within their family and merged
    random_merges: 20        # how many random lumpings
    seed: 20261031
  # The groupings of games the prose names as families, by the games it names, so the build can say how each fares
  # under other methods and inputs (stats grouping_<id>_*, table family-robustness for the paper's). Listing a
  # grouping changes no cluster; a grouping whose games are no longer all in the catalog is skipped.
  groupings:
    paper:
      life-sims: [the-sims, paralives, inzoi]
      colony-sims: [rimworld, dwarf-fortress, oxygen-not-included]
      virtual-pets: [creatures, tamagotchi, black-and-white]
      tycoons: [theme-hospital, two-point-hospital, rollercoaster-tycoon]
      sports-management: [football-manager, out-of-the-park-baseball]
      settlement-builders: [anno-1800, manor-lords, banished]
      factory-games: [factorio, satisfactory, shapez-2]
      zoning-city-builders: [simcity-1989, cities-skylines]
      grand-strategy: [europa-universalis-4, crusader-kings-3, stellaris, victoria-3]
      political-city-builders: [tropico-6, frostpunk-2]
      physics-sandboxes: [besiege, teardown, poly-bridge]
      programming-puzzles: [spacechem, opus-magnum, the-farmer-was-replaced]
      persistent-worlds: [eve-online, ultima-online]
      job-sims: [powerwash-simulator, house-flipper]
      flight-and-military-sims: [x-plane, dcs-world, microsoft-flight-simulator-2024]
      driving-sims: [iracing, gran-turismo-7, beamng-drive]
      survival-games: [dont-starve, subnautica, minecraft, valheim]
      god-games: [simearth, populous, simlife]
      inspection-games: [papers-please, contraband-police]
      dilemma-games: [reigns, suzerain, this-war-of-mine]
      text-sims: [hamurabi, oregon-trail, lemonade-stand]
      ai-native: [ai-dungeon, infinite-craft, suck-up]
    links:   # pairs of neighbouring paper families that section 5.4 says share a cluster in some resamplings
      life-and-colony-sims: [the-sims, paralives, inzoi, rimworld, dwarf-fortress, oxygen-not-included]
      tycoons-and-sports-management: [theme-hospital, two-point-hospital, rollercoaster-tycoon, football-manager, out-of-the-park-baseball]
      settlement-and-factory-games: [anno-1800, manor-lords, banished, factorio, satisfactory, shapez-2]
      grand-strategy-and-political-city-builders: [europa-universalis-4, crusader-kings-3, stellaris, victoria-3, tropico-6, frostpunk-2]
      flight-and-driving-sims: [x-plane, dcs-world, microsoft-flight-simulator-2024, iracing, gran-turismo-7, beamng-drive]
      inspection-and-dilemma-games: [papers-please, contraband-police, reigns, suzerain, this-war-of-mine]
    book:
      schedules-and-verdicts: [papers-please, princess-maker-2]
      physics-you-build-with: [besiege, the-incredible-machine, garrys-mod, job-simulator, surgeon-simulator]
      machines-under-your-hands: [farming-simulator-25, iracing, gran-turismo-7, euro-truck-simulator-2]
      rulers-and-councils: [europa-universalis-4, civilization, stellaris, tropico-6]
      creatures-you-raise: [little-computer-people, tamagotchi, creatures, black-and-white]
      worlds-made-of-language: [ai-dungeon, infinite-craft, where-winds-meet, facade]
      crowds-you-manage: [theme-hospital, rollercoaster-tycoon, game-dev-tycoon]
      procedure: [dcs-world, x-plane, silent-hunter-3, command-modern-operations, arma-3]
      worlds-that-keep-running: [eve-online, ultima-online, second-life, a-tale-in-the-desert]
      planets-in-the-hand: [populous, simearth, from-dust, terra-nil, simlife, species-alre]
      programs: [spacechem, opus-magnum, the-farmer-was-replaced, bitburner, autonauts]
      rosters: [football-manager, out-of-the-park-baseball, motorsport-manager]
      brushes: [townscaper, tiny-glade]
      bodies-in-the-open: [zelda-breath-of-the-wild, subnautica, dont-starve, minecraft]
      factory-family: [factorio, satisfactory, shapez-2, dyson-sphere-program, captain-of-industry]
      settlement-family: [anno-1800, manor-lords, banished, caesar-3, pharaoh]
      zoning-family: [simcity-1989, cities-skylines, pocket-city]
      sims-and-inzoi: [inzoi, the-sims-4]
viz:
  design_map:
    neighbors: 4              # each game links to its k most similar games (same distance as clustering)
    island_iterations: 300    # force-layout steps for cluster islands (positions rounded each step for determinism)
    island_unit: 1.0          # island radius scale
    min_bridge_links: 2       # draw a bridge between islands joined by at least this many nearest-neighbour links
rubric_scores:
  # Bootstrap intervals for the score correlations (score-correlations) and for rater agreement (rater-agreement), §5.6.
  # Percentile intervals; the seed is fixed so the build is deterministic (rater agreement uses seed + 1).
  bootstrap: 2000
  seed: 20261031
  interval: 0.95
second_coding:
  # Review findings D3, D6, D4: each mechanic's family, its admission, and each affects edge's effect type were coded
  # by the run that created the record, so agreement on them is unmeasured (§2.6). A second coder, independent of
  # every run that made or reviewed a coded record, codes this sample from sheets that give the written rules and
  # each item's description but not its code (scripts/coding.py, tasks/second-coding.md); analyze.py reports
  # agreement once codes exist in report/coding/, and nothing before.
  # The sample is stratified by the current code, with equal allocation so every family and effect is present and
  # per-category agreement is defined: per_family mechanics from each family and per_effect edges from each effect,
  # each stratum ordered by sha256(seed:id), and within an effect, edges of techniques not yet drawn first. The
  # mechanics serve both the family and the admission sheet, which also mixes in n_candidates new-mechanic proposals
  # the vocabulary has not taken up. Left out of the draw: the mechanics §2.1 names, since its rules use them as
  # worked examples, and items whose own text names their code. A balanced sample's kappa is not the catalog's,
  # whose categories are unequal. The lists below are the sample, drawn once on the date given by
  # `python scripts/coding.py draw`, so a later data change does not move it; `draw --check` redraws and compares.
  seed: 20261101
  bootstrap: 2000          # resamples of the coded items within each stratum, for the kappa and alpha intervals
  interval: 0.95
  sample:
    id: second-coding-v1
    drawn: '2026-10-31'
    per_family: 2
    per_effect: 6
    n_candidates: 12
    mechanics: [adjacency-scoring, async-shared-region, attribute-match-engine, causal-tooltips, contracts-orders,
      creature-care, day-night-cycle, diagnose-repair, faction-diplomacy, flight-aerodynamics, habitat-suitability,
      injury-body-model, interest-groups, lifecycle-aging, megaproject-sink, memories-thoughts, opinion-modifiers,
      periodic-ticks, permadeath, player-programming, procedural-characters, procedural-terrain, production-chain,
      random-disasters, request-provider-logistics, rival-firms, room-recognition, scouting-knowledge,
      seasonal-world-reset, signal-circuits, spoilage, stability-unrest, stat-combat-resolution, surface-work-tools,
      tech-tree, terrain-deformation, trait-inheritance, travel-mode-choice, triggered-event-chains, turn-structure,
      villager-requests, war-score-peace]
    candidates: [character-initiated-contact, deity-favor, heat-wanted-level, housing-population-growth,
      imagined-world-view, journey-pacing, land-expansion, moral-alignment, physical-carry-capacity, prestige-reset,
      skill-rating-matchmaking, worked-tile-yields]
    edges: [automated-playtesting/agent-pathfinding, automated-rule-generation/scenario-objectives,
      cicero-strategic-dialogue/natural-language-interaction, cicero-strategic-dialogue/reputation,
      constrained-decoding/dilemma-cards, continuous-alife-and-asal/trait-inheritance,
      differentiable-simulation/design-performance-rating, diffusion-game-engines/rigid-body-physics,
      gaussian-splatting/decoration-beauty, generalist-game-agents/tech-tree, generated-3d-worlds/rigid-body-physics,
      generative-agents/agent-inspection, genie-world-models/rigid-body-physics,
      graph-network-simulators/fluid-gas-simulation, graph-network-simulators/hydrology,
      imperfect-information-solvers/auctions, llm-agent-societies/offscreen-life-progression,
      llm-explanation-of-state/agent-inspection, llm-explanation-of-state/causal-tooltips,
      llm-explanation-of-state/stats-dashboards, llm-game-master/triggered-event-chains,
      llm-rule-adjudication/combination-discovery, llm-rule-adjudication/material-interactions,
      massively-parallel-simulation/traffic-congestion, mean-field-games/agent-pathfinding,
      ml-weather-models/forecasting, model-based-planning-muzero/policy-toggles,
      model-based-planning-muzero/tech-tree, monte-carlo-tree-search/rival-firms, muse-wham/generative-content,
      neural-rendering-shaders/embodied-skill-control, open-ended-environment-generation/adaptive-threat-scaling,
      open-interactive-video-models/vehicle-dynamics, quality-diversity-search/scenario-objectives,
      realtime-voice-models/social-exchanges, simulation-based-inference/supply-demand-pricing,
      simulation-based-inference/traffic-congestion, story-sifting/triggered-event-chains,
      subspace-neural-physics/soft-body-deformation, voyager-skill-libraries/agent-skills,
      voyager-skill-libraries/delegation-to-ai, wave-function-collapse/zoning]
book:
  rare_max_games: 10     # a mechanic used by at most this many catalog games counts as rare in the book's prose (chapter 1)
  subgenre_min_games: 6  # subgenres with at least this many games get a row in the subgenre-spend table (chapter 2)
techniques:
  # §7: techniques are collected for 2019 to 2026. One whose key result is older is kept as a historical exception
  # only when an in-window technique builds on it, a catalog game released in the window deploys it, or it cites a
  # non-encyclopedia source dated in the window (later work that extends or applies it); analyze.py names the reason.
  window_start: 2019
  # The TRL anchors (vocab/rubrics.yaml) and the maturity definitions (vocab/technique_maturity.yaml) describe the same
  # evidence: TRL 6 is a public playable demo or tech preview, which is the prototype definition; TRL 7 and 8 are a
  # commercial game, which is shipped (niche); TRL 9 is standard practice across titles, which is shipped (mainstream).
  # A technique whose TRL falls outside its maturity's range is listed in §7.1, not silently corrected: TRL is a rubric
  # score and changes only through an independent rating (AGENTS.md, ordinal scores).
  trl_by_maturity:
    research: [1, 5]
    prototype: [6, 6]
    shipped-niche: [7, 8]
    shipped-mainstream: [9, 9]
# Families whose mechanics are interface, pacing, control channels, or goal structure rather than modelled systems: their
# state is what the player is shown, the clock, a standing order, or unlocks and goals (the family rules of §2.1). §5.1 leaves them out of the
# head of the prevalence distribution (prevalence-sensitivity, "state-owning families only") and §8.2 out of the
# unreached share, both from this one list, so the two checks cannot drift apart (review E12, E37).
nonstate_families: [information-legibility, time-pacing, control-automation, progression-goals]
state_class:
  # Review D6: the family list above is a proxy. report/state-class.yaml classes every live mechanic as simulation state,
  # presentation, control, or meta-structure by written rules, and the build fails when it falls out of step with the
  # data. §5.1 (the head of the prevalence distribution and the unreached share of §8.2), §5.3 (pair coverage and the
  # lift ranking), and §5.4 (the clustering at the configured k) are re-run on the mechanics in the classes below and
  # read beside the full set. Nothing here changes a full-set number.
  keep: [simulation-state]
  # The subset's own fixed-margin null for pair coverage: the curveball trades, samples, burn-in, and thinning of
  # `cooccurrence`, on each game's simulation-state tags alone, from its own seed so the chain is not the full set's.
  null_seed: 20261101
exposure:
  # §8.2 robustness. The exposure weights are a deployment-weighted heuristic (vocab/rubrics.yaml composites); these
  # settings test how far the family ranking and the unreached share depend on them.
  # Frame-generating and video world models: separate records that make overlapping claims about the same mechanics.
  # The merged variant counts the group once per mechanic, at its largest member's weight.
  merge_world_models: [diffusion-game-engines, genie-world-models, muse-wham, open-interactive-video-models, physical-world-foundation-models]
  # Techniques whose own records say they change what is drawn and not simulation state ("all without touching
  # simulation state"; "the game's systems cannot read the new look"). The schema has no field for this yet.
  presentation_only: [neural-rendering-shaders, real-time-video-restyling]
  # A mechanic is technique-native when more than this share of the catalog games that use it are AI-native titles
  # (subgenre below) or deploy a technique in the set that affects it: its catalog evidence comes mostly from the
  # techniques themselves, so its exposure is close to definitional (review E20).
  technique_native_share: 0.5
  ai_native_subgenre: ai-native
  # The paper's claim about the economic core: these families rank at or below this place per mechanic.
  economic_core: [resources-production, logistics-networks]
  economic_core_min_rank: 16
  top_families: 4             # §8.2 names the top four families by summed exposure
perturbation:
  # Rater noise (review E22): each draw moves every ordinal input (a technique's maturity level, a mechanic's AI
  # leverage, an opportunity's impact, feasibility, and novelty) by -1, 0, or +1 anchor with equal chance, clipped to
  # the scale, and multiplies every weight by a factor drawn uniformly within +/- weight_spread. Where independent
  # raters scored the same mechanics, almost every disagreement was within one anchor (rater-agreement table).
  draws: 1000
  seed: 20261031
  weight_spread: 0.2
  interval: [0.05, 0.95]      # rank intervals report these quantiles of the perturbed ranks
  top_n: 8                    # §9 discusses the top eight opportunities
opportunities:
  # Review E19: feasibility 4 reads "feasible with known techniques and normal risk". As a sensitivity check (no
  # record changes), cap each opportunity's feasibility by the maturity in games of the most mature technique it
  # applies, and re-rank. A rating stays the rater's; changing one takes an independent verification run.
  feasibility_cap_by_best_maturity:
    research: 3
    prototype: 4
    shipped-niche: 5
    shipped-mainstream: 5
  # Review E25: a validation experiment states a compute budget when it names one of these (tokens per hour, a
  # latency in ms, first-token time, VRAM, frame time, or a per-player-hour figure).
  budget_pattern: 'tokens? per|\bms\b|first token|VRAM|frame-time|player-hour'
