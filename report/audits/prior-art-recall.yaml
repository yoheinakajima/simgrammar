# Known-item recall check of the prior-art searches behind the novelty scores (sixth review D13; §9.1).
#
# Made by run 2026-11-04-es-v6-revision (operator yoheinakajima, model claude-opus-5-5, Claude Code), through one agent
# of the same model on 2026-11-04. The sample is the opportunities in places 1 to 7 of the stored ranking, the three
# §9.4 starts with, and the drama-aware storyteller, whose genre calls the idea a storyteller: ten in all.
#
# Per opportunity, in this order:
# 1. Known items, listed from the opportunity's text and the agent's knowledge before it opened the logged search: up to
#    four shipped games, official releases, or mods that do the design, the prediction's defining feature, or a narrower
#    form (closeness design or feature), and adjacent work that would cap the score at 4.
# 2. Whether each known item is named in the entry (closest or also), and whether up to three of the entry's logged web
#    queries, run again, return it in their top ten results. Retrieved: named, or returned by a logged query.
# 3. Two or three queries with the words other genres use for the idea (advisor, storyteller, director, dynamic events),
#    and any game, official release, or mod they surface that the entry does not name, with its page and a quote from it.
# A find counts only if its own page shows it doing the feature. Finds that do the design or the feature were added to
# the entry's `also` list in report/audits/prior-art.yaml; none sets a ceiling below the entry's, so no score changed.
# scripts/analyze.py (_prior_art_recall) checks the ids and ceilings against the records and computes the §9.1 counts.
