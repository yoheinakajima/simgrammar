# Prior-art search behind each live opportunity's novelty score (review finding E31).
#
# Made by run 2026-11-01-es-v3-prior-art (operator yoheinakajima, model claude-opus-5-5, Claude Code). The searches were
# run by agents of the same model in the same run, in two rounds: seven agents searched every opportunity, the shared
# web-search budget ran out partway, and three more ran the searches that round missing for 21 entries (queries marked
# `round: 2`). The run re-fetched every quoted page before citing it. One entry per live opportunity; scripts/analyze.py (_prior_art) fails the build when an entry is missing,
# names a deprecated or unknown record, or falls out of step with the record.
#
# Each entry: the date of the search; the queries that were run and where (web search, Semantic Scholar or the arXiv
# API, Steam, itch.io, Steam Workshop, mod portals and the App Store); planned queries that could not be run (`not_run`,
# none left after round 2); the pages
# opened (`checked`); the closest prior art found, with its URL and, when the record cites it, its source id; further
# prior art (`also`); the stored novelty before and after; and the verdict against the novelty anchors in
# vocab/rubrics.yaml.
#
# kind:      game (a released game, commercial or free), official (an update, expansion, or tool its developer or the
#            platform owner released), mod (a released third-party modification or add-on), prototype (a public demo,
#            jam or research game, in-development or announced feature), research (a paper or lab demo), outside (a
#            product or deployment outside games).
# closeness: design (does the opportunity's core design, its thesis and the heart of its sketch), feature (does the
#            prediction's defining feature, read from its criteria without the date and review thresholds, or a
#            narrower form of it, or a narrower form of the design), adjacent (comes close without doing either),
#            none (nothing relevant).
# ceiling:   the highest novelty anchor the closest prior art allows, computed by analyze.py from kind and closeness with
#            the table in report/analysis.yaml (prior_art.ceiling): a game or official release that does the design
#            leaves 2 ("known idea, rarely executed well"); a game, official release, or mod that does the feature or
#            a narrower form, or a mod that does the design, leaves 3 ("new combination with partial precedents");
#            work that is only adjacent, or only a prototype, research, or outside games, leaves 4 ("no shipped
#            precedent; adjacent research exists"); nothing found leaves 5. Where the evidence sits between two
#            ceilings, the lower is taken (CONTRACT.md I5).
# novelty:   must equal the record's stored score and must not exceed the ceiling. A stored score above the ceiling was
#            lowered to it, by the run that made the original ratings (same operator and model), and the change is
#            disclosed in report/src/09-opportunities.md and in the run's method. No score was raised: where the
#            ceiling is above the stored score, the score stands.
# coverage:  full when a web search, a scholarly search, and (where a shipped game could exist) a storefront search
#            were run; partial otherwise, with a note.

