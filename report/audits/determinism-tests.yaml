# Determinism tests for every technique that runs during play (sixth review D1; §6.4).
#
# Made by run 2026-11-04-det-tests (operator yoheinakajima, model claude-opus-5-5, Claude Code) on 2026-11-04.
# The class says what happens to simulation state when the technique runs during play: whether a replay, a peer, or a
# branch can recompute what it did. Answer the tests in order; the class follows mechanically.
#
# Code the technique as its record describes it running during play. Where the record describes more than one form,
# code the most reproducible one and say so in the note: the class records what the technique allows, and which form a
# given title chose is a fact about that title. (The tests both coders were given said this only of a form the
# developer can pin against one it cannot. The blind coder read it to cover a form that recomputes against one that
# needs a setting, such as an iteration budget against a time budget; the run's own coding did not. Those were the only
# class differences between the two, on four techniques, and they are coded the blind coder's way.)
#
# enters_state (yes/no). Does its runtime output enter simulation state: anything the game saves, re-simulates from
#   inputs, or keeps in sync between peers, including anything that later changes what agents, rules, or the world do?
#   Output only seen or heard by the player (pixels, audio, a text answer that nothing in the game reads back) is no.
#   A generated frame that is the world, because the next frame is generated from it, is yes.
#   If no: preserves (replay, lockstep and saves never read it), and the other three answers are na.
# recompute (yes/no). On one machine, given the same game seed and the same inputs, does it give the same output with
#   no further measure? Yes for symbolic algorithms, draws from the game's own seeded random generator, and fixed-weight
#   networks evaluated without sampling (a forward pass, an argmax, a fixed search budget). No when it samples from its
#   own unseeded noise or tokens, or depends on a wall-clock budget, call timing, or another party's service.
#   If yes: preserves, and pinnable is na.
# pinnable (yes/no). If recompute is no: can the developer make it recompute on one machine by fixing what it controls,
#   namely the sampler seed, weights it can run itself (released weights, or its own), batch size and kernel settings,
#   or a cache whose entries are all built before play? If yes: mitigable; if no: breaks, and `fails` names why.
#   It fails for a model reachable only through a third party's service (fails: service; the developer cannot fix its
#   weights, batching, or seed, and such services drift even at temperature zero), for output that depends on timing
#   (fails: timing; concurrent calls racing, wall-clock budgets, live audio and voice-activity timing), and for a cache
#   filled during play by a model that is not itself pinnable (that cache is a log). A cache filled during play by a
#   pinnable model is recomputable, so it passes.
# cross_machine (yes/no/na). With those settings fixed, would different hardware, drivers, or OS give bit-identical
#   output? Floating-point GPU inference generally does not; integer, fixed-point, and CPU symbolic algorithms
#   generally do; lookups into a cache built before play do. na when enters_state is no or the class is breaks.
#
# Derived, not answered: lockstep without streaming = enters_state no, or cross_machine yes. Counterfactual
# re-simulation = the class is not breaks. Replay of a recorded session from a log of the technique's outputs works for
# every technique, so it separates none of the classes. Offline-only techniques preserve by definition.
#
# class_before is the record's class before this run. first_recode is the class a blind agent of the same model gave
# under the looser tests the previous version printed (same seed and inputs; else a fixed seed or a bounded cache), from
# the records without their limitations; it agreed with class_before on 14 of 35 and showed three gaps these tests
# close: output that never enters state, which form to code, and fixed-weight networks. run_coded is the class this
# run's answers gave before it read the second blind coding, and blind holds that coding's answers: a second agent of
# the same model, given these tests and the records (summary, mechanism, key results, limitations, deployments, edge
# notes) with every sentence that states a determinism judgment removed. The answers above are the adjudicated ones.
# scripts/analyze.py (_determinism_tests) derives each class from them, fails the build when a record's
# determinism_impact differs or an offline-only technique does not preserve, and counts §6.4's figures and the
# agreement of the codings.
