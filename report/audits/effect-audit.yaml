# Effect audit: every live technique-to-mechanic `affects` edge checked against the precedence rules of section 8.1
# (review D4, second bullet). analyze.py (_edge_audits) reads this file; the build fails when a live edge has no entry,
# an entry names an edge that does not exist, or an entry's effect differs from the record's.
#
# Rules. Section 8.1 gives each edge one effect: the first of these that the edge's note supports, in this order:
# replaces-substrate (the technique computes the mechanic's state or decisions in place of its existing rule while the
# mechanic keeps its role in play), enables-new (the note claims an output the old rule could not produce at any cost),
# explains (the output is addressed to the player's understanding of the mechanic's state or causes), deepens (the same
# mechanic gains fidelity, scale, or variety at runtime), accelerates (the same output for less runtime compute),
# cuts-authoring-cost (it makes content the mechanic consumes), tunes (it sets or tests the mechanic's parameters).
# Three readings decide the close cases. A technique that only supplies a mechanic's inputs (profiles, parameters) does
# not replace its substrate. Where a note claims new possibilities as well as a new engine, enables-new is read as the
# role changing, so replaces-substrate does not apply. For the three technique-native mechanics of section 8.3
# (generative-content, natural-language-interaction, gossip-propagation), whose catalog games already run on the
# technique family, a further result of that family deepens the mechanic rather than replacing its substrate.
#
# Fields. effect: the label stored now. compliant: whether the label as first coded met the rules (true or false).
# was: the first-coded label, when this audit corrected it. secondary: another effect the note also supports, or null.
# ahead: present when the stored label still does not meet the written order; the label the order would put first.
# added: the edge was added by the keyword sweep (edge-sweep.yaml), so it has no first-coded label.
#
# Corrections. A label was corrected when the note does not support it (an enables-new edge whose note claims no new
# form, a design-time change coded as a runtime one) or when the note states outright a label that comes before it
# (explanation addressed to the player, a form the old rule 'no longer' limits). One boundary was not corrected: an
# edge whose note says the technique computes the mechanic in place of a named rule and also that the mechanic gets
# richer (or cheaper). The written order puts replaces-substrate first; the labels were coded deepens (or accelerates)
# for the richer behavior. The disagreement is systematic, so it is a question about which of the two states the
# convention, not a set of isolated slips, and those edges keep their label with replaces-substrate ahead, for a
# second rater to settle; where another label also comes before the stored one whatever the boundary, the label was
# corrected to it and replaces-substrate stays ahead. Other edges left non-compliant say which label arguably comes
# first and why the note does not settle it.
#
# Made by run 2026-11-01-es-v3-edge-audits (operator yoheinakajima, model claude-opus-5-5), the same rater that wrote the edges and the
# rules, reading only each edge's note. It tests whether the labels follow the written rules, not whether another
# rater would agree with them.
