# Keyword sweep for technique edges missing from the most-used unreached mechanics (review E2, second bullet).
# analyze.py (_edge_audits) reads this file; the build fails when it names a mechanic, technique, or source that does
# not exist, when a missing-edge hit's technique lacks that edge or does not cite the source, or when the counts below
# disagree with the hits. The paper asserts that the swept mechanics are still the most-used unreached ones and that
# every source a live technique cites was searched, so a data change that breaks either fails the build there.
#
# Selection. Mechanics with no affects edge before this sweep, ranked by the number of catalog games that use them;
# the top ten, with every mechanic tied with the tenth. Keywords were written for each before any text was searched:
# the mechanic's name, its aliases field, and obvious synonyms, each a case-insensitive regular expression matched on
# whole words in the source text after whitespace was collapsed and words hyphenated across PDF lines were joined.
#
# Sources. Every source a live technique cites, read in full where possible: arXiv's HTML, else its PDF (text taken
# with PDFKit), else the cited page, its Wayback Machine copy, or an author or repository copy of the same paper.
# The texts were cached outside the repository. A match inside another match for the same mechanic counts once.
#
# Verdicts, one per hit, read in context. missing-edge: the citing technique changes the mechanic as section 8.1
# defines it (one of the seven effects). mention: the passage concerns the mechanic's subject in a game, a simulation,
# or the real system it models, but the citing technique does not change the mechanic (an agent that mines as a
# player, a testbed game that has the mechanic, a change already recorded on another edge). false-hit: the word is
# used in another sense (a compute budget, a reproduced result, data mining, a research landscape). Hits that read the
# same are grouped; each group gives one verdict and reason and keeps every hit's quote, the matched word with about
# forty characters either side.
#
# Made by run 2026-11-01-es-v3-edge-audits (operator yoheinakajima, model claude-opus-5-5), the rater that wrote the edges. The sweep
# finds false negatives only inside sources the atlas already cites, and only where a keyword appears.
run: 2026-11-01-es-v3-edge-audits
selection:
  rule: unreached before the sweep, ranked by catalog games; the top ten and every mechanic tied with the tenth
  top: 10
  mechanics: [variable-speed, free-placement, budget-treasury, modding-api, resource-extraction, needs-decay, crop-cultivation, lifecycle-aging, power-grid, permadeath, terraforming]
keywords:
  variable-speed:
    name: ["pause", "paused", "pauses", "pausing", "speed control"]
    aliases: ["real[- ]time with pause", "time compression", "fast[- ]?forward(s|ed|ing)?"]
    synonyms: ["game speed", "simulation speed", "speed multipliers?", "time[- ]?scales?", "slow[- ]?motion", "speed(s|ing)? up (the )?(game|simulation|time|clock)", "tick rates?"]
  free-placement:
    name: ["building placement", "placement", "plac(e|es|ed|ing) (a |the |new )?(buildings?|structures?)"]
    aliases: ["plop(s|ped|ping)?", "construction placement", "grid placement"]
    synonyms: ["build(ing)? mode", "footprints?", "snap(s|ped|ping)? to (the )?grid"]
  budget-treasury:
    name: ["treasury", "treasuries", "budget(s|ed|ing|ary)?"]
    aliases: ["cash[- ]flows?", "budget panel"]
    synonyms: ["tax(es|ed|ation)?", "upkeep", "income", "expenses?", "expenditures?", "money", "deficits?", "debts?", "bankrupt(cy)?"]
  modding-api:
    name: ["modding", "mods?", "modded", "modders?"]
    aliases: ["mod support", "scripting api", "data[- ]driven modding"]
    synonyms: ["user[- ]generated content", "ugc", "plug[- ]?ins?", "scripting", "level editors?", "community[- ](made|created)"]
  resource-extraction:
    name: ["resource extraction", "extract(s|ed|ing)? (raw )?(resources|materials|ore)"]
    aliases: ["harvest(s|ed|ing)?", "gather(s|ed|ing)?", "mining", "mine(s|d)?"]
    synonyms: ["ores?", "lumber", "wood ?cutting", "chop(s|ped|ping)? (down )?(wood|trees?|logs?)", "quarr(y|ies|ying)", "drills?"]
  needs-decay:
    name: ["needs? decay", "needs? meters?"]
    aliases: ["motives?", "need bars?"]
    synonyms: ["hunger", "hungry", "thirst", "thirsty", "fatigue", "tired(ness)?", "sleepiness", "(basic|physiological|bodily|survival|agent|character) needs", "energy levels?"]
  crop-cultivation:
    name: ["crops?", "cultivat(e|es|ed|ing|ion)"]
    aliases: ["farm(s|ed|ing|er|ers|land)?", "grow(s|ing|n)? (crops|plants|food|wheat)", "agricultur(e|al)"]
    synonyms: ["plant(s|ed|ing)? (seeds?|crops?|trees?)", "sow(s|ed|ing|n)?", "irrigat(e|ed|ion)", "wheat", "saplings?"]
  lifecycle-aging:
    name: ["life ?cycles?", "aging", "ageing"]
    aliases: ["life stages?", "birth and death"]
    synonyms: ["births?", "old age", "elderly", "lifespans?", "life spans?", "offspring", "mortality", "grow(s|ing)? up", "reproduc(e|es|ed|ing|tion)"]
  power-grid:
    name: ["power grids?", "power networks?"]
    aliases: ["electricity networks?", "electric(al)? grids?"]
    synonyms: ["electricity", "power (plants?|lines?|stations?|supply|demand)", "power generat(or|ors|ion)", "blackouts?", "brownouts?", "energy (grids?|networks?|supply|demand)"]
  permadeath:
    name: ["permadeath", "perma-death"]
    aliases: ["permanent(ly)? (death|dies|dead)", "ironman", "hardcore mode"]
    synonyms: ["deaths?", "die(s|d)?", "dying", "game over", "roguelikes?", "save (file|game)s?", "reload(s|ed|ing)?"]
  terraforming:
    name: ["terraform(s|ed|ing)?"]
    aliases: ["landscap(e|es|ed|ing)", "terrain edit(s|ing|or)?", "raise and lower"]
    synonyms: ["terrain (modification|deformation|sculpting|shaping)", "(deformable|destructible|editable) terrain", "sculpt(s|ed|ing)?", "excavat(e|es|ed|ing|ion)", "dig(s|ging)?", "flatten(s|ed|ing)? (the )?(land|terrain|ground)"]
added_edges:
- technique: llm-agent-societies
  mechanic: needs-decay
  effect: replaces-substrate
  sources: [src-piao-2025-agentsociety, src-vezhnevets-2023-concordia]
  support:
  - source: src-piao-2025-agentsociety
    locator: section 3.2, Emotion, Needs, and Cognition
    quote: "This needs hierarchy is continuously updated based on three interrelated factors: the agent’s active behaviors, uncontrollable or passive external events, and its current psychological states."
  - source: src-vezhnevets-2023-concordia
    locator: section 2.1, Generative agents
    quote: "If we want to model the agent’s physiological state, we add components that describe the agent’s level of thirst and hunger, health and stress levels."
