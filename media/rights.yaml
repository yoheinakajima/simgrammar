# Rights register for footage and images used in media/ (checked before any release).
# status: unchecked | allowed | allowed-with-conditions | not-allowed. policy_url is the page read; checked is the
# date it was read, or for an unchecked title the date a search found nothing usable; note says what the policy
# allows or why the title is still unchecked. Policies were read once, on 2026-10-25, by a research agent; two
# (Factorio, RimWorld) were re-read by hand. Read each again before footage is captured for release.
# Before a monetized release: Gran Turismo 7 is not allowed, so episode 6 uses a graphic in its place; Elite Dangerous and Tropico 6 allow
# non-commercial use only, so ask Frontier and Kalypso first; Paradox titles exclude Gold FM (Cities: Skylines) and
# the Sabaton soundtrack (Europa Universalis IV), so mute or replace in-game music; Microsoft, Mojang and CCP require
# their disclaimer wording in the description; iRacing requires its watermark. The 37 unchecked titles need a
# written request to the rights holder or stills from a source that grants reuse.
# used_in: e = episode, s = short (e03 = episode 3, s004 = short 4). Stills and diagrams count; mock-ups of features
# a game lacks must be labelled on screen.
titles:
