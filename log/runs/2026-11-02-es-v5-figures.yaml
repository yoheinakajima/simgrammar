nd the largest-cluster line crossed the threshold label. The axis now runs at least to -0.25 with the zero line marked, the caption explains why one axis serves both measures, and the label is placed where no curve or other label crosses it. D28: the cluster table''s dominant-subgenre cell named the first of tied subgenres in member order; C14 has six subgenres with one game each. The cell now reads none dominant when every subgenre ties, names all subgenres tied for the most, and counts a tie for second place instead of naming one, and the table''s description says so. No record, score or statistic changed, and no prose was edited.'
