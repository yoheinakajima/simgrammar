id: 2026-10-31-tag-audit
type: run
kind: maintenance
date: '2026-10-31'
actor: agent
operator: yoheinakajima
agent:
  model: claude-opus-5-5
  harness: Claude Code (desktop app)
purpose: 'At the operator''s request: look for catalog games that contradict the book''s, videos'' and
  paper''s ''no game has both'' and ''only one game'' sentences, add the mechanic tags those games are
  missing, and rewrite the sentences the corrected tags make false.'
method: 'An outside review found that sentences saying no catalog game, or only one, combines two mechanics rested on missing tags. Every cooccur and rank.whitespace assertion in report/src, book/src and media (26 mechanic pairs) was listed with the games tagged on one side only, and each likely counterexample was checked against the game''s own cited sources, fetched for this run. A tag was added only where a source states the rule system: budget-treasury on 23 city builders, tycoons and business sims; production-chain and resource-extraction on Timberborn; resource-extraction on Banished; lifecycle-aging and resource-extraction on Dwarf Fortress; triggered-event-chains and scenario-objectives on Frostpunk; tech-tree on RimWorld; content-sharing on Space Engineers and Cities: Skylines; scenario-objectives on Tropico 6 and This War of Mine. Three sources were opened and added (Two Point Hospital and Frostpunk on Steam, the Dwarf Fortress Wiki page on age), and Caesar III now cites the Pharaoh article, which names Caesar III''s Senate as its treasury. The LLM-written skill libraries technique gained a tunes edge to production chains from its own Factorio Learning Environment result, re-checked against the paper''s abstract (agents found electric drilling and failed at electronic-circuit manufacturing); the Voyager paper itself was not re-opened. Purses without upkeep, wages or debt (Stardew Valley) stay untagged. Tags with no supporting source were left off and are listed in the proposals. Elite keeps procedural-terrain, whose definition is a map generated from a seed; the prose now says it generated a map of star systems rather than terrain. The corrected tags moved the clustering rule''s pick from 24 to 17, so k was re-selected by the rule (report/analysis.yaml) and W107 is silent. The build then failed 73 assertions; each sentence was rewritten to what the data now says, with its assertions updated: seven chapters, three paper sections, seven episodes, four shorts, the film, and four opportunity theses. Chapter 9''s section on two kinds of city builder described a tagging artifact and was removed. Several ''stands apart'' cluster claims no longer meet the 0.1 co-clustering bound at k=17 and now state the measured share instead. scripts/analyze.py gained three statistics for paper section 8.2: opportunity-mechanic pairs, the pairs that none of the opportunity''s techniques reaches, and the share of uses left unreached once a mechanic an opportunity proposes a technique for counts as reached. Changed narration in the episodes and shorts needs re-voicing before the site stops marking those scenes. The 37 narration lines whose wording changed in this run and in run 2026-10-31-review-corrections were re-voiced (two takes each; the take nearer the series'' pace is listed in media/narration.yaml), all 12 episodes and 12 shorts were re-rendered, and media/published.yaml names release videos-2026-10-31.'
contract_version: '1.2'
proposals:
- kind: other
  target: tag-audit-follow-up
  detail: 'Likely tagging gaps this run could not source: RimWorld and Going Medieval production-chain (workbench bills chain raw goods into components, beer, and meals), Banished production-chain (blacksmith and tailor), Factorio scenario-objectives (its scenarios), Cities: Skylines and Cities: Skylines II terraforming (landscaping tools), Anno 1800 and Anno 117 budget-treasury (coin balance with upkeep), Europa Universalis IV and Crusader Kings III budget-treasury (ducats and gold with income, loans, and debt), Frostpunk 2 triggered-event-chains (narrative events). Each would falsify a sentence in chapter 9 or move a white-space rank; a catalog run should open a primary source for each.'
- kind: rule
  target: opportunity-reach-warning
  detail: 'The review suggested a validator warning when an opportunity''s techniques have no affects edge to its mechanics. 114 of 204 pairs would warn, most by design, since an opportunity proposes an application no result has made yet. This run reports the count in paper section 8.2 instead; a warning would need a way to mark a pair as proposed.'
