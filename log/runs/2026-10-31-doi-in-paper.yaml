  paper page prints it beside the version, in the cite chips and in the build receipt, and the PDF prints it under
  the paper's address on the title page, each as a doi.org link and each only when report/meta.yaml has a doi. The
  PDF was rebuilt with `make pdf` and its first page rendered and read. On Zenodo, the v0.3 record was edited from
  software to dataset, the type CITATION.cff gives, and Zenodo's public API now reports dataset with both DOIs and
  the archived zip unchanged. Each future release's record will again be filed as software, because Zenodo's GitHub
  integration does not read the CFF type.
