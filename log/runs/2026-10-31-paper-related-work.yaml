  agent-inspection, alerts-feed and data-overlays definitions, Appendix C as a data-availability statement
  (LICENSE, CITATION.cff, ADR-0008, the Pages workflow''s /dist/ and zip), and one robustness sentence in
  5.6. Computed in scripts/analyze.py: on mechanics whose legibility and emergence_potential both carry the
  creating run''s rating and a rating from a run independent of it (lower median if several), Spearman rho
