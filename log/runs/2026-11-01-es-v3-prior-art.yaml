    says Papers, Please is limited by hand-built document sets (its entrants are generated). This run
    may edit only precedent, claims, sources and novelty, so a later run should qualify those sentences.
- kind: other
  target: report/audits/prior-art.yaml
  detail: 21 entries have partial coverage because the session's web-search budget ran out; each lists
    the queries that did not run. A follow-up run with a fresh budget should run them and Semantic Scholar
    (HTTP 429 here), and lower any score the closer prior art requires.
- kind: other
  target: report/src/02-method.md, book chapter 13
  detail: Both say every opportunity is asserted because an opportunity is an argument with no source
    to cite. Opportunities now cite sources for their prior art and stay asserted because those sources
    document other work, not the argument; the sentences should say so.
