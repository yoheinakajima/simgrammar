method: |-
  E31 (prior art). Same operator and model as the opportunities' raters, so these are the original rater's corrections, not a second rating. Seven agents of this model searched six opportunities each: queries written first, then web search, Semantic Scholar (mostly HTTP 429; the arXiv API instead), Steam, itch.io, Steam Workshop and mod portals; they opened the top results and named the closest prior art. The shared web-search budget ran out partway, so 21 entries have partial coverage and say which searches did not run. This run re-fetched each quoted page with check_sources.py's fetcher (85 of 85 quotes found) and wrote report/audits/prior-art.yaml: queries, places, pages opened, closest prior art with URL, verdict.

  Rule (that file's header; table in analysis.yaml prior_art.ceiling): a game or official release doing the core design leaves novelty 2; one doing the prediction's defining feature or a narrower form, or any mod, leaves 3; prototypes, research and work outside games, 4; nothing, 5; between two, the lower. Lowered 15 scores above the ceiling. 5 to 3: llm-society-terrarium (SpaceMolt, AI Society), symbolic-sim-neural-render (DLSS 5, Oasis 2.0 mod), specification-programming-games (Agents! Please?), dream-replay-layer (RimWorld AI-art mod, Sims 3 Generations), mechanic-discovery-search (Yavalath, A Puzzling Present). 4 to 3: agent-ambassadors-async (SpaceMolt, Drivatars), causal-why-query (EchoColony, AskAPawn), branch-preview-forecasts (Wesnoth attack prediction), mean-field-crowds (Planet Coaster crowd), natural-language-legislation (EQUILIBRIUM), placement-that-tells-stories (Heard of the Story?), human-calibrated-customers (The Political Machine 2024), teachable-sim-companion (Autonauts, Black & White), open-ended-evolution-sandbox (Vivarium). 3 to 2: generated-inspection-shifts (Papers, Please; The Imperial Gatekeeper). None raised. Records gained 85 quoted claims, 42 new sources, and catalogued precedents (black-and-white, inzoi, infinite-craft, gran-turismo-7). analyze.py _prior_art fails the build on a missing entry, a deprecated id, a score that differs from or exceeds its entry, or uncited shipped prior art. Rewrote 7.1, 9.1, book chapter 10.

  E17 (TRL). automated-rule-generation, llm-explanation-of-state and story-sifting were prototype at TRL 5. Their evidence (GAVEL games playable on the Ludii portal, the Total War: PHARAOH advisor NVIDIA shows as a preview, Viv in open beta) fits the prototype definition and the TRL 6 anchor, so TRL was wrong; set to 6. A verification run needs another operator (E035); none is available.

  At the coordinator's request: rewrote the thesis clause the prior art contradicts in llm-society-terrarium, natural-language-legislation, placement-that-tells-stories and generated-inspection-shifts; the abstract's Finding 6 sentence (its why-query top share is now 84, not over 90); and the reason section 2 and book chapter 13 give for asserted opportunities. Open: the searches the budget stopped.
