purpose: Document the prior-art search behind every live opportunity's novelty score, correct the scores
  the search shows are above the anchors, and correct the three technique TRLs that break the written
  TRL-maturity correspondence.
method: |-
  E31 (prior art). Same operator and model as the runs that rated the opportunities, so the corrections are the original rater's under the written anchors, not a second rating. Seven agents of this model searched six opportunities each: queries written first, then web search, Semantic Scholar (mostly HTTP 429, so the arXiv API stood in), Steam, itch.io, Steam Workshop and mod portals; they opened the top results and named the closest prior art. The shared web-search budget ran out partway, so 21 entries have partial coverage and say which searches did not run. This run re-fetched every quoted page with check_sources.py's fetcher (85 of 85 quotes found) and wrote report/audits/prior-art.yaml: queries, places, pages opened, closest prior art with URL, verdict.

  Rule (that file's header; table in analysis.yaml prior_art.ceiling): a game or official release doing the core design leaves novelty 2; one doing the prediction's defining feature or a narrower form, or any mod, leaves 3; prototypes, research and work outside games, 4; nothing, 5; between two, the lower. Lowered 15 scores above the ceiling. 5 to 3: llm-society-terrarium (SpaceMolt, AI Society), symbolic-sim-neural-render (DLSS 5, Oasis 2.0 mod), specification-programming-games (Agents! Please?), dream-replay-layer (RimWorld AI-art mod, Sims 3 Generations), mechanic-discovery-search (Yavalath, A Puzzling Present). 4 to 3: agent-ambassadors-async (SpaceMolt, Drivatars), causal-why-query (EchoColony, AskAPawn), branch-preview-forecasts (Wesnoth attack prediction), mean-field-crowds (Planet Coaster crowd), natural-language-legislation (EQUILIBRIUM), placement-that-tells-stories (Heard of the Story?), human-calibrated-customers (The Political Machine 2024), teachable-sim-companion (Autonauts, Black & White), open-ended-evolution-sandbox (Vivarium). 3 to 2: generated-inspection-shifts (Papers, Please; The Imperial Gatekeeper). None raised. Records gained 85 quoted claims, 42 new sources, and precedent edges where the game is catalogued (black-and-white, inzoi, infinite-craft, gran-turismo-7). analyze.py _prior_art fails the build on a missing entry, a deprecated id, a score that differs from or exceeds its entry, or uncited shipped prior art. Rewrote sections 7.1 and 9.1 and book chapter 10.

  E17 (TRL). automated-rule-generation, llm-explanation-of-state and story-sifting were prototype at TRL 5. Their evidence (GAVEL games playable on the Ludii portal, the Total War: PHARAOH advisor NVIDIA shows as a preview, Viv in open beta) fits the prototype definition and the TRL 6 anchor, so TRL was wrong; set to 6. A verification run needs another operator (E035); none is available.

  Failed or open: the searches the budget stopped; the abstract's why-query assertion (top share 90) now fails at 84 and is left to the coordinator, who owns the abstract.
contract_version: '1.2'
proposals:
- kind: other
  target: data/opportunities thesis text
  detail: The search found prior art that some theses deny. llm-society-terrarium says agent societies
    are research demos, not games (SpaceMolt and AI Society shipped); natural-language-legislation says
