purpose: Give the ten prediction criteria whose console clause set no audience size a public sales or player bar, before any prediction resolves, closing the console-clause item of the agenda.
method: >-
  Listed the criteria that let a console release stand in for a Steam review count (ten, of which eight use a 1,000-review
  bar and two a 5,000-review bar; one, the player-market prediction, had already gained its review bar on 2026-11-01).
  Read two published estimates of Steam sales per review (impress.games 2023, GameDiscoverCo 2020) and took the
  2023 one, which puts recent ratios at 20 to 50 sales for each review, as the basis, recorded as source
  src-gwinnell-2023-steam-benchmarks with its quote checked on the live page. Set the console bar at 20 times the review
  bar, the low end of that range, so the console bar is no harder to meet than the review bar it stands in for: 20,000
  copies sold or players reported by a public source for a 1,000-review bar and 100,000 for a 5,000-review bar. Added
  that text to each criterion directly after "console release", so the change only adds a condition: a title that meets
  the new criteria met the old ones, and since no prediction has resolved, no outcome moves. Recorded each change as an
  audience_bar entry (date and added text) in report/predictions.yaml, gave the reference classes the same bar, and
  appended this run to each record's provenance.reviewed. scripts/analyze.py now validates audience_bar like amended
  (the added text must be in the criteria) and counts the bars, their date, the predictions resolved by then, and the
  console clauses still without a bar, which the paper asserts is zero. Updated paper §11 and §11.1 and book chapter 12.
