method: 'The operator approved the spend. A digest check of every narration line against the captions of the last render (video-out/out, release videos-2026-11-01) found eight scenes whose text changed after v0.5 merged: episode 4 scene 11, episode 7 scenes 5, 7 and 8 and short 7 (the effect relabelling of run 2026-11-01-es-v3-edge-audits), and episode 9 scenes 6 and 10, episode 7 scene 7 and episode 11 scene 4 (run 2026-11-02-es-v3-integration). Each was voiced twice through the ElevenLabs connector with voice Marcus and model eleven_v4 in the series flows (4,696 characters, 9,392 credits), and the take whose length was nearer the series pace (characters / 16.96 seconds for episodes, / 16.15 for shorts) was kept and listed in media/narration.yaml; the replaced audio is kept in a local backup. All 24 videos were re-rendered with scripts/video/assemble.py (ffmpeg 6.1), and a second digest check against the new captions found no stale line. scripts/video/publish.py wrote media/published.yaml for release videos-2026-11-02, created in yoheinakajima/simgrammar-media with its 60 files, which Zenodo does not archive. The film was not re-rendered: it is not published, and its only change is two token values in its opening.'
