affects:
- id: embodied-skill-control
  effect: accelerates
  note: 'Presentation path only: super resolution renders each frame at lower resolution and reconstructs
    it, so a GPU-bound flight or driving sim draws more real frames per second on the same hardware and
    a skill flown or driven by eye gets more frequent visual feedback. The vehicle model and its update
    rule are unchanged, and frame generation does not help: generated frames sample no new input and add
    latency that hurts precise hand-flying or driving.'
- id: day-night-cycle
  effect: deepens
  note: 'Presentation path only: neural denoising and the neural radiance cache make dynamic multi-bounce
    lighting affordable, so player-built interiors and towns are lit correctly at every hour of the cycle,
    where baked lighting cannot follow player construction. The cycle''s clock, and whatever the simulation
    reads from it, such as schedules or visibility values, are unchanged.'
- id: decoration-beauty
  effect: deepens
  note: 'Changes the asset budget the mechanic draws on, not its scoring: up to 7x VRAM savings from neural
    texture compression and cheaper layered materials let more distinct high-detail decor assets be resident
    at once, so a beauty-driven builder can offer and show more variety. Beauty values and the rules that
    read them are unchanged.'
deployed_in:
- microsoft-flight-simulator-2020
- cities-skylines-2
limitations:
- 'Changes presentation, not simulation: CPU-bound simulation games (agent counts, pathfinding, economy
  ticks) gain nothing from GPU-side neural rendering.'
- Frame generation adds input latency and artifacts; DLSS 5's final pass reportedly costs 50 to 60 percent
  of frame rate and can alter art direction.
- 'Hardware-gated: Multi Frame Generation and DLSS 5 require RTX 50-series GPUs at launch, and neural
  shader features depend on vendor SDKs and cooperative vector support.'
