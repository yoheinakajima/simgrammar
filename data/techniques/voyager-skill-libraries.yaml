id: voyager-skill-libraries
type: technique
name: LLM-written skill libraries (Voyager)
aliases:
- Voyager
- code-as-skill
- lifelong learning agent
summary: An LLM agent that proposes its own next task, writes executable code to do it, refines the code
  from execution errors and self-checks, and stores verified programs in a retrievable skill library.
category: llm-agents
year: 2023
mechanism: Voyager drives a Minecraft bot through a JavaScript control API. An automatic curriculum asks
  GPT-4 for the next task given inventory, surroundings, and completed tasks, aiming to discover as many
  diverse things as possible. For each task GPT-4 writes a function that may call existing skills; the
  function runs, and the agent feeds back environment observations, execution errors, and a GPT-4 self-verification
  verdict, retrying up to four rounds before moving on. Verified functions are stored in a skill library
  indexed by an embedding of their description and retrieved (top-k) when writing later functions, so
  complex behaviors are composed from earlier ones. No model weights are trained; all learning is in the
  growing code library, which can be reused in a new world.
key_results:
- text: Against prior LLM agents, Voyager obtained 3.3x more unique items, traveled 2.3x longer distances,
    and unlocked tech-tree milestones up to 15.3x faster, discovering 63 unique items in 160 prompting
    iterations.
  sources:
  - src-wang-2023-voyager
  confidence: high
- text: The learned skill library let a fresh agent solve novel tasks in a new Minecraft world from scratch,
    where baselines struggled.
  sources:
  - src-wang-2023-voyager
  confidence: high
- text: 'Code generation quality was the bottleneck: replacing GPT-4 with GPT-3.5 for code produced 5.7x
    fewer unique items, while GPT-4 cost 15x more per token.'
  sources:
  - src-wang-2023-voyager
  confidence: high
- text: In the 2025 Factorio Learning Environment, LLM agents writing code found growth strategies such
    as electric drilling but failed at complex automation such as electronic-circuit production, with
    weak spatial reasoning and error recovery.
  sources:
  - src-hopkins-2025-factorio-learning-environment
  confidence: medium
