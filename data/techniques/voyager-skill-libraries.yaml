affects:
- id: player-programming
  effect: enables-new
  note: The player can describe a behavior in language and the model writes, tests against the live game,
    and saves the program, so player code becomes a growing library of named skills rather than hand-typed
    scripts.
- id: agent-skills
  effect: enables-new
  note: An NPC's competence can be an accumulating library of composable, verified routines it wrote itself,
    so skill growth adds new behaviors rather than raising a numeric speed or quality level.
- id: delegation-to-ai
  effect: enables-new
  note: A delegated controller can acquire routines for situations its designers did not code by writing
    and verifying new functions, instead of running the fixed opponent-AI logic restricted to a subsystem.
- id: tech-tree
  effect: tunes
  note: Exploration agents that unlock milestones 15.3x faster than earlier agents can be run as automated
    playtesters to measure how quickly and in what order a progression graph gets traversed.
- id: programming-by-demonstration
  effect: deepens
  note: Demonstrated routines can be stored as verified, reusable code skills that generalize to new locations.
- id: production-chain
  effect: tunes
  note: Code-writing agents can play a factory game's production chains as automated testers; in the Factorio
    Learning Environment they found growth strategies such as electric drilling but failed at multi-step chains
    such as electronic-circuit manufacturing, so they can probe early chains but not deep ones yet.
builds_on: []
deployed_in: []
limitations:
- Depends on a frontier code model; GPT-3.5 produced 5.7x fewer items and GPT-4 cost 15x more per token,
  so per-agent cost is high.
- 'Hallucinated tasks and calls: the curriculum proposed items that do not exist (copper sword), and generated
  code used invalid inputs or functions absent from the API, causing execution errors.'
- Self-verification misjudges success (for example not recognizing a dropped string as proof a spider
  was defeated).
- Needs a scripting API that exposes game actions and state as text; it does not act from pixels.
- Long-horizon factory building in Factorio still fails at multi-step automation and spatial layout.
