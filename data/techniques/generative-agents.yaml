affects:
- id: memories-thoughts
  effect: enables-new
  note: Memories become free-text records with LLM-rated importance, retrieved by recency, importance,
    and relevance, plus reflections that summarize many records into beliefs, instead of a fixed catalog
    of timed mood modifiers.
- id: daily-schedules
  effect: replaces-substrate
  note: Each agent writes its own day plan from its description and memories, decomposed into hour and
    5-15 minute steps and revised on events, in place of authored routine tables; the player still sees
    rhythms of work, meals, and leisure.
- id: utility-action-selection
  effect: replaces-substrate
  note: The next action is chosen by prompting with the current plan step, perceived surroundings, and
    retrieved memories rather than by scoring options against need curves, so choices can reference past
    events and other agents.
- id: gossip-propagation
  effect: deepens
  note: Information moves through generated conversations whose content comes from memory retrieval, so
    what spreads, to whom, and how it is reworded emerge from dialogue; in Smallville party awareness
    rose from 4% to 52% of agents with 1.3% hallucinated answers.
- id: relationship-values
  effect: replaces-substrate
  note: Relationships are held as remembered interactions and reflections about another agent rather than
    a numeric affinity, so a relationship's state is a set of retrievable facts; Smallville's acquaintance
    network density rose from 0.167 to 0.74 in two days.
- id: social-exchanges
  effect: enables-new
  note: Agents open-endedly converse, invite, and coordinate (for example planning and attending a party)
    without a predefined catalog of social moves and preconditions.
- id: agent-inspection
  effect: explains
  note: Because an agent's state is natural-language memories, plans, and reflections, the player or designer
    can read them directly or interview the agent about why it acted, which is how the original paper
    evaluated believability.
- id: offscreen-life-progression
  effect: replaces-substrate
  note: Memory streams summarized at low frequency give off-screen characters histories that persist when
    the player returns.
- id: aspiration-wants
  effect: enables-new
  note: Wants generated from an agent's own memories and reflections rather than rolled from a fixed table
    tied to an aspiration.
