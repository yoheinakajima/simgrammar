id: generative-agents
type: technique
name: Generative agents (memory stream, reflection, planning)
aliases:
- generative agent architecture
- Smallville agents
- plan-act-reflect agents
summary: LLM-driven characters that store observations in a natural-language memory stream, retrieve them
  by recency, importance, and relevance, synthesize reflections, and plan their day top-down.
category: llm-agents
year: 2023
mechanism: 'Each agent appends observations as natural-language records to a memory stream. To act or
  speak, it retrieves records by a score that sums min-max normalized recency (exponential decay, factor
  0.995 per game hour), importance (an LLM rating from 1 to 10 made when the record is stored), and relevance
  (embedding cosine similarity to the current situation), all with weight 1. When the summed importance
  of recent records exceeds 150, roughly two or three times a game day, the agent asks the LLM for high-level
  questions and inferences and stores the answers as reflections that can be retrieved like observations.
  Planning is top-down: a daily sketch is decomposed into hour chunks and then 5-15 minute actions, and
  the plan is revised when a perceived event warrants a reaction. Dialogue is generated from retrieved
  memories about the other agent. Cost-reduction variants replay stored plan-action sequences when a new
  plan matches an old one by embedding similarity and compress social context into short summaries, cutting
  LLM calls.'
key_results:
- text: 'In Smallville, 25 agents on gpt-3.5-turbo were rated for believability by 100 human raters (TrueSkill):
    full architecture 29.89, no reflection 26.88, no reflection or planning 25.64, human crowdworkers
    role-playing 22.95, no memory, planning, or reflection 21.21.'
  sources:
  - src-park-2023-generative-agents
  confidence: high
- text: Over two game days, knowledge of a seeded party spread from 1 to 13 of 25 agents and of a mayoral
    candidacy from 1 to 8, network density rose from 0.167 to 0.74, five of twelve invited agents attended
    the party, and 1.3% of 453 awareness answers were hallucinated.
  sources:
  - src-park-2023-generative-agents
  confidence: high
- text: The simulation cost thousands of dollars in token credits and took multiple days of wall-clock
    time for 25 agents.
  sources:
  - src-park-2023-generative-agents
  - src-gallotta-2024-llms-games-survey
  confidence: high
- text: Affordable Generative Agents used 31.1% of the baseline's tokens for a 3-agent town over two game
    days and 42.7% for the 25-agent town, by replaying cached plan-action policies (embedding match at
    cosine 0.97) and compressing about 2,000 prompt tokens of social context to about 100.
  sources:
  - src-yu-2024-affordable-generative-agents
  confidence: high
- text: NVIDIA describes inZOI's Smart Zois as agents that plan, act, and reflect on their decisions using
    small language models, and inZOI's Steam disclosure says character actions and thoughts can be influenced
    through an on-device SLM.
  sources:
  - src-nvidia-2026-ace-developer-page
  - src-steam-2025-inzoi
  confidence: medium
