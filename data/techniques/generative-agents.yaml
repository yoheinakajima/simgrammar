limitations:
- 'Cost and wall-clock time: 25 agents over two game days cost thousands of dollars and took days to run
  on gpt-3.5-turbo (2023 prices).'
- 'Retrieval failures and embellishment: agents sometimes miss relevant memories or add fabricated details
  to recalled events.'
- Instruction-tuned models make agents overly formal and cooperative, and agents misread location norms
  such as single-occupancy bathrooms or closing hours.
- Each agent step is several sequential LLM calls (importance rating, retrieval-conditioned action, dialogue,
  reflection), so per-agent latency is seconds, which limits real-time populations unless calls are cached
  or batched.
- Behavior is not reproducible from a seed with hosted models; replays and saves must store generated
  outputs.
