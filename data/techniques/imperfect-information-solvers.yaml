affects:
- id: fog-of-war
  effect: deepens
  note: AI players reason over unseen state as a belief distribution and play strategies that are hard
    to exploit, instead of cheating with full map knowledge or ignoring hidden units, so concealment and
    feints work against the AI as they would against a person.
- id: scouting-knowledge
  effect: deepens
  note: Equilibrium strategies put a value on information, so AI opponents scout, hide their own attributes,
    and avoid revealing them through their actions, giving the player's scouting system a real counterpart.
- id: auctions
  effect: replaces-substrate
  note: AI bidders play mixed strategies over private valuations instead of bidding a fixed fraction of
    value, which removes simple exploits such as always outbidding the AI by one unit.
- id: military-operations
  effect: deepens
  note: Deception becomes a stable part of AI play, as DeepNash bluffed with hidden unit identities in
    Stratego, so operational wargames could field opponents that feint and conceal force composition at
    calibrated rates.
- id: rival-firms
  effect: deepens
  note: Competitors with private costs or plans can bluff in price wars and market entry, and designers
    can measure how exploitable a fixed AI pricing script is by computing a best response against it.
- id: negotiation
  effect: enables-new
  note: Bargaining with hidden reservation values is an imperfect-information game; equilibrium strategies
    bluff and concede in ways scripted thresholds cannot.
limitations:
- Convergence guarantees hold for two-player zero-sum games; Pluribus's six-player play works empirically
  without them, and cooperative or general-sum simulation games fall outside the theory.
- Large games need designed abstractions of actions and states; a simulation with continuous economies
  and many units has no obvious abstraction to solve.
- Runtime search costs seconds per decision (Pluribus averaged about 20 seconds per hand on two CPUs),
  far above per-frame budgets for many agents.
- Equilibrium play avoids being exploited rather than exploiting weak players, which can feel passive,
  and randomized bluffs read as arbitrary unless the game explains them.
