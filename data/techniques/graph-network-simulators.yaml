id: graph-network-simulators
type: technique
name: Graph network simulators and neural operators
aliases:
- GNS
- MeshGraphNets
- Fourier Neural Operator
- FNO
- learned physics simulators
- neural PDE surrogates
summary: Learned simulators that predict the next state of particles, meshes, or continuous fields with
  message-passing networks or Fourier-space operators, trained on numerical solver output and run 10-1000x
  faster than that solver.
category: neural-physics
year: 2020
mechanism: Graph network simulators treat particles (GNS) or mesh vertices (MeshGraphNets) as nodes, with
  edges to neighbors within a radius or along mesh connectivity. An encoder embeds positions, velocities
  and material type; several rounds of learned message passing compute pairwise interactions; a decoder
  outputs per-node accelerations that a simple integrator applies. Models are trained on one-step targets
  from a numerical solver, with noise added to inputs so long rollouts stay stable. MeshGraphNets also
  learns where to refine the mesh. Neural operators such as the Fourier Neural Operator learn a map from
  one function to another (for example initial vorticity to vorticity at a later time) by applying learned
  kernels in Fourier space, so one model covers a family of PDE instances and can be evaluated at grid
  resolutions not seen in training.
key_results:
- text: GNS learned fluids, rigid solids and deformable materials as interacting particles; models trained
    on single steps with thousands of particles generalized to thousands of rollout steps and at least
    10x more particles.
  sources:
  - src-sanchezgonzalez-2020-gns
  confidence: high
- text: MeshGraphNets predicted cloth, structural mechanics and aerodynamics on adaptive meshes and ran
    1-2 orders of magnitude faster than the simulator it was trained on.
  sources:
  - src-pfaff-2021-meshgraphnets
  confidence: high
- text: The Fourier Neural Operator modeled Navier-Stokes turbulence with zero-shot super-resolution and
    was up to three orders of magnitude faster than traditional PDE solvers.
  sources:
  - src-li-2020-fno
  confidence: high
