affects:
- id: fluid-gas-simulation
  effect: replaces-substrate
  note: Learned fluid surrogates (GNS particles, FNO fields) reproduce solver-quality flow at large speedups,
    raising resolution or extent of water and gas within a frame budget.
- id: soft-body-deformation
  effect: replaces-substrate
  note: MeshGraphNets predicts cloth and structural deformation 10-100x faster than its training solver,
    allowing finite-element-like deformation where games now use coarse node-beam models.
- id: material-interactions
  effect: replaces-substrate
  note: GNS simulates several materials (fluids, rigid solids, deformables) interacting in one learned
    model, so mixed-material reactions need no hand-written pairwise rules.
- id: flight-aerodynamics
  effect: replaces-substrate
  note: MeshGraphNets learned aerodynamic flow around airfoils, pointing to flight models driven by surrogate
    CFD fields instead of fixed lift and drag coefficient tables.
- id: structural-integrity
  effect: replaces-substrate
  note: Learned structural-mechanics surrogates output stress and deformation fields, which could replace
    binary support checks with graded bending, sagging and stress-driven failure.
- id: hydrology
  effect: replaces-substrate
  note: Neural operators solve parametric flow PDEs in one forward pass at any grid resolution, a candidate
    replacement for per-cell iterative water-flow updates over large terrains.
deployed_in: []
limitations:
- Errors accumulate over long rollouts; GNS needed training-noise injection to stay stable, and nothing
  guarantees conservation of mass or energy.
- Each material or domain needs a training set generated by a numerical solver, and behavior outside the
  training distribution (new materials, extreme speeds, novel geometry) is unreliable.
- Reported speedups are against the high-accuracy solver used for training, not against the cheap approximations
  games already ship, so the net gain for a game can be much smaller.
- Inference runs on the GPU and competes with rendering for the frame budget.
- Results are cited from 2020-2021 primary papers; this run found no shipped game using GNS or neural
  operators at runtime.
