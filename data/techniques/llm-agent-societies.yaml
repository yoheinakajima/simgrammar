limitations:
- 'Scale ceilings come from the host game as well as the model: Project Sid agents became unresponsive
  above 1,000 agents on a Minecraft server.'
- PIANO agents lack vision and spatial reasoning and have no innate drives such as survival or curiosity,
  so building and navigation are weak.
- Agents built on pretrained models reproduce known human institutions (taxes, votes, religion) rather
  than inventing new ones, so outcomes are bounded by training data.
- Per-agent LLM calls multiply with population; AgentSociety chose an API without request limits to avoid
  rate-limit artifacts, and none of these papers reports per-agent-hour cost in a form a game could budget
  against.
- Validation is qualitative (matching stylized findings), so designers cannot easily tune or test collective
  outcomes.
