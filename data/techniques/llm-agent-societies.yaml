id: llm-agent-societies
type: technique
name: Many-agent LLM societies
aliases:
- Project Sid
- PIANO
- AgentSociety
- Concordia
- OASIS
- generative agent-based modeling
summary: Simulations of hundreds to a million LLM-driven agents with concurrent cognitive modules, shared
  environments, and message buses that produce role specialization, rule changes, cultural spread, and
  polarization.
category: multi-agent-social-sim
year: 2024
mechanism: Scaling generative agents from tens to thousands needs architecture and infrastructure changes.
  Project Sid's PIANO runs about ten modules concurrently (memory, action awareness, goal generation,
  social awareness, talking, skill execution) that read and write a shared agent state; fast modules use
  small non-LLM models and slow ones call an LLM, and a cognitive controller acts as a bottleneck that
  broadcasts one high-level decision so speech and actions stay consistent. AgentSociety gives each agent
  a profile plus emotion, needs, and cognition layers and simulates mobility, social contact, employment,
  and consumption across linked urban, social, and economic spaces, distributing agents over Ray processes
  and routing messages over MQTT. Concordia has agents state intended actions in natural language and
  a Game Master agent decide outcomes. OASIS runs up to one million agents inside a recommender-driven
  social feed.
key_results:
- text: In Minecraft, PIANO agents in 30-agent villages specialized into persistent roles (farmer, miner,
    guard, blacksmith) only when the social module was present; agents largely obeyed a 20% tax law and
    changed compliance after voted constitutional amendments, with pro- and anti-tax influencer agents
    shifting outcomes; a religion seeded by 20 priests kept spreading through a 500-agent population for
    two hours.
  sources:
  - src-altera-2024-project-sid
  confidence: high
- text: Project Sid runs above 1,000 agents exceeded Minecraft server limits and agents became sporadically
    unresponsive, so the main cultural analysis used 500 agents.
  sources:
  - src-altera-2024-project-sid
  confidence: high
- text: AgentSociety simulated over 10,000 agents with about 5 million interactions and reproduced qualitative
    findings on polarization, inflammatory message spread, universal basic income, and a hurricane shock.
  sources:
  - src-piao-2025-agentsociety
  confidence: medium
- text: OASIS ran up to one million agents on X- and Reddit-like platforms, replicated information spreading,
    group polarization, and herd effects, and found stronger group dynamics at larger agent counts.
  sources:
  - src-yang-2024-oasis
  confidence: medium
- text: Concordia formalizes a Game Master entity that grounds natural-language actions in physical, social,
    or digital space; its 2025 design pattern builds the Game Master from the same components as other
    entities so designers can configure scenarios without engine code.
  sources:
  - src-vezhnevets-2023-concordia
  - src-vezhnevets-2025-multi-actor-game-engine
  confidence: high
