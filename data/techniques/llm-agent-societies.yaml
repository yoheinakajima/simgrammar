affects:
- id: elections
  effect: replaces-substrate
  note: Voters become LLM agents that hear persuasion from other agents and vote on amendments, as in
    Project Sid's constitutional votes, instead of computing a vote from satisfaction and bloc membership.
- id: gossip-propagation
  effect: deepens
  note: Memes, beliefs, and a seeded religion spread through populations of 500 to one million agents,
    with content mutating in conversation and spread shaped by social structure or a recommender feed.
- id: labor-market
  effect: enables-new
  note: Roles emerge from agents' social context and goals (farmers, miners, guards in 30-agent villages)
    rather than from job slots filled by education level; AgentSociety adds agent-level employment and
    consumption decisions.
- id: player-legislation
  effect: enables-new
  note: NPC populations can propose, debate, and vote on rule changes in natural language and then comply
    or not, so legislation is no longer limited to human players in a shared world.
- id: policy-influence-network
  effect: replaces-substrate
  note: A policy's effect on groups is measured by running it on a population of agents (AgentSociety's
    universal basic income and hurricane experiments) instead of reading hand-authored weighted edges
    from policies to voter groups.
- id: taxation
  effect: deepens
  note: Tax compliance becomes an agent decision that responds to law changes and influencer messaging,
    as in Project Sid's 20% tax experiment, rather than an automatic deduction at the set rate.
- id: persistent-world
  effect: deepens
  note: A shared world can be populated by hundreds of autonomous agents that keep roles, culture, and
    rules while human players come and go; PIANO was built for real-time interaction with humans and other
    agents.
- id: offscreen-life-progression
  effect: replaces-substrate
  note: Unplayed households can be advanced by cheap language-agent societies that generate plausible
    life events instead of fixed event tables.
- id: needs-decay
  effect: replaces-substrate
  note: Need levels can be updated from what an agent did, what happened to it, and its emotional state,
    and kept as components its language model reads when it plans (AgentSociety's needs hierarchy,
    Concordia's hunger and thirst components), instead of meters that only decay at fixed per-tick rates
    and refill by fixed amounts.
builds_on:
