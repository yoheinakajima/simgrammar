id: massively-parallel-simulation
type: technique
name: Massively parallel GPU simulation
aliases:
- batch simulation
- many-world simulation
- GPU-accelerated simulators
- Isaac Gym
- Brax
- MJX
- Madrona
summary: Simulators that keep thousands of world instances as tensors on a GPU or TPU and step them all
  in one kernel, raising throughput to millions of steps per second for agent training and Monte Carlo
  sweeps.
category: differentiable-simulation
year: 2021
mechanism: 'World state for N independent instances is stored as structure-of-arrays tensors in accelerator
  memory. Each tick launches one set of kernels that integrates physics, evaluates game logic, and computes
  observations and rewards for every instance at once, so policy inference and training read the state
  without CPU-GPU copies. Implementations compile the step function: JAX/XLA (Brax, MJX, Craftax), CUDA
  kernels written in Python (NVIDIA Warp, MuJoCo Warp), or a GPU entity-component-system with a task graph
  (Madrona, where game logic is C++ compiled to CUDA). Throughput comes from parallelism across worlds,
  not from making one world faster, so the main uses are reinforcement learning (billions of steps), parameter
  sweeps, and evaluating many randomized variants of one design.'
key_results:
- text: Isaac Gym ran physics and policy training on a single GPU and reported 2-3 orders of magnitude
    faster RL training than pipelines using a CPU simulator.
  sources:
  - src-makoviychuk-2021-isaac-gym
  confidence: high
- text: Brax reported millions of simulation steps per second on one accelerator and hundreds of millions
    across accelerators, training Ant locomotion in about ten seconds versus close to half an hour for
    standard PPO.
  sources:
  - src-freeman-2021-brax
  confidence: high
- text: Madrona's GPU batch ECS ran OpenAI Hide and Seek at over 1.9 million steps per second, Overcooked-AI
    at 40 million and Hanabi at 20 million on an RTX 4090, 5-33x faster than strong 32-thread CPU baselines.
  sources:
  - src-shacklett-2023-madrona
  confidence: high
- text: Craftax reimplemented the survival-crafting game Crafter in JAX, ran up to 250x faster than the
    Python original, and trained PPO for 1 billion interactions in under an hour on one GPU.
  sources:
  - src-matthews-2024-craftax
  confidence: high
- text: GPUDrive, built on Madrona, simulated multi-agent driving from real road scenarios at over one
    million steps per second.
  sources:
  - src-kazemkhani-2024-gpudrive
  confidence: high
- text: MuJoCo Playground (2025) trained locomotion and manipulation policies in minutes on a single GPU
    and transferred them zero-shot to real robots.
  sources:
  - src-zakka-2025-mujoco-playground
  confidence: high
- text: Genesis (December 2024) was publicized as reaching 43 million FPS (430,000x real time) on simple
    scenes; press noted skepticism and that contact-rich dexterous scenes remain hard.
  sources:
  - src-kemper-2024-genesis-430000x
  - src-genesis-2024-genesis-world
  confidence: low
- text: 'GPU physics became more open in 2025: NVIDIA released PhysX 5.6 GPU source under BSD-3 in April,
    and the Warp-based Newton engine (NVIDIA, Google DeepMind, Disney Research) moved to the Linux Foundation
    in September.'
  sources:
  - src-thacker-2025-physx-gpu-open-source
  - src-larabel-2025-newton-linux-foundation
  confidence: high
