affects:
- id: rigid-body-physics
  effect: accelerates
  note: Batched GPU rigid-body solvers step thousands of worlds or bodies per kernel launch, so physics-heavy
    evaluation that was CPU-bound becomes cheap enough for large sweeps.
- id: creature-learning
  effect: enables-new
  note: Locomotion policies train in seconds to minutes on one GPU (Brax, MuJoCo Playground), so a creature
    could learn to move or act through RL during a play session instead of from canned animation.
- id: modular-assembly
  effect: enables-new
  note: A player-built creature or machine can be dropped into thousands of parallel worlds and have a
    controller trained for its specific body, so assembled designs move competently without the player
    programming them.
- id: natural-selection
  effect: replaces-substrate
  note: Fitness can be measured by simulating every individual of a large population in its own physics
    world each generation, so selection acts on actual behavior rather than on summed stat values.
- id: design-performance-rating
  effect: deepens
  note: A player design can be scored over hundreds of randomized loads, terrains or seeds in parallel,
    giving a robustness distribution instead of one deterministic test run.
- id: attribute-match-engine
  effect: tunes
  note: Millions of simulated matches per hour let designers check how attribute weights and tactic modifiers
    shift outcome distributions before shipping a match-engine change.
- id: traffic-congestion
  effect: accelerates
  note: GPUDrive shows multi-agent vehicle simulation above one million steps per second, which points
    to agent-level traffic at counts where city builders now fall back to aggregate flow.
- id: utility-action-selection
  effect: tunes
  note: Cheap batched rollouts make it practical to search utility-curve weights, or train a policy to
    replace them, against metrics such as survival or need satisfaction over many simulated colonies.
deployed_in: []
limitations:
- Speedups come from running many independent worlds in parallel; a single large coupled world, such as
  one city, gains much less and per-world latency does not improve.
- Game logic must be rewritten in a GPU-friendly form (JAX in Craftax, C++ compiled to CUDA in GPUDrive
  and Madrona), which is a port rather than a recompile.
- Madrona requires all component archetypes to be declared up front and does not support adding or removing
  components at runtime; it is labeled research code with breaking API changes.
- Headline frame rates are for simple scenes; contact-rich and dexterous scenes remain hard and much slower
  (reported caveat on Genesis).
- 'Much of the stack is NVIDIA-specific: MuJoCo Warp needs an NVIDIA GPU for speed, and porting PhysX''s
  500+ CUDA kernels to other vendors is described as a lot of work.'
- Policies trained in a batched simulator exploit its physics quirks, so behavior must be re-validated
  in the shipping engine if that engine differs.
