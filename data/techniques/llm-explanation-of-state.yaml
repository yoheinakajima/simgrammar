affects:
- id: advisors
  effect: deepens
  note: Advisors can answer arbitrary player questions about the current situation and recommend actions
    in context, instead of speaking a fixed catalog of threshold-triggered messages.
- id: agent-inspection
  effect: explains
  note: The inspection panel can answer why an agent did something by summarizing its needs, itemized
    mood terms, and recent thought log into a short causal account.
- id: causal-tooltips
  effect: explains
  note: A long nested modifier chain can be condensed into a ranked plain-language list of the largest
    causes and what would change them, while the numbers still come from the simulation.
- id: stats-dashboards
  effect: explains
  note: Graph changes can be annotated with narrated causes drawn from the event log, such as which policy
    or disaster preceded a drop.
- id: history-chronicle
  effect: deepens
  note: Recorded events can be retold as biographies, recaps, or highlight summaries for the player, a
    commentator and reteller role.
builds_on: []
deployed_in: []
limitations:
- 'Wrong but fluent causes: models are unreliable at inferring dynamics, so explanations are only trustworthy
  when causes are passed in from the simulation.'
- Serializing large state (thousands of modifiers, long logs) into context is slow and costly; selection
  of what to include determines what can be explained.
- 'Hard to QA: the answer space is open-ended, and a confident wrong explanation damages trust more than
  no explanation.'
- 'Shipped evidence is thin: known game examples are tech demos or research previews.'
