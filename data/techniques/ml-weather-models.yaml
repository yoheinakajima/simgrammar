affects:
- id: weather
  effect: deepens
  note: Weather becomes a coherent global field with fronts, cyclones and multi-day evolution across hundreds
    of variables, instead of a per-region Markov chain of weather states.
- id: forecasting
  effect: enables-new
  note: Ensembles (50 GenCast members) give calibrated probabilities, so an in-game forecast can carry
    real uncertainty that players plan against and that occasionally misses honestly.
- id: random-disasters
  effect: enables-new
  note: Storms emerge from atmospheric state with forecastable tracks (Aurora beat operational centres
    on 5-day cyclone tracks), turning disasters from dice rolls into threats with lead time.
- id: pollution-spread
  effect: deepens
  note: Aurora's fine-tuned air-quality forecasts run about 100,000x faster than CAMS, a path to pollution
    plumes transported by simulated wind at playable cost.
- id: planetary-climate
  effect: deepens
  note: Earth-system foundation models fine-tuned to several domains suggest climate sims coupling atmosphere,
    ocean waves and air chemistry, though they are trained for days-ahead weather, not decades.
builds_on:
- graph-network-simulators
deployed_in: []
limitations:
- Trained on Earth's reanalysis record, so they reproduce Earth's atmosphere only; fictional planets,
  altered geography or deliberate climate change lie outside the training data.
- 'Grids are coarse for game maps: 0.25 degree (about 28 km at the equator), and operational AIFS runs
  at 28 km.'
- Inference needs an accelerator and gigabytes of weights (Aurora has 1.3B parameters), heavy for client-side
  use.
- Designers cannot author dramatic timing; the model follows the statistics of real weather, so pacing
  must be imposed by selecting or conditioning forecasts.
- Autoregressive rollouts are validated to 10-15 days; behavior over seasons or years is not established
  by these sources.
