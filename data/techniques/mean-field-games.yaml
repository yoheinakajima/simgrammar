affects:
- id: traffic-congestion
  effect: replaces-substrate
  note: Trip routing changes from each agent reacting to current travel times, which oscillates, to an
    equilibrium in which drivers anticipate congestion, computed once for the population at a cost independent
    of car count.
- id: crowd-preferences
  effect: replaces-substrate
  note: Park visitors can choose attractions in equilibrium with expected queues and crowding rather than
    greedily, producing realistic spreading of crowds across a park.
- id: service-queues
  effect: replaces-substrate
  note: Queue choice and arrival timing become equilibrium behavior, so changing capacity at one service
    shifts load across the others as people anticipate the change.
- id: supply-demand-pricing
  effect: replaces-substrate
  note: Prices can come from many small rational producers and consumers in equilibrium (as in MFG models
    of energy markets), instead of a fixed elasticity formula.
- id: agent-pathfinding
  effect: replaces-substrate
  note: One equilibrium policy over positions serves any number of agents, like a flow field that already
    includes congestion effects, replacing per-agent searches.
- id: travel-mode-choice
  effect: replaces-substrate
  note: Mode split solved as a population equilibrium in which each traveler responds to congestion created
    by everyone else.
deployed_in: []
limitations:
- Assumes anonymous, symmetric, individually negligible agents; named characters with unique state, or
  a player large enough to move the aggregate, need major-player extensions.
- Equilibrium describes settled behavior; the learning, overshoot and panic dynamics games often want
  are absent unless modeled separately.
- The forward-backward coupling needs the whole horizon at once, so player interventions mid-run require
  re-solving or a fast approximate solver.
- Convergence guarantees such as those for online mirror descent need monotonicity assumptions that game
  rules can violate.
- No game implementation was found in this run's sources.
