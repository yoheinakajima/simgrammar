id: mean-field-games
type: technique
name: Mean field games and mean-field learning
aliases:
- MFG
- mean field MARL
- online mirror descent for MFGs
summary: Mean field game theory replaces an N-player game with one representative agent responding to
  the population distribution, and recent learning methods compute these equilibria for state spaces of
  hundreds of billions of states.
category: game-theoretic-solvers
year: 2021
mechanism: 'Each agent is small, anonymous and interchangeable, so the game depends on others only through
  the population distribution m(t,x). An equilibrium is a fixed point: the representative agent''s value
  function u solves a backward Hamilton-Jacobi-Bellman equation given m, and m evolves forward by a Fokker-Planck
  equation under the resulting policy. Numerical and learning methods iterate this pair: fictitious play
  averages past best responses; online mirror descent accumulates Q-values and updates the policy by a
  softmax of them; RL variants learn from samples when the model is unknown. Mean-field multi-agent RL
  applies the same idea locally, with each agent learning against the mean action of its neighbors. Cost
  scales with the size of the individual state space, not with the number of agents.'
key_results:
- text: Lasry and Lions (2007) formulated mean field games as coupled forward-backward nonlinear PDEs
    for many rational players reacting to aggregates and showed the problems are generally well-posed.
  sources:
  - src-lasry-2007-mean-field-games
  confidence: high
- text: Online mirror descent converged to MFG Nash equilibria under monotonicity, outperformed fictitious
    play, and solved MFGs with hundreds of billions of states.
  sources:
  - src-perolat-2021-mfg-omd
  confidence: high
- text: Mean-field MARL let each agent learn against its neighbors' mean action, scaling multi-agent learning
    to many-agent battle games and solving the Ising model with model-free RL.
  sources:
  - src-yang-2018-mean-field-marl
  confidence: high
- text: MFGs are applied to energy markets, bitcoin mining, macro-finance models and contract theory.
  sources:
  - src-carmona-2020-mfg-finance-economics
  confidence: medium
- text: Learning methods for static, stationary and evolutive MFG equilibria and social optima are now
    surveyed as an established toolkit.
  sources:
  - src-lauriere-2022-learning-mfg-survey
  confidence: medium
