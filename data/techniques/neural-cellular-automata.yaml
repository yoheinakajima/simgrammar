affects:
- id: falling-sand-materials
  effect: replaces-substrate
  note: Local per-cell material rules can be learned from examples of desired behavior instead of hand-coded;
    DiffLogic CA recovered Game of Life exactly as a compact logic circuit cheap enough for per-pixel
    use.
- id: voxel-destruction
  effect: enables-new
  note: Regenerating NCA regrow damaged shapes and 3D NCA regrow parts of machines, enabling destructible
    structures and organisms that heal from local rules rather than respawning.
- id: procedural-build-assist
  effect: enables-new
  note: A seed block placed by the player can grow into a castle or tree over time under a learned 3D
    rule, a growth-based alternative to instant procedural detailing.
- id: procedural-terrain
  effect: replaces-substrate
  note: Tile maps and levels can be grown by NCA generators selected by quality-diversity search for solvability
    and diversity, replacing hand-tuned noise and placement rules.
deployed_in: []
limitations:
- Each trained rule targets one pattern, texture or structure family; changing the target requires retraining.
- Growth unfolds over many steps, so getting a stable result has a latency that instant procedural methods
  do not have.
- Learned rules are opaque to designers and players, apart from small logic-gate circuits, which makes
  failures hard to diagnose.
- Demonstrations are small 2D images, 3D structures of a few thousand blocks, and simple tile domains;
  robustness under player interference at game scale is not shown.
