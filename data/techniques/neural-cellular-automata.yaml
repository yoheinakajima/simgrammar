id: neural-cellular-automata
type: technique
name: Neural cellular automata
aliases:
- NCA
- Growing NCA
- DiffLogic CA
- differentiable logic cellular automata
- self-organising textures
summary: Cellular automata whose local update rule is a small learned network or logic circuit, trained
  so that cells grow, maintain, and regenerate a target pattern, texture, structure, or level from a seed.
category: artificial-life-research
year: 2020
mechanism: 'Each grid cell holds a state vector (16 channels in Growing NCA: RGB, an alpha channel that
  marks living cells, and hidden signaling channels). Every step a cell perceives its 3x3 neighborhood
  through fixed Sobel gradient filters, a shared network of about 8,000 parameters maps the perception
  vector to a state increment, and a random mask applies the update to roughly half the cells, so no global
  clock is needed. Cells with no living neighbor are zeroed. The rule is trained by backpropagating through
  many steps toward a target image or style, with damaged samples in the training pool to teach regeneration.
  Variants use 3D convolutions for voxel structures, quality-diversity search instead of gradients for
  game levels, or differentiable logic gates that compile to a discrete binary circuit (DiffLogic CA).'
key_results:
- text: Growing NCA grew an image from one seed cell with a shared update network of about 8,000 parameters;
    models trained on damaged samples regrew erased regions, including damage types not seen in training.
  sources:
  - src-mordvintsev-2020-growing-nca
  confidence: high
- text: NCA texture models with 5,868 parameters synthesized textures interactively in real time in a
    WebGL demo.
  sources:
  - src-mordvintsev-2021-nca-textures
  confidence: high
- text: 3D NCA grew Minecraft castles, apartment blocks and trees, some over 3,000 blocks, and regrew
    parts of simple functional machines.
  sources:
  - src-sudhakaran-2021-3d-nca-minecraft
  confidence: high
- text: Quality-diversity search (CMA-ME) produced diverse NCA level generators for maze, Sokoban and
    Zelda domains, often meeting solvability criteria, and explored level space better than a CPPN baseline.
  sources:
  - src-earle-2021-nca-level-generation
  confidence: high
- text: DiffLogic CA (2025) learned Conway's Game of Life from all 512 3x3 configurations as a 336-gate
    binary circuit and grew patterns such as a lizard with 577 gates, with asynchronous and self-healing
    variants.
  sources:
  - src-miotti-2025-difflogic-ca
  confidence: high
