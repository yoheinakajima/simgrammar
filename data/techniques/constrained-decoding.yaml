affects:
- id: generative-content
  effect: enables-new
  note: Generated items, recipes, or characters can be written straight into typed game state (enum types,
    bounded stats, existing ids) instead of shown as text or parsed with retries, because invalid records
    cannot be emitted.
- id: natural-language-interaction
  effect: deepens
  note: Free player text can be mapped onto the closed set of verbs and target ids legal in the current
    state, so conversation reliably triggers real game actions rather than only replies.
- id: utility-action-selection
  effect: replaces-substrate
  note: An LLM can be dropped into the action-selection slot by constraining it to choose among the same
    enumerated actions the utility scorer would rank, keeping the engine's action set and preconditions
    intact.
- id: dilemma-cards
  effect: cuts-authoring-cost
  note: Card prompts, two to four options, and per-meter effect values can be generated in the game's
    card schema with effect sizes bounded by the grammar, leaving designers to curate rather than write.
- id: player-legislation
  effect: enables-new
  note: Laws proposed in plain language can be compiled into the world's structured condition-and-effect
    rule language by grammar-constrained generation, so players need not learn the rule editor.
builds_on: []
deployed_in: []
limitations:
- 'Validity is not correctness: a well-formed action can still be the wrong action or reference stale
  state, so engines must re-check preconditions.'
- Format constraints can lower reasoning quality; a common workaround is free-form reasoning followed
  by a constrained final answer, which costs tokens.
- 'Schema coverage varies: hosted APIs support a JSON Schema subset, and llama.cpp silently skips unsupported
  features such as nested $ref and uniqueItems and slows down with many optional items.'
- First use of a new schema adds compile latency (OpenAI reports under 10 seconds, up to a minute), so
  per-turn dynamic schemas need caching.
- Output can still fail validation if generation hits a token limit.
