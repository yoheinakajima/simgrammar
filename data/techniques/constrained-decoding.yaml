id: constrained-decoding
type: technique
name: Grammar-constrained decoding for valid game actions
aliases:
- structured outputs
- JSON mode
- grammar-guided generation
- GBNF
- Outlines
- XGrammar
summary: Decoding that masks every token which cannot extend a valid string of a schema, regular expression,
  or grammar, so a model's output always parses as a legal game action or data record.
category: llm-agents
year: 2024
mechanism: 'The output format (a JSON Schema, regular expression, or context-free grammar) is compiled
  into an automaton. At each decoding step the engine computes which vocabulary tokens keep the partial
  output a valid prefix and sets the logits of all others to minus infinity before sampling. Outlines
  precomputes an index from finite-state-machine states to allowed tokens; XGrammar handles full CFGs
  by prechecking context-independent tokens and checking context-dependent ones with a persistent stack,
  overlapping grammar work with GPU execution; hosted APIs convert schemas to CFGs and cache them; llama.cpp
  accepts GBNF grammars for local models. For games, the schema is built from current state: an enum of
  legal verbs, target ids that exist, and numeric fields with bounds, so every output maps to an action
  the engine can execute. A simpler variant scores a fixed list of candidate actions and returns the chosen
  index.'
key_results:
- text: OpenAI's Structured Outputs (August 2024) reached 100% on a complex JSON-schema-following eval
    with gpt-4o-2024-08-06, versus under 40% for gpt-4-0613 without constraints.
  sources:
  - src-openai-2024-structured-outputs
  confidence: high
  quote: our new model gpt-4o-2024-08-06 with Structured Outputs scores a perfect 100%. In comparison,
    gpt-4-0613 scores less than 40%
  locator: Introduction, before How to use Structured Outputs
- text: XGrammar reports up to 100x faster grammar-constrained generation than prior engines and near-zero
    end-to-end overhead when integrated with an inference server.
  sources:
  - src-dong-2024-xgrammar
  confidence: medium
  quote: XGrammar can achieve up to 100x speedup over existing solutions
  locator: Abstract
- text: Outlines showed that regex and CFG guidance can be implemented as finite-state-machine transitions
    with a precomputed vocabulary index and little per-token overhead.
  sources:
  - src-willard-2023-outlines
  confidence: high
  quote: guiding text generation with regular expressions and context-free grammars by allowing the construction
    of an index over a language model's vocabulary
  locator: Abstract
- text: Strict format restrictions such as JSON or XML significantly reduced LLM reasoning accuracy compared
    with free-form answers, with stricter formats causing larger drops.
  sources:
  - src-tam-2024-let-me-speak-freely
  confidence: medium
  quote: we find that stricter format constraints generally lead to greater performance degradation in
    reasoning tasks
  locator: Abstract
- text: Concordia's language-model interface includes a sample_choice call that scores a list of candidate
    responses and returns an index, raising an error after repeated invalid attempts, which is how its
    agents pick from closed option sets.
  sources:
  - src-deepmind-2026-concordia-repo
  confidence: high
- text: No source found documents constrained decoding in a specific shipped game; adoption in games is
    inferred from engine support (llama.cpp GBNF, hosted APIs) rather than observed.
  sources:
  - src-ggml-2026-llama-cpp-gbnf
  - src-geng-2025-jsonschemabench
  confidence: low
