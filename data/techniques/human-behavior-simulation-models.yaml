id: human-behavior-simulation-models
type: technique
name: LLM models of individual human choice
aliases:
- Centaur
- interview-grounded agents
- silicon samples
- Psych-101
summary: Language models conditioned on interviews or fine-tuned on millions of experimental choices that
  predict how specific people or populations answer surveys, play economic games, and choose in decision
  tasks.
category: player-modeling
year: 2025
mechanism: 'Two approaches. Grounded agents put a person''s two-hour interview transcript (or survey answers)
  in the prompt of a generative agent and ask it to answer new questions as that person; accuracy is normalized
  by how consistently the real person answers the same items two weeks later. Fine-tuned choice models
  transcribe experiments into natural language and train a model to predict each trial''s choice: Centaur
  adds rank-8 QLoRA adapters (about 0.15% of parameters) to a frozen 4-bit Llama 3.1 70B and trains one
  epoch on Psych-101 (160 experiments, 60,092 participants, 10,681,650 choices), scoring held-out participants
  by negative log-likelihood against cognitive models. Earlier silicon-sample work conditions a model
  on demographic backstories to reproduce subgroup response distributions. In games the same pipeline
  would predict how players or simulated citizens choose among options described in text.'
key_results:
- text: Agents built from two-hour interviews with 1,052 U.S. adults replicated General Social Survey
    answers 85% as accurately as participants replicated their own answers two weeks later, and performed
    comparably on Big Five traits, five economic games, and five experiments, with smaller accuracy gaps
    across racial and ideological groups than demographics-only agents.
  sources:
  - src-stanford-hai-2025-simulating-human-behavior
  - src-park-2024-1000-people
  confidence: high
- text: The later arXiv version reports normalized GSS accuracy of 83% for interview-only, 82% survey-only,
    86% combined, and 74% demographics-only agents.
  sources:
  - src-park-2024-1000-people
  confidence: medium
- text: Centaur predicted held-out participants better than 14 cognitive and statistical models and generalized
    to new cover stories, structural task changes, and new domains; the authors propose it for in silico
    prototyping of experiments.
  sources:
  - src-binz-2025-centaur
  confidence: high
- text: With task instructions removed or replaced by misleading ones, Centaur still generally beat domain-specific
    cognitive models, which its critics read as reliance on statistical cues rather than understanding
    the task.
  sources:
  - src-liu-2025-centaur-instruction-understanding
  - src-orr-2025-not-even-wrong
  confidence: medium
- text: Earlier work showed GPT-3 conditioned on survey backstories reproduces subgroup response distributions
    (algorithmic fidelity), while GPT-4-era models replicated classic experiments but showed a hyper-accuracy
    distortion on wisdom-of-crowds questions.
  sources:
  - src-argyle-2023-out-of-one-many
  - src-aher-2022-turing-experiments
  confidence: high
