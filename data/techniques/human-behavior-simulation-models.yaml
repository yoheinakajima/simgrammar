affects:
- id: customer-value-choice
  effect: replaces-substrate
  note: Customer purchase decisions could be sampled from a model trained on human choice data, giving
    realistic heterogeneity and biases, instead of utility = value x preference - price with hand-set
    weights.
- id: crowd-preferences
  effect: deepens
  note: Visitor populations could be drawn from person-grounded profiles whose preferences and tolerances
    are measured against real people rather than sampled from designer distributions.
- id: elections
  effect: replaces-substrate
  note: Simulated electorates could be built from survey-grounded agents that reproduce subgroup opinion
    distributions, so vote shares respond to issues the way measured populations do.
- id: interest-groups
  effect: deepens
  note: A group's preferences over policies could be derived from simulated members (silicon samples)
    rather than a single authored ideology vector.
- id: personality-traits
  effect: replaces-substrate
  note: A character's disposition can be a rich text profile whose predicted Big Five scores and economic-game
    behavior match a real respondent, rather than a few discrete trait tags.
- id: dilemma-cards
  effect: tunes
  note: Before ship, designers could estimate option pick rates for each card by querying a choice model
    on the card text; untested on game content.
- id: negotiation
  effect: replaces-substrate
  note: Counterparties whose acceptance follows models of human bargaining (fairness, anchoring) rather
    than a single reservation price.
- id: advertising-awareness
  effect: replaces-substrate
  note: Segment-level response to advertising predicted from models of human choice instead of a flat
    awareness multiplier.
- id: travel-mode-choice
  effect: tunes
  note: Mode-choice weights for time, cost, and comfort can be fitted to predicted human choices instead
    of hand-set.
builds_on:
- generative-agents
deployed_in: []
limitations:
- Psych-101 is skewed toward WEIRD participants and toward learning and decision-making tasks; individual
  differences such as age were not in the prompts.
- Critics show Centaur performs well even without valid instructions, so its predictions on new game situations
  may track surface statistics.
- Interview-grounded agents need hours of data per person, which raises consent and privacy questions
  for player data.
- Centaur's 70B base needed about five days on one A100 to fine-tune; the 8B Minitaur variant generalized
  less robustly.
- No study yet validates these models on choices inside games, where options are visual, timed, and repeated.
