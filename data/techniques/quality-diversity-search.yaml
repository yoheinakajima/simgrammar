affects:
- id: modular-assembly
  effect: tunes
  note: Mapping the build space by behavior descriptors, as was done for Hearthstone decks, shows the
    best design in each style niche, exposing dominant part combinations and empty niches before players
    find them.
- id: design-performance-rating
  effect: tunes
  note: Searching for the top-scoring design in every descriptor cell stress-tests the rating formula
    and surfaces degenerate designs that score well, such as rides or bridges that game the metric.
- id: procedural-terrain
  effect: replaces-substrate
  note: Instead of one seed-to-map generator, a game can ship an archive of maps spanning designer axes,
    such as resource density by chokepoint count, each verified by simulation and served to players by
    trait.
- id: rival-firms
  effect: deepens
  note: An archive of competitor strategies, each the strongest found for its niche (aggressive expander,
    low-price discounter), gives AI rivals distinct styles without hand-tuning each persona.
- id: scenario-objectives
  effect: cuts-authoring-cost
  note: Scenario maps and starting conditions can be generated across a difficulty-by-style grid and filtered
    by agent playthroughs, replacing hand-built scenario sets with a curated archive.
- id: machine-boosting
  effect: tunes
  note: Searches over module and beacon layouts expose dominant boosting configurations that collapse
    design choice.
limitations:
- Every candidate needs a fitness and descriptor evaluation, usually a simulated playthrough, so large
  archives cost many simulations; surrogate methods such as DSAGE exist to cut that cost.
- 'Results depend on the chosen descriptors: poor choices give diversity along axes players do not perceive,
  and the grid grows exponentially with the number of descriptors.'
- Fitness measured with AI agents reflects agent skill, not human experience, so cells marked playable
  or balanced may not match player perception.
- Game applications in the cited work are research prototypes on small games (Mario levels, Hearthstone
  decks); no documented shipped use in a simulation game was found in this run.
