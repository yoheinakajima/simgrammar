id: quality-diversity-search
type: technique
name: Quality-diversity search (MAP-Elites) for content and balance
aliases:
- MAP-Elites
- CMA-ME
- MESB
- DSAGE
- QDAIF
- illumination search
summary: Evolutionary search that keeps the best solution found in each cell of a grid of designer-chosen
  behavior descriptors, returning an archive of diverse high-quality levels, decks, or strategies instead
  of one optimum.
category: procedural-generation
year: 2015
mechanism: 'The designer picks k behavior descriptors (for a level: enemy count and number of jumps; for
  a deck: mean mana cost and minion count) and discretizes them into a grid. Each cell stores the highest-fitness
  solution seen with those descriptor values. Each iteration selects elites from the archive, mutates
  or recombines them, evaluates the child''s fitness and descriptors (usually by simulation or an agent
  playthrough), and inserts it if its cell is empty or it beats the incumbent. The archive shows which
  trait combinations can be good and how good. Variants slide cell boundaries to follow where solutions
  cluster (MESB), search a generative model''s latent space with CMA-ES emitters (CMA-ME on a Mario GAN),
  use a learned surrogate to predict agent behavior and skip simulations (DSAGE), or use language models
  both to propose variations and to judge quality and diversity (QDAIF). GAVEL applies MAP-Elites to game
  rule sets.'
key_results:
- text: MAP-Elites (2015) returns a map of high-performing solutions across user-chosen dimensions of
    variation, revealing trade-offs and often finding a better best solution than standard search.
  sources:
  - src-mouret-2015-map-elites
  confidence: high
- text: Gravina et al. (IEEE CoG 2019) framed procedural content generation as a quality-diversity problem
    and reviewed early applications to content generation and game playing.
  sources:
  - src-gravina-2019-pcg-quality-diversity
  confidence: high
- text: MAP-Elites with sliding boundaries mapped Hearthstone deck spaces along play-style dimensions,
    found diverse strong decks, and was proposed as an aid to rebalancing.
  sources:
  - src-fontaine-2019-hearthstone-mesb
  confidence: high
- text: CMA-ME searching a GAN's latent space produced playable Super Mario Bros levels spanning designer-chosen
    measures such as enemy and obstacle counts, and a user study found those measures changed perceived
    difficulty.
  sources:
  - src-fontaine-2020-mario-gan-qd
  confidence: high
- text: DSAGE (2022) used a deep surrogate to predict agent behavior in generated environments and beat
    earlier QD environment-generation methods at finding environments that elicit diverse agent behaviors.
  sources:
  - src-bhatt-2022-dsage
  confidence: medium
- text: QDAIF (2023) used language models to generate variations and to judge quality and diversity of
    creative text, covering more of the target space than non-QD baselines with reasonable agreement with
    human raters.
  sources:
  - src-bradley-2023-qdaif
  confidence: medium
