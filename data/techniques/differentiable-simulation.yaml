affects:
- id: design-performance-rating
  effect: explains
  note: The gradient of a design's rating with respect to each part parameter tells the player which strut,
    joint or track segment most changes the score, enabling hints like 'move this support left'.
- id: soft-body-deformation
  effect: tunes
  note: Material stiffness and damping of node-beam or finite-element bodies can be fitted to reference
    motion or a target feel by gradient descent, as DiffTaichi does for elastic objects.
- id: vehicle-dynamics
  effect: tunes
  note: Tire, suspension and drivetrain constants can be fitted to recorded telemetry by differentiating
    lap or trajectory error, replacing manual parameter sweeps.
- id: contagion
  effect: tunes
  note: GradABM shows transmission parameters of a million-agent outbreak model calibrated to real case
    data by gradients, a route to epidemic games whose curves match real diseases or designer targets.
- id: fluid-gas-simulation
  effect: tunes
  note: Differentiable fluid kernels (Warp, DiffTaichi) allow inverse design, solving for emitter or vent
    settings that produce a target flow, usable for level authoring or tuning puzzles.
- id: modular-assembly
  effect: enables-new
  note: A controller for a player-built soft or articulated body can be optimized in tens of gradient
    iterations, so assembled machines can learn to walk or swim during play.
deployed_in: []
limitations:
- Collisions, contact switching, and integer or threshold game rules give zero, undefined, or misleading
  gradients and need smoothing or relaxations that change the dynamics being tuned.
- Reverse-mode differentiation must store or recompute intermediate states, so memory grows with timesteps
  times state size; long horizons also produce exploding or vanishing gradients.
- Support is incomplete in production-grade GPU engines; MuJoCo Warp lists differentiability via Warp
  as not yet available.
- Gradient descent finds local optima of a stated loss; matching a target curve is not the same as making
  a system fun or balanced.
