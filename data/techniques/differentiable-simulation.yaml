id: differentiable-simulation
type: technique
name: Differentiable simulation
aliases:
- differentiable physics
- DiffTaichi
- NVIDIA Warp
- GradABM
- differentiable agent-based models
summary: Simulators written so automatic differentiation returns gradients of an outcome with respect
  to initial state, controls, or rule parameters, replacing black-box search with gradient descent for
  tuning and inverse design.
category: differentiable-simulation
year: 2020
mechanism: 'The simulator step is written in a language with automatic differentiation: source-transformed
  kernels (DiffTaichi, NVIDIA Warp) or traced array programs (JAX in Brax). A loss is defined on the final
  or accumulated state, for example distance of a soft robot from a goal or error between simulated and
  observed infection counts. Reverse-mode differentiation propagates the gradient back through every timestep
  to the parameters, which are updated by gradient descent. Contacts and discrete events are smoothed
  or given surrogate gradients. For agent-based models, agent state is held in tensors and stochastic
  discrete events are replaced by differentiable relaxations so the whole population update has gradients
  (GradABM). The payoff is that tuning takes tens of gradient iterations instead of thousands of blind
  rollouts.'
key_results:
- text: DiffTaichi implemented 10 differentiable simulators; its elastic-object simulator was 4.2x shorter
    than hand-written CUDA at similar speed and 188x faster than a TensorFlow version, and neural controllers
    optimized in tens of iterations.
