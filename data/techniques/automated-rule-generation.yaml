affects:
- id: policy-toggles
  effect: cuts-authoring-cost
  note: Candidate policies can be written as rule code in the game's own description language and screened
    by agent playouts for dominance and balance, so a policy list can be grown by search rather than authored
    one law at a time.
- id: player-legislation
  effect: enables-new
  note: Laws players propose could be translated by a code model into enforceable rule code and run through
    the same compile and playout tests GAVEL uses, rejecting laws that fail to compile or break play.
- id: turn-structure
  effect: tunes
  note: Self-play over each generated variant measures first-player advantage, decisiveness, and the share
    of states with real choices, so turn order, phases, and move allowances can be adjusted by search.
- id: scenario-objectives
  effect: cuts-authoring-cost
  note: End conditions are generated together with the rules and kept only if MCTS play reaches them without
    trivial draws or one-sided wins, replacing hand-tuned victory thresholds.
- id: generative-content
  effect: deepens
  note: Generated content extends from text, items, and levels to complete executable rule sets that are
    compiled and filtered by playability and balance tests before anyone plays them.
builds_on:
- quality-diversity-search
- monte-carlo-tree-search
limitations:
- Generated rule sets are small abstract board games; GAVEL trained on 574 games after removing those
  over 1,024 tokens, far below the size of a simulation game's rule base.
- Self-play metrics such as balance, decisiveness, and agency describe agent play, not whether people
  enjoy the game, so human evaluation is still required.
- Every candidate needs compilation plus random and MCTS playouts, so the search is offline and compute-bound.
- Language models often emit rule code that fails to compile or is unplayable; GAVEL penalizes such candidates
  rather than preventing them.
- Simulation games rarely have a formal rule language like Ludii or VGDL, so applying this needs the game's
  systems exposed as data or a scripting layer the generator can edit.
