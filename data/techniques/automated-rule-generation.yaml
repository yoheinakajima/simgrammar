id: automated-rule-generation
type: technique
name: Automated generation of game rules and mechanics
aliases:
- Ludi
- Ludii
- GAVEL
- VGDL generation
- LLM rule generation
summary: Systems that write complete game rule sets as code in a description language, using evolution
  or language models to propose rules and self-play agents to score balance, decisiveness, and strategic
  depth before a human sees them.
category: automated-game-design
year: 2024
mechanism: 'Rules are written in a game description language. Ludii describes a game as a tree of ludemes
  (board, pieces, moves, end conditions) that compiles to a playable game; VGDL describes sprites, interactions,
  and termination for 2D video games. A generator proposes new rule trees: Browne and Maire''s system
  evolved them by crossover and mutation, while GAVEL fine-tunes CodeLlama-13b with a fill-in-the-middle
  objective on 574 Ludii games and uses it as the mutation operator in MAP-Elites: a span of an existing
  game''s rule code is masked and the model writes a replacement, and the archive is indexed by a 2D PCA
  projection of 510 Ludii concept features (1,600 cells). Candidates pass hierarchical tests (compiles,
  is playable, random playouts are not trivially one-sided and offer real choices) and are then scored
  by MCTS self-play on balance, decisiveness, completion, agency, coverage, and strategic depth. LLM frameworks
  built on VGDL generate rules and levels together from prompts. The output is a set of verified candidate
  rule sets for designers to play and select.'
key_results:
- text: Browne and Maire (IEEE TCIAIG 2010) evolved board game rule sets and ranked them with measures
    computed from self-play.
  sources:
  - src-browne-2010-evolutionary-game-design
  confidence: medium
  quote: We examine the concept of game quality, its automated measurement through self-play simulations,
    and its use in the evolutionary search for new high-quality games
  locator: Abstract
- text: Ludii describes games with high-level ludemes and outperformed a propositional-network GDL reasoner
    on all games in the Tiltyard repository.
  sources:
  - src-piette-2019-ludii
  confidence: high
  quote: Ludii outperforms one of the most efficient Game Description Language (GDL) reasoners, based
    on a propositional network, in all games available in the Tiltyard GGP repository
  locator: Abstract
- text: GAVEL (2024) fine-tuned CodeLlama-13b (about 40 hours on one RTX8000) on 574 Ludii games as a
    MAP-Elites mutation operator and generated playable games in rule-space regions not covered by existing
    Ludii games, scored by MCTS self-play metrics; samples are playable on the Ludii portal.
  sources:
  - src-todd-2024-gavel
  confidence: high
  quote: including in regions of the potential rules space not covered by existing games in the Ludii
    dataset
  locator: Abstract
- text: An LLM framework built on VGDL generated game rules and levels together, extending LLM generation
    from levels for fixed games to whole games.
  sources:
  - src-hu-2024-llm-game-generation-vgdl
  confidence: medium
  quote: Based on video game description language, this paper proposes an LLM-based framework to generate
    game rules and levels simultaneously
  locator: Abstract
