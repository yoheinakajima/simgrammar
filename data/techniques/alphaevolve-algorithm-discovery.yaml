affects:
- id: agent-pathfinding
  effect: accelerates
  note: Path cost heuristics or search-ordering functions can be evolved against a benchmark of the game's
    own maps for fewer node expansions at equal route quality, as FunSearch evolved priority functions.
- id: hauling-jobs
  effect: tunes
  note: Job-to-hauler assignment is a scheduling problem like the Borg case; the dispatch heuristic can
    be evolved against simulated throughput and idle time on recorded colony states.
- id: vehicle-route-scheduling
  effect: tunes
  note: Automatic load and stop-ordering heuristics resemble the bin-packing heuristics FunSearch improved,
    and can be evolved against delivery-rate benchmarks.
- id: utility-action-selection
  effect: tunes
  note: Utility scoring functions can be evolved as code against designer metrics (survival, need satisfaction,
    behavior variety), keeping the result readable unlike a neural policy.
- id: comparative-histograms
  effect: tunes
  note: Evolving solutions to each puzzle before launch estimates near-optimal cost, cycle or area scores,
    anchoring histogram axes and flagging degenerate puzzles.
- id: player-programming
  effect: enables-new
  note: Rivals or coaches could evolve programs in the game's own language against its evaluator, so player-written
    code competes with machine-evolved code under the same rules.
deployed_in: []
limitations:
- Requires a fast, automatic, trustworthy evaluator; anything judged by taste or fun has no such evaluator,
  and evolved code overfits whatever the evaluator measures.
- Each run consumes thousands of LLM samples and program executions in earlier systems; ShinkaEvolve's
  roughly 150-sample result shows efficiency varies widely by problem.
- Evolved heuristics are tuned to the benchmark instances and must be re-validated on new maps, content
  or patches.
- No game studio use was found in this run's sources; all cited results are in mathematics, scheduling
  and systems code.
