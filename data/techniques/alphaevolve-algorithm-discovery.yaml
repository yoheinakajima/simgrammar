id: alphaevolve-algorithm-discovery
type: technique
name: LLM-guided evolutionary program search
aliases:
- AlphaEvolve
- FunSearch
- OpenEvolve
- ShinkaEvolve
- evolutionary coding agents
summary: An LLM proposes edits to code, an automated evaluator scores each candidate, and an evolutionary
  database keeps the best and most diverse programs, finding heuristics and constructions that beat human-designed
  ones.
category: math-discovery
year: 2025
mechanism: A human supplies a program skeleton, the part to evolve (one priority function in FunSearch;
  arbitrary blocks across a file in AlphaEvolve), and an evaluator that runs a candidate and returns scores.
  A programs database holds evaluated programs; samplers build prompts from high-scoring and diverse parents
  and ask an LLM for a modified program; evaluators execute and score it; results flow back into the database.
  Diversity is kept with island populations (FunSearch) or MAP-Elites grids (OpenEvolve). Samplers and
  evaluators run asynchronously in parallel. The output is readable source code, so a discovered heuristic
  can be inspected, tested and shipped like hand-written code.
key_results:
- text: FunSearch found a cap set of size 512 in dimension 8 and online bin-packing heuristics that beat
    first fit and best fit on benchmark distributions.
  sources:
  - src-romeraparedes-2023-funsearch
  confidence: high
  quote: in dimension n = 8, FunSearch found a larger cap set than what was previously known
  locator: Extremal combinatorics, Cap sets
- text: AlphaEvolve found a 4x4 complex matrix multiplication with 48 scalar multiplications, matched
    about 75% and improved about 20% of over 50 open math problems, and produced a Borg scheduling heuristic
    that has recovered about 0.7% of Google's fleet compute in production for over a year.
  sources:
  - src-deepmind-2025-alphaevolve-blog
  - src-novikov-2025-alphaevolve
  confidence: high
  quote: This solution, now in production for over a year, continuously recovers, on average, 0.7% of
    Google’s worldwide compute resources
  locator: Improving data center scheduling
- text: Applied by Georgiev, Gomez-Serrano, Tao and Wagner to 67 problems, AlphaEvolve mostly rediscovered
    the best known constructions, improved several, and sometimes generalized finite results into formulas.
  sources:
  - src-georgiev-2025-math-discovery-at-scale
  confidence: high
  quote: The system rediscovered the best known solutions in most of the cases and discovered improved
    solutions in several
  locator: Abstract
- text: 'Open-source successors lowered the barrier: ShinkaEvolve reported a new state-of-the-art circle
    packing with about 150 samples, and OpenEvolve runs the loop with any OpenAI-compatible or local model
    under Apache-2.0.'
  sources:
  - src-lange-2025-shinkaevolve
  - src-sharma-2025-openevolve
  confidence: medium
  quote: ShinkaEvolve discovers a new state-of-the-art circle packing solution using only 150 samples
  locator: Abstract
