affects:
- id: decoration-beauty
  effect: cuts-authoring-cost
  note: Decor and furniture catalogs that beauty and environment scores consume can be produced from prompts
    or reference images in seconds per asset, so catalog size stops being bounded by modeling time.
- id: generative-content
  effect: deepens
  note: 'Runtime generation extends from text and textures to placeable 3D props: inZOI players convert
    their own images into in-game objects.'
- id: modular-assembly
  effect: enables-new
  note: Part-controllable generation (Roblox CubePart) produces assets split into parts intended for physics
    and scripts, which could supply new components for build-from-parts mechanics on request; not yet
    shown in a shipped assembly game.
deployed_in:
- inzoi
limitations:
- 'Hardware: 16 GB (TRELLIS) to about 29 GB (Hunyuan3D 2.1 shape plus texture) of GPU memory, so player-side
  generation usually runs in the cloud or on high-end PCs.'
- Output topology and UVs are not authored for animation or LOD; production use still needs cleanup and
  review, which inZOI states it applies.
- Generated assets are single objects without gameplay semantics; the game must assign function, footprint,
  and value.
- Training data provenance and licenses vary by model, and player reception of generative AI can be negative
  (inZOI reviews in 2025).
