id: generated-3d-worlds
type: technique
name: Prompt-to-persistent 3D world generation
aliases:
- Marble
- World Labs
- HunyuanWorld
- RTFM
- Atlas
summary: Models such as World Labs Marble and HunyuanWorld turn text, images, video, or coarse 3D blockouts
  into persistent explorable scenes exported as Gaussian splats and meshes with collision proxies.
category: neural-rendering-3d
year: 2025
mechanism: 'An image or video diffusion model generates views of a scene (a 360-degree panorama in HunyuanWorld,
  multi-view images in Marble) from the prompt; the views are lifted to an explicit 3D representation
  (3D Gaussian splats, or a semantically layered mesh) that can be walked through and re-rendered without
  regeneration. Marble also emits triangle meshes and coarse collider meshes for physics, can expand or
  merge worlds, and in Chisel mode takes a blockout of boxes and planes as structure and a text prompt
  as style. A parallel line renders frames directly instead of building geometry: RTFM keeps generated
  frames with camera poses as spatial memory and retrieves nearby frames as context. Atlas (2026) is a
  multimodal model that outputs video, point clouds, and splats.'
key_results:
- text: Marble became generally available on 2025-11-12, taking text, images, video, or coarse 3D layouts
    and exporting Gaussian splats, triangle meshes including collider meshes for coarse physics, and rendered
    video; Chisel separates blocked-out structure from prompted style.
  sources:
  - src-worldlabs-2025-marble
  confidence: high
- text: HunyuanWorld 1.0 (Tencent, July 2025) generates explorable worlds from text or images via panoramic
    proxies converted to a semantically layered 3D mesh exportable to standard graphics pipelines, listing
    game development as an application.
  sources:
  - src-tencent-2025-hunyuanworld-1
  confidence: high
- text: RTFM (October 2025) renders generated or real scenes from a single image at interactive frame
    rates on one H100, using posed frames as spatial memory; it models static scenes only.
  sources:
  - src-worldlabs-2025-rtfm
  confidence: high
- text: World Labs launched a public World API in January 2026, released Atlas to early-access partners
    in September 2026, and announced it is joining AMD on 2026-09-28.
  sources:
  - src-worldlabs-2026-blog
  - src-worldlabs-2026-atlas
  confidence: medium
maturity: prototype
trl: 6
runtime:
- offline-authoring
- design-assist
determinism_impact: preserves
horizon: 1-2y
risks:
- consistency
- controllability
- ip-provenance
- labor
- player-trust
affects:
- id: procedural-terrain
  effect: enables-new
  note: Maps come from a prompt, photo, or video rather than a seed and noise pipeline, and unlike frame-based
    world models the result is baked geometry that persists, can be saved, and can be expanded region
    by region.
- id: scenario-objectives
  effect: cuts-authoring-cost
  note: Bespoke scenario maps can be produced from a reference image or description and exported with
    collider meshes, reducing hand modeling per scenario; objectives and rules still need authoring.
- id: procedural-build-assist
  effect: replaces-substrate
  note: Chisel turns a coarse blockout into a detailed styled scene, the same rough-input to detailed-output
    contract as Townscaper-style build assist but with a learned generator; today it is an editor mode,
    not a runtime player tool.
- id: rigid-body-physics
  effect: cuts-authoring-cost
  note: Exported collider meshes give generated scenes collision geometry automatically; Marble describes
    them as coarse, so precise physics still needs cleanup.
builds_on:
- gaussian-splatting
limitations:
- 'Scenes are static: no dynamic objects, agents, or rules are generated, and RTFM lists dynamics and
  interaction as future work.'
- Single-image or text prompts force the model to invent unseen regions; Marble notes artifacts and less
  crisp far regions that expansion may fix.
- Splat output bakes lighting into colors, so day-night cycles and relighting need conversion to meshes
  or other methods.
- Collider meshes are coarse and need manual work for gameplay-critical collision.
- Corporate change (World Labs joining AMD in 2026) leaves the hosted product's future terms uncertain.
