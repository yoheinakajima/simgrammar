affects:
- id: history-chronicle
  effect: deepens
  note: The chronicle stores causal links with every event, and sifting patterns retrieve whole storylines
    from it (a revenge arc, a rise and fall) instead of leaving the player to browse records one at a
    time.
- id: memories-thoughts
  effect: enables-new
  note: Characters can run sifting patterns over their own memories and act on the storylines they recognize,
    such as warning a grandchild with a remembered cycle of revenge.
- id: gossip-propagation
  effect: deepens
  note: Relayed knowledge carries the original action, so a character who hears of an old event can react
    to it years later and the reaction is linked causally to both the event and the telling.
- id: triggered-event-chains
  effect: explains
  note: Reactions and multi-phase plans are recorded with their causes, so any chain can be traced and
    named after the fact rather than only authored in advance.
- id: storyteller-director
  effect: deepens
  note: Policies that a director would use to steer events toward an arc can instead select and frame
    storylines that already happened, leaving the simulation unsteered.
