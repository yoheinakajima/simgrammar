limitations:
- Patterns find only the storylines someone authored a pattern for; the dissertation leaves sifting heuristics
  that find unanticipated stories as an open problem.
- 'Turning sifted material into a told story (narrativization) remains authored or human work; the 2018
  conclusion calls it a bottleneck.'
- Causal bookkeeping requires the simulation to be built from discrete, recorded actions; it cannot be
  added cheaply to a sim that changes state directly.
- Designed for periodic background simulation over long spans, not frame-by-frame behavior; the public
  runtime targets JavaScript only and commercial use needs a license.
