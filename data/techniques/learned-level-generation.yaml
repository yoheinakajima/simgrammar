id: learned-level-generation
type: technique
name: Learned level and map generation (PCGRL, MarioGPT, LLM generators)
aliases:
- PCGRL
- MarioGPT
- ARLPCG
- Word2World
- text-to-level
- LLM level generation
summary: Generators trained by reinforcement learning or on example levels, including small and large
  language models that emit tile maps from text prompts, produce playable levels and maps without hand-written
  generation rules.
category: procedural-generation
year: 2023
mechanism: 'PCGRL treats level design as a sequential decision problem: an agent edits a tile grid step
  by step (narrow, turtle, or wide representations of where it may edit) and is rewarded by the change
  in a quality score such as playability, path length, or region count, so the trained generator builds
  a level in fast forward passes without example levels. ARLPCG adds a solver agent and rewards the generator
  for levels that are challenging but solvable, with auxiliary control inputs. Language-model generators
  serialize levels as text and train or prompt a model to continue them: MarioGPT fine-tunes DistilGPT2
  with cross-attention to a prompt naming pipes, enemies, blocks, and elevation; Sokoban generators fine-tune
  on level corpora; Word2World prompts a general LLM to write a story, extract characters and tiles, and
  place them. Outputs are checked by search agents or solver bots and rejected or repaired if unplayable.
  Conditional generators such as EA SEED''s match-3 cVAE take size, symmetry, and target difficulty as
  inputs.'
key_results:
- text: PCGRL (2020) framed level design as a Markov decision process with three editing representations
    tested on three games, giving a fast generator that needs few or no example levels.
  sources:
  - src-khalifa-2020-pcgrl
  confidence: high
- text: MarioGPT (2023) fine-tuned a 96M-parameter DistilGPT2 model on 37 Super Mario Bros levels; 88.4%
    of 250 generated levels were completed by an A* agent versus about 31% for an LSTM baseline, and output
    followed text prompts.
  sources:
  - src-sudhakaran-2023-mariogpt
  confidence: high
- text: LLM Sokoban level generation improved sharply with training-set size, and scarce level data was
    the main obstacle (FDG 2023).
  sources:
  - src-todd-2023-llm-level-generation
  confidence: high
- text: Word2World (2024) used off-the-shelf LLMs without fine-tuning to write a story and place tiles
    into a coherent, playable 2D world.
  sources:
  - src-nasir-2024-word2world
  confidence: medium
- text: EA SEED's difficulty-conditioned match-3 generator produced 51.39% valid levels versus 46.15%
    in its training data, but matched the requested difficulty only 33.33% of the time (mean gap 10.19
    moves).
  sources:
  - src-villanueva-2024-match3-conditional-generation
  confidence: high
- text: ARLPCG trained a generator adversarially against a solver agent in a 3D platformer and a racing
    game, producing new environments shown to be solvable.
  sources:
  - src-gisslen-2021-arlpcg
  confidence: medium
