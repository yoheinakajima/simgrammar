risks:
- controllability
- evaluation
- ip-provenance
- player-trust
affects:
- id: procedural-terrain
  effect: replaces-substrate
  note: Hand-written noise and placement rules give way to a generator trained on example maps or prompted
    with text, so a seed becomes a prompt plus a sample, and validity must be checked by a solver instead
    of guaranteed by construction.
- id: scenario-objectives
  effect: cuts-authoring-cost
  note: Scenario maps can be produced from a written description of the situation, Word2World-style story
    to world, with an agent playthrough confirming the stated goal is reachable.
- id: adaptive-threat-scaling
  effect: replaces-substrate
  note: Difficulty-conditioned generators let the next map or wave be built at a target difficulty instead
    of multiplying enemy counts, though EA SEED's match-3 model hit the requested difficulty only a third
    of the time.
- id: generative-content
  effect: deepens
  note: Text-to-level models small enough to run on the client (MarioGPT has 96M parameters) let players
    request maps in words at runtime, extending generated content from text and items to playable space.
limitations:
- 'Example data is scarce: MarioGPT trained on 37 levels and LLM Sokoban results scaled with dataset size,
  so a new game''s handful of authored maps may not suffice.'
- 'Validity is not guaranteed: about 12% of MarioGPT levels were not completed by an A* agent, so every
  output needs a solver check.'
- 'Conditional control is weak: difficulty conditioning hit its target a third of the time and lowered
  size and tile-distribution accuracy.'
- Results are mostly 2D tile grids for small games; large simulation maps with resources, rivers, and
  settlement suitability carry global constraints these models do not represent.
- Training on existing commercial levels such as Super Mario Bros raises IP and platform disclosure questions
  for shipped use.
