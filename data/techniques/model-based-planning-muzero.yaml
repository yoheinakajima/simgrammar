id: model-based-planning-muzero
type: technique
name: Self-play planning with learned models (AlphaZero, MuZero, Dreamer)
aliases:
- AlphaZero
- MuZero
- EfficientZero
- DreamerV3
- Dreamer 4
summary: Agents that combine tree search or imagined rollouts with neural policy and value networks trained
  by self-play, where MuZero and Dreamer also learn the environment's dynamics, reach superhuman play
  from rules or pixels alone.
category: reinforcement-learning
year: 2020
mechanism: 'AlphaZero pairs MCTS with a network that outputs a move prior p and a value v for a state;
  games generated by the search train p toward search visit counts and v toward outcomes, so search and
  network improve each other given only the rules. MuZero drops the need for rules at planning time: a
  representation network encodes observations into a latent state, a dynamics network predicts the next
  latent state and reward for an action, and a prediction network outputs policy and value, so MCTS runs
  entirely in the learned latent space. EfficientZero adds self-supervised consistency and value-prefix
  losses for sample efficiency. Dreamer learns a recurrent world model and trains an actor-critic on imagined
  trajectories; DreamerV3 adds symlog and return normalization so one hyperparameter set works across
  domains, and Dreamer 4 trains its world model mostly on unlabeled video and learns the policy offline
  inside it. For design work the same loop can be retrained on each rule variant and the converged play
  compared.'
key_results:
- text: AlphaZero reached superhuman chess, shogi, and Go within 24 hours from random play given only
    the rules, beating a world-champion program in each game.
  sources:
  - src-silver-2017-alphazero
  confidence: high
- text: MuZero matched AlphaZero in Go, chess, and shogi and surpassed R2D2 on Atari while learning its
    own model instead of being given the rules (Nature, December 2020).
  sources:
  - src-schrittwieser-2020-muzero
  confidence: high
- text: MuZero's board-game training used 16 TPUs for training and 1,000 for self-play at 800 simulations
    per move, and it performed poorly on 6 Atari games.
  sources:
  - src-wikipedia-muzero
  confidence: medium
- text: EfficientZero reached 194.3% mean and 109.0% median human-normalized score on Atari 100k from
    about two hours of real-time game experience.
  sources:
  - src-ye-2021-efficientzero
  confidence: high
- text: AlphaZero trained from scratch on nine chess rule variants was used to compare decisiveness, piece
    values, and dynamism across variants as an in silico game balance assessment.
  sources:
  - src-tomasev-2020-alphazero-chess-variants
  confidence: high
- text: DreamerV3 (Nature, April 2025) beat specialized methods on over 150 tasks with one configuration
    and was the first algorithm to collect Minecraft diamonds from scratch without human data, first at
    about 30M environment steps (about 17 days of play).
  sources:
  - src-hafner-2025-dreamerv3
  confidence: high
- text: Dreamer 4 (September 2025) learned a Minecraft world model that runs interactively on one GPU
    and obtained diamonds from offline data only, choosing sequences of over 20,000 keyboard and mouse
    actions from pixels.
  sources:
  - src-hafner-2025-dreamer-4
  confidence: medium
- text: MuZero-RC chose per-frame VP9 quantisation on part of YouTube live traffic for an average 4% bitrate
    reduction, its first production deployment, outside games.
  sources:
  - src-deepmind-2022-muzero-youtube
  confidence: high
