affects:
- id: rival-firms
  effect: replaces-substrate
  note: Competitor AI becomes a policy trained by self-play against the game's own rules, so it re-adapts
    when economic rules change in a patch instead of needing rewritten heuristics; training compute per
    rule set is the cost.
- id: tech-tree
  effect: tunes
  note: Self-play agents trained on each candidate tree reveal dominant research orders and unused branches,
    the same comparison AlphaZero made across chess rule variants.
- id: policy-toggles
  effect: tunes
  note: Each toggle combination is a rule variant; converged self-play under each variant measures how
    much a policy shifts outcomes and flags toggles that are strictly dominant or never worth enacting.
- id: creature-learning
  effect: replaces-substrate
  note: Sample-efficient model-based learners (EfficientZero needed about two hours of experience) make
    it plausible for a creature to learn new behaviors from player reward within a session, by planning
    in a learned model of its world rather than reacting with a fixed network.
- id: military-operations
  effect: replaces-substrate
  note: Opponents plan with a learned value function plus search over unit actions, giving strong play
    in operational simulations where hand-written doctrine is brittle; latent models allow planning where
    exact rollouts are too slow.
builds_on:
- monte-carlo-tree-search
limitations:
- 'Training is expensive: MuZero''s board-game runs used 16 TPUs for training and 1,000 for self-play,
  and each significant rule change needs retraining or fine-tuning.'
- Self-play converges to strong play, not human play, so balance conclusions can reflect exploits humans
  would never find or use.
- Learned dynamics drift over long rollouts; MuZero did poorly on 6 Atari games and DreamerV3 needed about
  30M steps (17 days of play) for its first Minecraft diamond.
- Most simulation games are many-player, simultaneous-move, partly hidden, and long-horizon, which the
  two-player perfect-information AlphaZero setup does not cover directly.
- Policies are opaque, so designers cannot read why an AI rival chose a strategy, and giving it a personality
  requires reward shaping rather than editing rules.
