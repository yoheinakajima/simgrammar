determinism_impact: preserves
horizon: 3-5y
risks:
- controllability
- legibility
- evaluation
affects:
- id: natural-selection
  effect: enables-new
  note: In Flow-Lenia, rules travel with matter, so selection can act on creatures that emerge from the
    physics itself rather than on declared fitness stats.
- id: trait-inheritance
  effect: deepens
  note: Rule parameters mix where creatures meet in Flow-Lenia, giving inheritance and hybridization as
    a spatial process instead of an explicit genome crossover function.
- id: generative-content
  effect: enables-new
  note: ASAL turns a text prompt into a search over simulation rules that produce the described phenomenon,
    a route to generating new creature rule sets from player or designer descriptions at design time.
deployed_in: []
limitations:
- Lenia creatures exist in a narrow band of parameter space; most settings die out or explode, which is
  what made search tools necessary.
- Creatures are fields without discrete identity, needs or stats, so connecting them to resource economies
  or player goals needs extra interpretation layers.
- ASAL scores runs with a foundation model on rendered frames, which is offline-scale compute and inherits
  that model's notion of what looks interesting.
- Open-ended evolution in these substrates is a stated aim, not an established result.
