id: continuous-alife-and-asal
type: technique
name: Continuous cellular automata and foundation-model search for artificial life
aliases:
- Lenia
- Flow-Lenia
- ASAL
- Automated Search for Artificial Life
summary: Continuous cellular automata such as Lenia and mass-conserving Flow-Lenia produce lifelike self-organizing
  creatures, and ASAL uses vision-language foundation models to search their rule spaces for phenomena
  described in text or for open-ended novelty.
category: artificial-life-research
year: 2024
mechanism: Lenia stores a continuous field A(x) in [0,1]. Each step it convolves A with a smooth ring-shaped
  kernel K, passes the result through a bell-shaped growth function G, and updates A by a small time step
  dt times G(K*A), clipped to [0,1]; certain kernel and growth parameters yield moving, self-maintaining
  patterns ('species'). Flow-Lenia replaces additive growth with an affinity field that moves matter along
  its gradient, conserving total mass, and stores the rule parameters in the matter itself, so creatures
  carrying different rules can coexist, collide and mix. ASAL renders a simulation, embeds the frames
  with a vision-language foundation model, and scores parameter sets by similarity to a text prompt, by
  novelty of the embedding trajectory over time, or by diversity across a population; an evolutionary
  optimizer then searches the substrate's parameters (Boids, Particle Life, Game of Life, Lenia, NCA).
key_results:
- text: Lenia catalogued over 400 species in 18 families of geometric, segmented, resilient lifeforms,
    many found by interactive evolutionary search.
  sources:
  - src-chan-2019-lenia
  confidence: high
  quote: More than 400 species in 18 families have been identified, many discovered via interactive evolutionary
    computation
  locator: Abstract
- text: Flow-Lenia's mass conservation made localized creatures easier to find, and parameter localization
    let multiple species with different rules coexist and interact in one world.
  sources:
  - src-plantec-2023-flow-lenia
  confidence: high
  quote: Due to the mass conservative nature of Flow Lenia, most of patterns do not grow indefinitely
    into spatially global patterns (i.e patterns that diffuse on the entire grid also called Turing-like
    patterns), therefore SLPs are much more common and easier to find
  locator: Discussion
- text: ASAL found previously unseen Lenia and Boids lifeforms and open-ended cellular automata in the
    style of Game of Life, and quantified qualitative phenomena in ways that aligned with human judgment.
  sources:
  - src-kumar-2024-asal
  confidence: medium
  quote: the discovery of previously unseen Lenia and Boids lifeforms, as well as cellular automata that
    are open-ended
  locator: Abstract
