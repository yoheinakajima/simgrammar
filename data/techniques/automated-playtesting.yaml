id: automated-playtesting
type: technique
name: Agent-based automated playtesting and balancing
aliases:
- RL playtesting
- human-like playtesting
- difficulty prediction agents
- game testing agents
summary: Studios train imitation, reinforcement learning, and search agents to play builds, estimating
  level difficulty, pass and churn rates, progression pacing, map coverage, and exploits before players
  reach them.
category: automated-game-design
year: 2018
mechanism: 'Agents play the game through an API or the rendered screen, in three families. Human-like
  agents are trained by supervised imitation of logged player moves, as with King''s CNN on Candy Crush
  data, and their success rate on a new level predicts its difficulty for people. Goal-driven search or
  RL agents (A*, evolution strategies, deep RL) optimize task completion, and their action counts and
  success rates measure progression balance, as in EA''s career-balancing study for The Sims Mobile. Curiosity
  agents are rewarded for novel states, maximizing map coverage to find stuck spots, missing collision,
  and unintended shortcuts. Agent results can feed a model of the player population: Roohi et al. combined
  RL agent pass rates with simulated skill, persistence, and boredom to predict per-level churn. In production,
  agents run against new builds inside the existing test pipeline and their coverage and failures are
  visualized for designers.'
key_results:
- text: King's CNN trained on player moves in Candy Crush Saga and Candy Crush Soda Saga predicted human
    moves and level difficulty, correlating better with average difficulty than MCTS at a fraction of
    the compute (IEEE CIG 2018).
  sources:
  - src-gudmundsson-2018-human-like-playtesting
  confidence: high
  quote: Compared to Monte Carlo Tree Search (MCTS) we show that this approach increases correlation with
    average level difficulty, giving more accurate predictions as well as requiring only a fraction of
    the computation time
  locator: Abstract
- text: EA used A* and evolution-strategy agents to balance The Sims Mobile careers during development
    and reported that deep RL needed heavy per-game tuning, so effort grew roughly linearly with the number
    of target games.
  sources:
  - src-zhao-2019-winning-isnt-everything
  confidence: high
  quote: deep RL models does not seamlessly transfer from the benchmark environments to target ones without
    heavily tuning their hyperparameters, leading to linear scaling of the engineering efforts and computational
    cost with the number of target domains
  locator: Abstract
- text: EA SEED's RL test agents found a wall missing its collision mesh that scripted navmesh agents
    missed and located all five stuck areas in a test map, and curiosity rewards raised coverage of a
    complex 3D map.
  sources:
  - src-bergdahl-2020-augmenting-automated-testing-drl
  - src-gordillo-2021-curiosity-playtesting
  confidence: high
  quote: the RL agent quickly finds a way of exploiting the missing collision mesh
  locator: Section IV.A, Game exploits and logical bugs
- text: EA SEED added an experimental RL system to scripted-bot automated testing for AAA titles including
    Battlefield 2042 and Dead Space (2023) and reported that integration, not algorithms, consumed the
    most time.
  sources:
  - src-gillberg-2023-rl-testing-aaa
  confidence: high
- text: RL agents combined with a player-population model of skill, persistence, and boredom predicted
    per-level pass and churn rates for Angry Birds Dream Blast.
  sources:
  - src-roohi-2020-difficulty-churn
  confidence: high
  quote: The AI players predict level difficulty, which is used to drive a player population model with
    simulated skill, persistence, and boredom
  locator: Abstract
- text: SIMA 2 (2025) follows language instructions in commercial 3D games through screen input and virtual
    keyboard and mouse and transfers skills across games, but still struggles with long-horizon tasks,
    memory, and precise low-level control.
  sources:
  - src-deepmind-2025-sima-2-blog
  confidence: medium
  quote: We find the agents still face challenges with very long-horizon, complex tasks that require extensive,
    multi-step reasoning and goal verification. SIMA 2 also has a relatively short memory of its interactions
  locator: 'Looking to the Future: The Journey to General Embodied Intelligence'
