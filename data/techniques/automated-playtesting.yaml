affects:
- id: adaptive-threat-scaling
  effect: tunes
  note: Agent pass rates plus a player-population model estimate how a difficulty ramp drives churn, so
    threat and difficulty curves can be tuned before release instead of from live telemetry.
- id: scenario-objectives
  effect: tunes
  note: Each scenario or level gets a predicted pass rate from human-like agents, letting designers order
    and adjust goals and constraints against a target difficulty curve.
- id: career-ladder
  effect: tunes
  note: Search agents measure how many actions each career path needs to reach each level, exposing careers
    that are much faster or slower than the rest, as in The Sims Mobile study.
- id: agent-pathfinding
  effect: tunes
  note: Curiosity and RL agents explore traversal exhaustively, finding stuck spots, missing collision,
    and shortcuts that scripted navmesh bots do not reach.
- id: milestone-unlocks
  effect: tunes
  note: Agents replaying the early game measure when resource and progression thresholds are reached,
    so unlock pacing is set from distributions instead of a few manual runs.
- id: stat-combat-resolution
  effect: tunes
  note: Agent playthroughs estimate win rates and dominant unit mixes in statistical combat before release.
builds_on:
- generalist-game-agents
limitations:
- 'Agents are not players: skill and style differ, and imitation agents need large logs of real player
  moves, which a new game lacks before launch.'
- 'Integration dominates cost: EA SEED found engineering RL into production builds was the largest time
  sink, partly because development builds differ from the shipped game.'
- Deep RL transfers poorly between games without heavy hyperparameter tuning, so cost grows roughly linearly
  with the number of titles.
- Open-ended simulation games have no single goal to optimize, so coverage or curiosity rewards stand
  in for design intent and can miss balance problems that only appear over long play.
