affects:
- id: vehicle-dynamics
  effect: replaces-substrate
  note: Matrix-Game 2.0 was fine-tuned on 574 hours of GTA driving; car handling is reproduced from video
    rather than tire and suspension models, with no guarantee of consistent grip or mass.
- id: direct-avatar
  effect: replaces-substrate
  note: Walking, turning, and jumping are rendered from a unified camera-action space; GameCraft's action
    space lacks shooting, throwing, and explosions.
- id: procedural-terrain
  effect: enables-new
  note: A world starts from any image, sketch, or photo (Mirage 2, GameCraft); pose-indexed memory in
    Matrix-Game 3.0 and WorldPlay lets revisited areas stay consistent for about a minute, still far short
    of a save file.
- id: generative-content
  effect: enables-new
  note: Typed text during play adds or restyles objects and scenes (Yan editing, Mirage 2 commands, Odyssey-2
    prompts), so content is requested at runtime rather than authored.
- id: content-sharing
  effect: enables-new
  note: Mirage 2 lets players save and share generated worlds; what is shared is a prompt and seed image
    for a model rather than an asset bundle, so the receiver needs the same hosted model.
- id: rigid-body-physics
  effect: replaces-substrate
  note: Contact and motion responses come from video priors; out-of-domain views degrade (Matrix-Game
    2.0 reports over-saturation under sustained upward or forward camera motion).
builds_on:
- diffusion-game-engines
limitations:
- 'Resolution and speed trade against hardware: Matrix-Game 2.0 is 352x640 on one H100, Matrix-Game 3.0''s
  720p 40 fps needs 9 GPUs, and GameCraft runs at 6.6 fps after distillation.'
- Consistency horizon is about a minute even with retrieval memory; earlier open models have no explicit
  memory at all.
- Training data includes recordings of commercial games (GTA V, 100+ AAA titles), so output provenance
  is contested.
- Stronger history conditioning improves consistency but reduces responsiveness to new actions (GameCraft
  ablation).
- Action spaces cover camera movement and basic locomotion; game verbs such as shooting, building, or
  trading are not modeled.
