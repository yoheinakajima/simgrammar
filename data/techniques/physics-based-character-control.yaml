determinism_impact: mitigable
horizon: 3-5y
risks:
- compute-cost
- controllability
- evaluation
affects:
- id: smart-objects
  effect: cuts-authoring-cost
  note: When an object advertises an interaction (sit, lie, lean), a goal-conditioned controller can perform
    it on new furniture geometry without a bespoke animation per object, as MaskedMimic shows for chairs,
    stools, and sofas.
- id: direct-avatar
  effect: deepens
  note: The controlled character becomes a physical body that adapts footing to terrain and reacts to
    pushes, instead of playing canned clips that slide over geometry.
- id: rigid-body-physics
  effect: deepens
  note: Characters join the rigid-body simulation as actuated bodies, so carried, pushed, and collided
    objects affect them and vice versa (InterMimic human-object interaction).
- id: injury-body-model
  effect: replaces-substrate
  note: With a simulated body, a wound could change gait by limiting joint torque instead of swapping
    in an authored limp; the cited work does not demonstrate injury-conditioned motion, so this remains
    a projection.
builds_on:
- massively-parallel-simulation
limitations:
- Every character needs a physics simulation step plus policy inference, which is costly at the hundreds-of-agents
  scale colony and management sims use; no crowd-scale runtime figures are published in the cited work.
- Training requires large mocap datasets and GPU-parallel RL; retargeting to non-human or stylized rigs
  requires retraining.
- Physical controllers can fall or jitter in edge cases, which is hard to QA across open-ended situations.
