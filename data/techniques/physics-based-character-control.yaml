id: physics-based-character-control
type: technique
name: Learned physics-based character control
aliases:
- MaskedMimic
- InterMimic
- learned physics controllers
- RL motion imitation
summary: Neural policies trained with reinforcement learning drive simulated humanoids by joint torques
  to imitate motion capture, and MaskedMimic-style controllers accept partial goals such as keyframes,
  text, or an object to sit on.
category: animation-motion
year: 2024
mechanism: 'A ragdoll with joint actuators is simulated in a physics engine; a policy network outputs
  PD targets each step and is trained with RL in massively parallel GPU simulation to track motion capture
  clips. MaskedMimic first trains a full-body tracker, then distills it into a conditional generative
  student that receives a masked goal: any subset of future joint positions, a text description, a head
  and hand signal from VR, a path, or a target object. The same controller therefore handles locomotion,
  steering, and sitting on varied furniture and transfers flat-ground motions to rough terrain. InterMimic
  distills per-subject teachers into one student refined by RL for whole-body human-object interaction
  from imperfect mocap.'
key_results:
- text: 'MaskedMimic (SIGGRAPH Asia 2024) formulates physics-based control as motion inpainting: one controller
    generates motion from keyframes, text, VR head or hand tracking, paths, or objects, and interacts
    with chairs, stools, tables, and sofas while transferring to irregular terrain; code is released as
    ProtoMotions.'
  sources:
  - src-tessler-2024-maskedmimic
  confidence: high
- text: InterMimic (2025) trains a single policy for physics-based human-object interaction from hours
    of imperfect motion capture by distilling subject-specific teacher policies and refining with RL;
    the authors report zero-shot generalization and compatibility with kinematic motion generators.
  sources:
  - src-xu-2025-intermimic
  confidence: medium
maturity: research
trl: 4
runtime:
- offline-authoring
