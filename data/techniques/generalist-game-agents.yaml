id: generalist-game-agents
type: technique
name: Generalist instructable game agents (SIMA)
aliases:
- SIMA
- SIMA 2
- scalable instructable multiworld agent
summary: Agents that read screen pixels and natural-language instructions and output keyboard and mouse
  actions across many commercial 3D games, with later versions reasoning, conversing, and improving through
  self-generated tasks.
category: llm-agents
year: 2024
mechanism: 'The agent sees only rendered frames and a language instruction and emits keyboard and mouse
  actions in real time, with no access to game source, state APIs, or per-game reward code. SIMA (2024)
  was trained on human gameplay with language annotations across nine commercial games and four research
  environments covering about 600 short skills (navigate, interact with objects, use menus). SIMA 2 (2025)
  puts a fine-tuned Gemini Flash-Lite model at the core, so the agent reasons about goals, states its
  plan, converses, and follows sketches or emoji. It then improves without human data: a Gemini task setter
  proposes tasks likely achievable from the current state, the agent attempts them, a Gemini reward model
  scores each trajectory from 0 to 100 (50 or more counts as success), and the agent trains on the scored
  experience.'
key_results:
- text: SIMA 1 learned about 600 basic skills across Valheim, Teardown, No Man's Sky, Wobbly Life, Satisfactory,
    Goat Simulator 3, Hydroneer, Space Engineers, and Eco; the multi-game agent outperformed per-game
    specialists, and an agent trained without one game performed nearly as well on it as a specialist.
  sources:
  - src-deepmind-2024-sima-blog
  - src-deepmind-2024-sima-paper
  confidence: high
- text: SIMA 1 tasks completed in about 10 seconds and the agent could not do multi-step strategic planning.
  sources:
  - src-deepmind-2024-sima-blog
  confidence: high
- text: SIMA 2 roughly doubled SIMA 1's average task success on training games, approaching human players,
    and beat SIMA 1 by over 10% on held-out ASKA and MineDojo, completing tasks in 26 of 50 MineDojo categories.
  sources:
  - src-deepmind-2025-sima-2-paper
  confidence: high
- text: Through self-generated tasks and rewards in ASKA, SIMA 2 went from succeeding on under a quarter
    of a fixed task set to exceeding human reference scores and progressed further through ASKA's tech
    tree than earlier versions.
  sources:
  - src-deepmind-2025-sima-2-paper
  confidence: high
- text: SIMA 2 was released only as a limited research preview to a small group of academics and game
    developers.
  sources:
  - src-deepmind-2025-sima-2-blog
  confidence: high
