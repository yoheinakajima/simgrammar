affects:
- id: unit-commands
  effect: enables-new
  note: A companion can take open-ended spoken or typed orders, sketches, or emoji and carry them out
    with ordinary game controls, so the command vocabulary is no longer limited to the verbs a designer
    bound to buttons.
- id: delegation-to-ai
  effect: enables-new
  note: The player can hand an avatar or task to an agent that pursues a stated goal in any game it can
    see, without game-specific AI code, and that explains what it intends to do.
- id: natural-language-interaction
  effect: deepens
  note: SIMA 2 converses about its surroundings, answers questions about the scene, and explains its actions,
    grounding dialogue in what it sees on screen.
- id: tech-tree
  effect: tunes
  note: Self-improving agents that advance through a game's tech tree can serve as automated playtesters
    of progression in builds they were not trained on.
- id: programming-by-demonstration
  effect: enables-new
  note: Agents that follow language instructions and watch play could learn routines from a single narrated
    demonstration instead of recorded literal steps.
builds_on: []
deployed_in: []
limitations:
- Weak combat and precise low-level control; failures in held-out games are often due to poor exploration.
- Short memory bounded by the context window, and trouble with long multi-step tasks that need goal verification.
- Built on Gemini Flash-Lite for latency; fine-tuning cost general reasoning (about 25.5% drop on AIME
  after SFT).
- Runs as a cloud model reading the screen, so per-session inference cost and round-trip latency apply;
  no public cost figures.
- Not available to players; the reward model was calibrated on a small set of trajectories.
