- determinism
- consistency
- compute-cost
- controllability
- labor
- player-trust
affects:
- id: direct-avatar
  effect: replaces-substrate
  note: In WHAMM the avatar's movement and camera are rendered by the model from controller input, at
    10+ fps with a 0.9 second context.
- id: rigid-body-physics
  effect: replaces-substrate
  note: Movement and collisions follow learned game dynamics; the Nature paper's consistency criterion
    is that generated play respects controller input and the game's physics, which is measured statistically
    rather than enforced.
- id: generative-content
  effect: tunes
  note: Designers insert an object or character into a frame and the model generates plausible gameplay
    around it (persistency), giving a preview of how a content change might play before it is built.
limitations:
- WHAM-1.6B generates about one image per second at 300x180, too slow and too small for play; WHAMM trades
  data scope (one level section) for speed.
- Needs years of recorded human play with consent terms for a single game; few studios hold such datasets.
- Context of under a second (WHAMM) means objects out of view are forgotten.
- Counts, damage, and other exact quantities are unreliable in generated frames.
