id: diffusion-game-engines
type: technique
name: Diffusion and autoregressive neural game engines
aliases:
- neural game engine
- GameNGen
- DIAMOND
- Oasis
- MineWorld
summary: Action-conditioned generative models trained on recordings of one existing game predict each
  next frame from recent frames and player input, so the model itself plays the role of the game engine.
category: generative-world-model
year: 2024
mechanism: 'A game is recorded as pairs of frames and player actions (from an RL agent in GameNGen, human
  play in DIAMOND''s CS:GO model, or gameplay video in Oasis). A generator is trained to predict frame
  t+1 from the last N frames and the action at t: a latent diffusion model in GameNGen, DIAMOND, and Oasis,
  or a transformer over interleaved image and action tokens in MineWorld. Context frames are noised during
  training (noise augmentation, Diffusion Forcing, dynamic noising) so the model can recover from its
  own errors during long rollouts, and sampling is cut to a few denoising steps for real-time play. There
  is no explicit game state: position, health, enemies, and map layout exist only as pixels or latents
  inside the context window, so anything that leaves the window is forgotten unless it is visible on screen.'
key_results:
- text: GameNGen simulates DOOM at 20 frames per second on a single TPU, with next-frame PSNR of 29.43;
    human raters picked the real game over the simulation only 58 percent (1.6 s clips) and 60 percent
    (3.2 s clips) of the time.
  sources:
  - src-valevski-2024-gamengen
  confidence: high
- text: GameNGen conditions on 64 past frames (about 3 seconds) and was trained on about 70M frames recorded
    from a PPO agent trained for 50M environment steps; the authors state the model cannot be used to
    create new games.
  sources:
  - src-valevski-2024-gamengen
  confidence: high
- text: DIAMOND reached a mean human-normalized score of 1.46 on Atari 100k for agents trained entirely
    inside a diffusion world model, and a CS:GO world model trained on 87 hours of human play runs at
    about 10 fps on an RTX 3090 but lets the player jump repeatedly in mid-air, which the real game forbids.
  sources:
  - src-alonso-2024-diamond
  confidence: high
- text: Oasis (Decart and Etched, October 2024) generated a Minecraft-like open world at 20 fps in a public
    browser demo with 500M-parameter open weights; reviewers found the layout rearranged after turning
    around, and Decart did not say it had Microsoft's permission to train on Minecraft footage.
  sources:
  - src-decart-2024-oasis
  - src-techcrunch-2024-decart-oasis
  - src-infoq-2024-decart-etched-oasis
  confidence: high
- text: MineWorld (Microsoft Research, 2025) released an open visual-action autoregressive transformer
    for Minecraft that generates 4 to 7 frames per second depending on model scale.
  sources:
  - src-guo-2025-mineworld
  confidence: high
maturity: prototype
trl: 6
runtime:
- server-realtime
