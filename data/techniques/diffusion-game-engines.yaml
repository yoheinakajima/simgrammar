determinism_impact: breaks
horizon: 3-5y
risks:
- determinism
- consistency
- compute-cost
- controllability
- ip-provenance
- latency
affects:
- id: direct-avatar
  effect: replaces-substrate
  note: Avatar movement, camera response, and weapon use are predicted frame by frame from keyboard and
    mouse input instead of computed by engine code; responsiveness depends on denoising steps and frame
    rate (20 fps GameNGen and Oasis, about 10 fps DIAMOND CS:GO).
- id: rigid-body-physics
  effect: replaces-substrate
  note: Collision, gravity, and jumping are learned statistically from pixels rather than integrated;
    rules the data rarely violates can still be broken, as with DIAMOND's repeated mid-air jumps in CS:GO.
- id: procedural-terrain
  effect: replaces-substrate
  note: 'Terrain is invented on demand from the learned distribution of the training game with no seed
    or noise function (Oasis), but it is not persistent: regions that leave the short context window are
    regenerated differently on return.'
- id: generative-content
  effect: enables-new
  note: Every frame, enemy, and pickup is generated content conditioned on play, so a game can in principle
    contain situations its source game never had; in practice output stays inside the training game's
    distribution.
- id: voxel-destruction
  effect: replaces-substrate
  note: In Oasis and MineWorld, breaking and placing Minecraft blocks is predicted as pixels with no stored
    voxel grid, so edits are not durable; Oasis placing a dirt block can bring up an entirely different
    environment.
limitations:
- 'Memory is a few seconds: GameNGen''s 64-frame context covers about 3 seconds, and Oasis shows about
  3 seconds of memory in one example, so off-screen state such as map layout or enemy positions is lost.'
- 'Requires an existing game to record: GameNGen needed about 70M agent frames from DOOM, DIAMOND 87 hours
  of CS:GO play; the approach clones a game rather than authoring a new one.'
- Each player needs a dedicated accelerator (one TPU-v5 for GameNGen, H100s for Oasis); Maginative reports
  cost remains a significant barrier to deploying such models at scale, and no per-player-hour figure
  is published.
- State such as health, ammo, inventory, and score is only as reliable as the pixels that show it; Oasis
  inventory control is imprecise and distant geometry is fuzzy.
- Training on footage of commercial games raises unresolved licensing questions.
