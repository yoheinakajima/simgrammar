id: llm-game-master
type: technique
name: LLM game master and narrative director
aliases:
- AI game master
- AI Dungeon
- Concordia Game Master
- story engine
- AI narrator
summary: A language model that adjudicates player and NPC intentions, decides outcomes, generates events
  and quests, and narrates them, either free-form or checked against a typed world state and canon.
category: llm-narrative-dialogue
year: 2019
mechanism: 'The player types an intent; the system assembles a prompt from recent story, pinned memories,
  and setting notes and asks the model to continue the story, as AI Dungeon has since 2019. Grounded variants
  split the job: actors state intended actions in language, a Game Master component checks plausibility
  against rules and state, decides what happens, writes state changes, and only then narrates (Concordia).
  Hidden Door runs intent through plan, canon check, and world-state update steps over a typed, auditable
  world model, using many small tuned models for about 100 narrative tasks; its example blocks Dracula
  from entering a house uninvited. Research systems generate setting, items, and NPCs from designer criteria
  and use the model to validate free-text input against the story (PANGeA), or assist a human Dungeon
  Master (CALYPSO).'
key_results:
- text: AI Dungeon 2 (December 2019) ran the full 1.5B-parameter GPT-2 and moved to GPT-3 in mid-2020,
    reaching over 100,000 players in its first week and 1.5 million by June 2020.
  sources:
  - src-wikipedia-ai-dungeon
  confidence: high
- text: AI Dungeon's 2021 content filter, added to block sexual content involving minors, produced false
    positives on innocuous text and led human moderators to read flagged private stories, prompting review
    bombing.
  sources:
  - src-wikipedia-ai-dungeon
  confidence: high
- text: In a 28-player study with five GPT-4 NPCs holding backstories, clues, and ordered goals, play
    produced 53 narrative nodes absent from the designers' graph; about 15 seconds of lag frustrated 40%
    of players and NPCs forgot earlier statements in 10% of reports.
  sources:
  - src-peng-2024-player-driven-emergence
  confidence: high
- text: Hidden Door announced early access in August 2025 and offers licensed worlds such as Dracula;
    its engine checks every story turn against canon and rules before display and reports a tuned 1.7B
    model beating a 120B general model on one core task.
  sources:
  - src-hiddendoor-2026-blog-index
  - src-hiddendoor-2026-homepage
  confidence: medium
- text: Concordia's Game Master converts agents' natural-language actions into outcomes and checks physical
    plausibility, and its 2025 design pattern classifies uses as Simulationist, Dramatist, or Evaluationist.
  sources:
  - src-vezhnevets-2023-concordia
  - src-vezhnevets-2025-multi-actor-game-engine
  - src-deepmind-2026-concordia-repo
  confidence: high
- text: Surveyed LLM game masters tend to accommodate even bizarre player requests that human GMs would
    curb, and LLM NPCs can invent quests that do not exist in the game.
  sources:
  - src-gallotta-2024-llms-games-survey
  confidence: medium
