affects:
- id: storyteller-director
  effect: enables-new
  note: The director can author an event in language for the exact current state, check it against canon
    and rules, and narrate it, instead of choosing among a finite catalog of pre-written incidents by
    a pacing budget.
- id: triggered-event-chains
  effect: replaces-substrate
  note: Follow-up beats are generated from story state and player intent rather than scheduled by authored
    templates with trigger predicates, while the player still experiences multi-step chains.
- id: villager-requests
  effect: deepens
  note: Characters can ask for things tied to the specific story so far, not only fetch templates with
    filled slots; ungrounded models invent quests that do not exist, so requests must be checked against
    state.
- id: generative-content
  effect: deepens
  note: Story continuation from Do, Say, Story, and See inputs makes the whole narrative generated content;
    grounded engines turn it into typed state changes.
- id: natural-language-interaction
  effect: enables-new
  note: Any typed action is adjudicated for plausibility and consequence rather than matched against a
    parser's verb list, so unanticipated approaches produce new narrative paths (53 emergent nodes in
    one 28-player study).
- id: procedural-characters
  effect: cuts-authoring-cost
  note: NPCs with backstories, goals, and personality are generated from designer criteria and voiced
    in dialogue, removing per-character writing.
builds_on: []
deployed_in:
- ai-dungeon
limitations:
- 'Long-session consistency: models forget or contradict earlier facts unless state is externalized into
  memory or a typed world model.'
- 'Accommodation bias: models rarely say no, which removes challenge and lets players talk past any obstacle.'
- 'Content moderation is hard: AI Dungeon''s filter both missed and over-blocked, and Steam requires guardrail
  disclosure for live-generated content.'
- Latency of several to 15 seconds per turn frustrated players in a GPT-4 study; multi-step grounded pipelines
  add calls per turn.
- Every turn is an inference cost for the life of the service, which pushes products to subscriptions
  or small tuned models.
claims:
- text: Steam requires games with live-generated AI content to disclose it and describe guardrails against
    illegal output, and does not permit live-generated adult sexual content.
  sources:
  - src-valve-2026-steamworks-content-survey
  - src-valve-2024-ai-content-on-steam
  confidence: high
- text: Dungeon Masters using CALYPSO presented some generated text almost directly and treated rougher
    output as ideas while keeping creative control.
  sources:
  - src-zhu-2023-calypso
  confidence: medium
- text: PANGeA generated settings, key items, and Big Five personality-biased NPCs from designer criteria
    and used the model to keep free-text player input within the narrative, tested in a browser demo and
    a Unity game.
  sources:
  - src-buongiorno-2024-pangea
  confidence: medium
- text: Steam generative AI disclosures rose from about 1,000 games in April 2024 to 7,818 (about 7% of
    the catalog, a little under 20% of 2025 releases) in July 2025 and 10,258 (about 8%) in November 2025;
    about 60% of disclosures concern visual assets, so live-generated runtime systems such as LLM narration
    are a small share.
  sources:
  - src-totallyhuman-2024-steam-genai-count
  - src-totallyhuman-2025-steam-genai-count
  - src-totallyhuman-2025-steam-ai-revenue
  confidence: medium
