id: cicero-strategic-dialogue
type: technique
name: Language models grounded in strategic planning for negotiation games
aliases:
- Cicero
- CICERO
- piKL
- Richelieu
summary: Meta's Cicero couples a dialogue language model with a planning engine that infers other players'
  intentions from the board and conversation, so its free-text negotiation proposes and follows concrete
  joint plans, reaching human-level Diplomacy.
category: game-theoretic-solvers
year: 2022
mechanism: 'Each phase, a planning module predicts every player''s likely actions from the board state
  and the dialogue so far. It starts from a policy model trained on human games and refines it with piKL,
  a regret-minimization search regularized by a KL penalty toward the human-like policy, so predictions
  stay plausible while improving expected value. The resulting plan fixes intents: the actions Cicero
  intends to take and the actions it proposes to each recipient. A dialogue language model, trained on
  human game messages and conditioned on the board, the message history, and these intents, generates
  candidate messages, which are filtered for consistency with the plan and the game state. Incoming messages
  update the predicted intents of others, which changes the plan and therefore what Cicero says next.
  The planner also models what others expect Cicero to do. Because messages are generated from intents
  rather than freely, what Cicero says tracks what it plans to do.'
key_results:
- text: Cicero averaged more than double the human score over 40 games in an anonymous online Diplomacy
    league and ranked in the top 10% of participants who played more than one game (Science, November
    2022).
  sources:
