affects:
- id: faction-diplomacy
  effect: enables-new
  note: Diplomacy becomes free-text negotiation with AI factions that propose specific joint moves, commit
    to them, and change plans when persuaded, instead of accept or decline treaty menus driven by opinion
    scores.
- id: natural-language-interaction
  effect: deepens
  note: Typed messages are translated into predicted intents that feed a planner, so what the player says
    changes what the AI does on the map, and the AI's replies are constrained to match its own plan.
- id: reputation
  effect: deepens
  note: An AI that models what others expect it to do can also track whether the player's stated intentions
    matched their moves, turning standing into a learned estimate of trustworthiness rather than a scalar
    moved by scripted events.
- id: negotiation
  effect: enables-new
  note: Planner-grounded dialogue lets AI counterparties propose, counter, and keep terms in free text
    instead of accepting or rejecting fixed offers.
- id: war-score-peace
  effect: deepens
  note: Peace terms could be negotiated in language against the war score, with the planner checking what
    the opponent will actually accept.
builds_on:
- imperfect-information-solvers
limitations:
- 'Built for one game: the dialogue model and the move policy were trained on human Diplomacy games and
  messages, so another game needs comparable data or a substitute.'
- Released weights are licensed for non-commercial use only (CC-BY-NC 4.0), and the repository is archived,
  so a studio cannot ship the released model.
- Training assumed a GPU cluster (example 256 GPUs) and inference loads large models per agent, which
  is costly for a game with several AI factions per player.
- Evaluation used an anonymous league; how players negotiate and whether they trust an opponent they know
  is an AI was not measured.
