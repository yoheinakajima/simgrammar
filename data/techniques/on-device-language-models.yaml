affects:
- id: natural-language-interaction
  effect: accelerates
  note: Free-text and voice input to characters runs on the player's GPU, removing per-token server cost
    and network round trips, so open conversation can be offered to every player of a premium game.
- id: utility-action-selection
  effect: replaces-substrate
  note: Smart Zois pick actions with a small model that reads needs, surroundings, and inner thoughts
    rather than only scored need curves, while the game's action set stays the same.
- id: memories-thoughts
  effect: enables-new
  note: Characters generate text thoughts about events and reflect on past decisions, giving each agent
    a running inner monologue rather than a list of authored mood modifiers.
- id: advisors
  effect: replaces-substrate
  note: 'Total War: PHARAOH''s ACE advisor answers questions about the game''s systems from a small on-device
    model connected to game data, instead of firing authored lines when indicators cross thresholds.'
- id: unit-commands
  effect: enables-new
  note: A co-playable teammate such as PUBG Ally takes spoken orders about movement, looting, and strategy
    mid-match and acts on them, a command channel that needs no menus or ping wheel.
builds_on: []
deployed_in:
- inzoi
limitations:
- 'Hardware floor: the inference SDK needs an RTX 30-series class GPU with 8 GB of VRAM minimum, which
  excludes many players and consoles, and the model competes with rendering for VRAM and GPU time.'
- Small models are less capable at multi-step reasoning, so vendors offload strategic planning to cloud
  models, reintroducing cost and latency.
- Quality and safety filters must also run locally; local weights can be extracted or modified by players.
- 'Player reception risk: inZOI drew negative user reviews in May 2025 after Krafton announced its generative
  AI use.'
- Exact model sizes and latency in shipped titles are mostly undisclosed.
