id: on-device-language-models
type: technique
name: On-device small language models for characters
aliases:
- NVIDIA ACE
- Smart Zoi
- PUBG Ally
- co-playable characters
- SLM NPCs
- quantized local LLMs
summary: Pruned, distilled, and 4-bit quantized language, speech, and embedding models that run on the
  player's GPU beside rendering to drive character decisions, dialogue, and voice without per-token server
  cost.
category: inference-efficiency
year: 2025
mechanism: A 12B or 8B model is pruned in depth and width and distilled into an 8B, 4B, or 2B student
  (Minitron), then weights are quantized to 3-4 bits with second-order (GPTQ) or activation-aware (AWQ)
  methods, shrinking memory so a 2B model fits in about 1.5 GB of VRAM. An in-game inference SDK runs
  the models in-process and schedules them alongside graphics on the same GPU. A character loop chains
  on-device speech recognition, the small model (perceive, decide, act, reflect), text-to-speech, and
  facial animation, with an in-process embedding model for memory retrieval; slow strategic planning can
  be offloaded to a larger cloud model while fast decisions stay local. Fine-tuning a small model on a
  narrow game task can beat much larger general models on that task.
key_results:
- text: Minitron pruning and distillation compressed Mistral NeMo 12B to an 8B model and Llama 3.1 8B
    to 4B, and NVIDIA's ACE character stack lists Minitron 8B, 4B, and 2B instruct models, the 2B fitting
    in about 1.5 GB of VRAM.
  sources:
  - src-sreenivas-2024-minitron
  - src-nvidia-2025-ace-companions
  confidence: high
- text: GPTQ quantizes weights to 3-4 bits with minimal accuracy loss and generates 3.25-4.5x faster than
    FP16; AWQ's 4-bit runtime is over 3x faster than FP16 on desktop and mobile GPUs.
  sources:
  - src-frantar-2022-gptq
  - src-lin-2023-awq
  confidence: high
- text: inZOI (early access March 2025) ships an on-device SLM through which typed prompts influence Zois'
    actions and thoughts; an August 2025 update made Smart Zois observe surroundings and react to events
    better and align actions with inner thoughts.
  sources:
  - src-steam-2025-inzoi
  - src-nvidia-2025-gamescom-ace
  confidence: high
- text: KRAFTON ran a public PUBG Ally beta (Ally Duo, 17 June to 1 July 2026) in which an AI teammate
    takes voice instructions via an on-device small language model built on NVIDIA ACE with speech-to-text
    and text-to-speech.
  sources:
  - src-krafton-2026-pubg-ally-beta
  confidence: high
- text: NVIDIA's in-game inference SDK requires an RTX 30-series class GPU or newer with at least 8 GB
    of VRAM (12 GB recommended), and some plugins need RTX 40-series.
  sources:
  - src-nvidia-2026-nvigi-core
  confidence: high
- text: Hidden Door reports that a 1.7B model tuned on real play beat a 120B general model on one of its
    core narrative tasks.
  sources:
  - src-hiddendoor-2026-homepage
  confidence: low
