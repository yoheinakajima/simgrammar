determinism_impact: mitigable
horizon: 3-5y
risks:
- controllability
- evaluation
- compute-cost
affects:
- id: scenario-objectives
  effect: enables-new
  note: 'Objectives stop being a fixed authored list: a model writes each task and its success check as
    code, admitted only if it is neither already solved nor out of reach, so a sandbox can keep issuing
    new challenges.'
- id: procedural-terrain
  effect: deepens
  note: Terrain parameters are mutated against measured agent or player performance, as POET did with
    walker terrain roughness, gaps, and stumps, so maps grow harder along the axes a player has already
    mastered.
- id: adaptive-threat-scaling
  effect: replaces-substrate
  note: Challenge scales with measured learning progress per task family rather than with wealth or time
    survived, using a band that admits only tasks the current agent or player can partly solve.
- id: creature-learning
  effect: deepens
  note: A creature or companion can improve through self-proposed practice tasks with model-estimated
    rewards, the loop SIMA 2 used, rather than only through explicit player reward and punishment.
- id: villager-requests
  effect: deepens
  note: Requests can be generated beyond fixed templates, with completion conditions written as generated
    code over simulation state and an archive of past requests used to avoid repeats.
builds_on:
- genie-world-models
- generalist-game-agents
limitations:
- Cost is dominated by training or evaluating an agent on every candidate task, so the loop runs offline
  and is too slow to respond to a live player directly.
- Interestingness and success are judged by foundation models or generated code that can be wrong, and
  generated reward code can be satisfied by unintended behavior.
- SIMA 2 still struggles with very long-horizon tasks, short memory, precise low-level control, and robust
  visual understanding, which limits the tasks it can practice.
- Worlds generated by video world models are approximate and short-horizon rather than rules-exact simulations,
  so success checks inside them are approximate.
