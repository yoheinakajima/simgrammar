id: open-ended-environment-generation
type: technique
name: Open-ended co-generation of environments and agents
aliases:
- POET
- Enhanced POET
- OMNI-EPIC
- SIMA 2 self-improvement
- automatic curriculum generation
summary: Systems that keep generating new environments or tasks at the edge of an agent's ability and
  train agents on them, from POET's co-evolved terrains to OMNI-EPIC's foundation-model-written task code
  and SIMA 2 practicing in Genie 3 worlds.
category: reinforcement-learning
year: 2024
mechanism: 'POET keeps a population of environment-agent pairs. It mutates environment parameters (for
  a 2D walker: roughness, gap width, stump height), admits a child environment only if current agents
  score within a band that is neither too easy nor too hard, optimizes each agent in its paired environment,
  and periodically tests whether an agent from another pair does better there, transferring it if so.
  Enhanced POET adds a novelty measure based on how agents rank on an environment and a more flexible
  environment encoding. OMNI-EPIC replaces parameter mutation with a foundation model that writes environment
  and reward code for a physics simulator, conditioned on an archive of solved and failed tasks; a model
  of interestingness rejects near-duplicates, an RL agent trains on each task, and a success check decides
  whether the task enters the archive. SIMA 2 has Gemini propose tasks and estimate rewards in commercial
  games and in Genie 3 generated worlds, then trains later agents on its own experience. The shared loop
  is: generate a task, check it is learnable, train, archive, repeat.'
key_results:
- text: POET (2019) co-generated environment challenges and agents, producing behaviors that solved challenges
    direct optimization and a direct-path curriculum could not, and transfer between environments was
    essential.
  sources:
  - src-wang-2019-poet
  confidence: high
- text: Enhanced POET (2020) added a domain-general measure of meaningful novelty, an efficient transfer
    heuristic, a more flexible environment encoding, and a measure of ongoing open-ended innovation.
  sources:
  - src-wang-2020-enhanced-poet
  confidence: high
- text: OMNI-EPIC (2024) used foundation models to write environment and reward code for tasks judged
    both learnable and interesting, kept proposing new tasks, and adjusted difficulty to the agent's learning
    progress.
  sources:
  - src-faldor-2024-omni-epic
  confidence: medium
- text: SIMA 2 (November 2025) learned new games through self-directed play from Gemini-proposed tasks
    and estimated rewards without new human data, improved on previously failed tasks across generations
    including in Genie 3 worlds, and remained a limited research preview.
  sources:
  - src-deepmind-2025-sima-2-blog
  confidence: medium
maturity: research
trl: 4
runtime:
- offline-authoring
