affects:
- id: procedural-build-assist
  effect: enables-new
  note: 'Blocky player builds are rendered as detailed structures in a prompted style (for example Roman),
    a visual-only form of build assist: collision and block state stay coarse while the view is detailed.'
- id: generative-content
  effect: enables-new
  note: Players or in-world logic change the whole world's look at runtime by text, without new textures
    or models; the game's systems cannot read the new look, so it carries no gameplay meaning.
builds_on:
- diffusion-game-engines
deployed_in:
- minecraft
limitations:
- Short frame window and no long-term memory, so restyled objects can change appearance between views.
- Rendered detail can contradict game state (a block that looks like a door but is solid), hurting legibility.
- Cloud-served stream adds network latency and per-player GPU cost; no price per hour is published.
