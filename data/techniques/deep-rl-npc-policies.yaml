id: deep-rl-npc-policies
type: technique
name: Deep reinforcement learning policies for NPC opponents and navigation
aliases:
- Gran Turismo Sophy
- GT Sophy
- learned NPC controllers
- Unity ML-Agents
summary: Neural control policies trained with deep reinforcement learning inside the game's own simulation
  drive opponents and NPCs, as with Sony AI's Gran Turismo Sophy, a selectable rival in Gran Turismo 7
  since 2023.
category: reinforcement-learning
year: 2022
mechanism: The game exposes observations (car state, track geometry, nearby opponents; or local terrain
  and goal direction for navigation) and actions (steering, throttle, brake; or movement and ability inputs)
  to a learning agent. Many instances run in parallel, and model-free deep RL learns a policy network
  that maps observations to actions to maximize a shaped reward. For GT Sophy the reward values course
  progress and was designed to encode racing's under-specified sportsmanship rules, and training mixed
  racing scenarios so one policy handles both speed and tactics. For NPCs with jetpacks, grappling hooks,
  or double jumps, where navigation meshes break down, the reward is reaching a goal. The trained network
  is small enough to run every frame. Difficulty is set by giving the agent cars of different performance
  or alternate checkpoints, and later GT Sophy versions expose settings such as tire and fuel consumption.
  Toolkits such as Unity ML-Agents connect engine scenes to training code.
key_results:
- text: GT Sophy, trained with model-free deep RL across mixed racing scenarios and a reward designed
    around sportsmanship rules, beat four of the world's best Gran Turismo drivers head to head (Nature,
    February 2022).
  sources:
  - src-wurman-2022-gt-sophy
  confidence: high
  quote: We demonstrate the capabilities of our agent, Gran Turismo Sophy, by winning a head-to-head competition
    against four of the world’s best Gran Turismo drivers
  locator: Abstract
- text: GT Sophy entered Gran Turismo 7 as the time-limited Race Together event in update 1.29 (February
    2023), with four races against GT Sophy cars of different performance at Beginner, Intermediate, and
    Expert levels and a 1vs1 mode.
  sources:
  - src-polyphony-2023-gt-sophy-race-together
  confidence: high
- text: GT Sophy 2.0 became a permanent Quick Race rival in GT7's Spec II update (November 2023) on nine
    tracks and 340 cars, 95% of the car models, up from four cars and four tracks, on PS5 only.
  sources:
  - src-polyphony-2023-gt-sophy-2
  confidence: high
- text: GT Sophy 2.1 (update 1.57, March 2025) moved into Custom Race with 19 car and track options, lap
    count, parts and tuning changes, and adjustable tire and fuel consumption.
  sources:
  - src-sony-2025-gt-sophy-2-1
  confidence: high
- text: Ubisoft La Forge's deep RL navigation handled grappling hooks, jetpacks, teleporters, and double
    jumps on maps about ten times larger than typical RL research maps, one modeled on a Ubisoft AAA game,
    with at least 90% success.
  sources:
  - src-alonso-2020-drl-navigation-aaa
  confidence: medium
  quote: notably an order of magnitude larger than maps typically used in the Deep RL literature. One
    of these maps is directly modeled after a Ubisoft AAA game
  locator: Abstract
- text: Unity's open-source ML-Agents Toolkit lets developers train agents inside Unity scenes.
  sources:
  - src-juliani-2018-unity-ml-agents
  confidence: high
  quote: is an open source project which enables researchers and developers to create simulated environments
    using the Unity Editor and interact with them via a Python API
  locator: Section 5, The Unity ML-Agents Toolkit
