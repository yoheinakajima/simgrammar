affects:
- id: vehicle-dynamics
  effect: deepens
  note: AI drivers operate the same tire, suspension, and weight-transfer model as the player at champion
    level, so handling fidelity matters in races against the AI instead of being sidestepped by scripted
    racing lines.
- id: embodied-skill-control
  effect: deepens
  note: Players practice against an opponent whose skill comes from the same controls and physics, at
    selectable levels (Beginner to Expert, then custom tire and fuel settings), raising the ceiling of
    a skill-centered mechanic.
- id: agent-pathfinding
  effect: replaces-substrate
  note: For movement abilities such as grappling hooks, jetpacks, and double jumps, a learned policy replaces
    hand-placed navigation-mesh links, so NPCs can traverse spaces designers would otherwise annotate
    by hand.
builds_on:
- massively-parallel-simulation
deployed_in:
- gran-turismo-7
limitations:
- 'Coverage arrives per content item: GT Sophy grew from four cars and four tracks to nine tracks and
  340 cars across updates, because each track and car needs training and validation.'
- A policy trained to win needs reward shaping and later refinement for sportsmanship and enjoyment; Sony
  AI describes refining GT Sophy's behavior for etiquette and players of all skill levels after the research
  version.
- 'Availability was narrow at first: GT Sophy 2.0 ran only in Quick Race on PS5, not in other events on
  the same tracks.'
- Learned policies are hard to direct for scripted moments, and physics or content patches can require
  retraining and re-validation.
- Deep RL transfers poorly between games without heavy tuning, as EA reported, so each title builds its
  own training setup.
