determinism_impact: preserves
horizon: now
risks:
- consistency
- controllability
affects:
- id: soft-body-deformation
  effect: replaces-substrate
  note: Deformation learned from an offline solver runs 300-5000x faster than that solver, putting near-offline-quality
    cloth and flesh response within a real-time budget.
- id: embodied-skill-control
  effect: deepens
  note: Hands-on tasks such as surgery or handling soft objects could show tissue and cloth reacting plausibly
    to tools in real time, adding feedback the player reads to perform the skill.
deployed_in: []
limitations:
- Quality holds only near the training distribution of poses and interactions; unusual poses or collisions
  produce artifacts, so coverage of the offline dataset sets the limit.
- 'Training is heavy: Unreal''s documentation notes long training times and Alembic training caches of
  50-100 GB.'
- GPU memory for morph targets is the main runtime cost, and compression settings trade memory and speed
  for quality.
- Output is usually cosmetic; it does not feed back into gameplay physics unless the game reads the deformed
  state, which brings determinism and consistency issues.
- No commercial title using these models at runtime was confirmed in this run's sources.
