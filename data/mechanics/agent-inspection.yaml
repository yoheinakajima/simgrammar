id: agent-inspection
type: mechanic
name: Agent inspection
aliases:
- inspect panel
- character sheet
- unit info panel
summary: Selecting an agent opens a panel that reveals its needs, mood contributors, current job, and
  the reasons behind its behavior.
family: information-legibility
substrate:
- ui-layer
- agent-based
definition: 'Selecting an individual agent opens a live panel that reads that agent''s internal state:
  need levels, mood and its itemized contributors, current action and its target, queued actions, skills,
  traits, relationships, health by body part, inventory, and sometimes a log of recent thoughts or events.
  The mechanic owns only the selection and which fields are exposed; it reads state owned by other mechanics
  and refreshes each tick or on change. Its key design property is whether it shows reasons (why the agent
  is doing this) or only values. Canonical forms: The Sims need bars and visible action queue, RimWorld''s
  needs, health, and social tabs with each mood thought listed with its source and expiry, Dwarf Fortress
  unit thoughts and preferences sheets, and RollerCoaster Tycoon guest windows listing a guest''s thoughts,
  cash, hunger, and nausea.'
player_experience: A crowd becomes individuals. When an agent misbehaves the player clicks it to find
  out why, reads the cause, and fixes the environment rather than the agent. Reading named thoughts and
  histories builds attachment and supplies the raw material for player stories.
design_levers:
- 'depth of exposure: raw meters, itemized reasons, or a full decision trace'
- whether each reason lists its source, magnitude, and remaining duration
- live updating versus snapshot on open
- which variables stay hidden (true personality, latent potential) to preserve uncertainty
- whether every agent is inspectable or only a representative sample at large populations
- supporting affordances such as follow camera, thought bubbles, and pinned favorites
failure_modes:
- Panels with dozens of unranked numbers overwhelm players without telling them what matters.
- The panel shows state but not the decision rule, so behavior still looks random even after inspection.
- Inspection exposes shortcuts in the agent model; following citizens in SimCity (2013) revealed that
  agents took the nearest free home and job rather than keeping their own, undermining belief in individual
  citizens.
- At city scale inspecting one agent is unrepresentative, so players cannot diagnose aggregate problems
  from it.
dynamics:
- Players trace aggregate problems to individual causes, such as following one hauler to find a pathing
  bottleneck.
- Named, inspectable agents raise the emotional cost of loss, which strengthens permadeath and injury
  systems.
- Exposed reasons create pressure on designers to make the underlying model truthful, since players test
  it against what the panel says.
math_basis:
- utility-decision
feedback: none
player_interface:
- observation
legibility: 4
emergence_potential: 1
authoring_cost: 2
compute_cost: 1
tuning_difficulty: 1
ai_leverage: 3
maturity: classic
synergy:
- id: memories-thoughts
  note: Inspection panels expose the thought list, converting hidden state into narrative.
open_questions:
- For agents driven by language models, what inspection format (plans, memories, rationales) lets players
  predict behavior rather than just read it?
- How much reason exposure maximizes attachment before it turns agents into transparent spreadsheets?
sources: []
status: asserted
provenance:
  created: 2026-10-24-taxonomy-m6
  reviewed:
  - 2026-10-29-shreyko-antim-rate-scores-19
ratings:
- field: legibility
  value: 4
  run: 2026-10-24-taxonomy-m6
  rationale: original score
- field: legibility
  value: 4
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Clicking an agent to inspect needs, actions and reasons is mostly intuitive. Dense tabs and
    incomplete decision traces prevent transparency at a glance (5), while understanding the inspection
    layer generally needs no deliberate study (3).
- field: emergence_potential
  value: 1
  run: 2026-10-24-taxonomy-m6
  rationale: original score
- field: emergence_potential
  value: 1
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: The panel reads existing state and owns only selection and exposed fields. Revealing histories
    can support perceived stories, but it does not generate simulation variation above deterministic presentation
    (1), so 2 is unwarranted.
- field: authoring_cost
  value: 2
  run: 2026-10-24-taxonomy-m6
  rationale: original score
- field: authoring_cost
  value: 2
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Field labels, reason formatting and panel schemas are mainly small data definitions. This
    exceeds rules alone (1), but underlying agents, histories and animations belong to other mechanics
    rather than bespoke inspection content per variant (3).
- field: compute_cost
  value: 1
  run: 2026-10-24-taxonomy-m6
  rationale: original score
- field: compute_cost
  value: 1
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Reading a selected agent and refreshing a panel is negligible at typical use. Simulating
    the whole population is separate, so level 2 linear population cost should not be attributed to this
    view.
- field: tuning_difficulty
  value: 1
  run: 2026-10-24-taxonomy-m6
  rationale: original score
- field: tuning_difficulty
  value: 1
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Choosing which existing state to reveal is primarily an information-design decision, largely
    irrelevant to economic or combat balance. Visibility can influence play, but there is no required
    parameter-balancing loop justifying 2.
- field: ai_leverage
  value: 4
  run: 2026-10-24-taxonomy-m6
  rationale: original score
- field: ai_leverage
  value: 3
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Models can summarize histories and translate decision traces into contextual explanations,
    notably changing information cost and variety beyond incremental labels (2). An inspectable panel
    remains the same form, so substantially new mechanics (4) are not assumed.
