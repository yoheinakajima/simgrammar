id: async-shared-region
type: mechanic
name: Asynchronous shared regions
aliases:
- asynchronous multiplayer
- region play
- shared region
summary: Separate players' simulations affect each other asynchronously through shared regions, visits,
  or exchanges of goods and services.
family: multiplayer-persistence
substrate:
- network-graph
- aggregate-stocks
definition: 'Each player runs a local simulation that publishes a small exported state to a server, such
  as surplus resources, service capacity, pollution, or a snapshot of a town, and periodically imports
  neighbors'' exported state as boundary conditions. Exchanges resolve with delay, so play does not require
  both players online at once. In SimCity (2013), cities in a region connect by highways, rail, and waterways,
  trade resources, share services such as garbage collection or health care, see traffic and pollution
  cross borders, and pool wealth into Great Works such as an arcology; the connection was asynchronous,
  with brief disruptions tolerated. Animal Crossing island visits and Death Stranding''s shared structures
  are related forms. Inputs: local surpluses and needs. Outputs: imported flows and shared projects.'
player_experience: The player is part of a neighborhood without coordinating schedules. They specialize,
  relying on neighbors for what they lack, and notice others' choices arrive as traffic, pollution, or
  help. Cooperation feels light because commitments are small and delayed.
design_levers:
- which variables are exported and imported (goods, services, pollution, visitors)
- synchronization interval and conflict resolution
- region size and how neighbors are matched (friends, public, random)
- shared projects that require pooled contributions
- fallback behavior when the server or a neighbor is offline
failure_modes:
- Server dependence makes single-player play fragile; SimCity (2013) launched with outages and save problems,
  and an offline mode came later.
- Abandoned neighbor cities leave dependent players short of the services they relied on.
- Small play areas forced by the region design made specialization a necessity rather than a choice, which
  players criticized.
dynamics:
- 'Specialization emerges: one city goes industrial or hosts the hospital and the others import those
  services.'
- Externalities such as pollution and traffic cross borders, creating friction between players who never
  speak.
- Shared projects create focal points that coordinate otherwise independent players.
math_basis:
- network-flow
- game-theory
feedback: both
player_interface:
- parameter
- placement
legibility: 3
emergence_potential: 3
authoring_cost: 2
compute_cost: 2
tuning_difficulty: 3
ai_leverage: 2
maturity: established
open_questions:
- Can AI-controlled stand-in neighbors, trained on real player cities, keep regions alive when players
  leave?
- What exchange latency preserves the feeling of a shared region while keeping each player's simulation
  independent?
sources:
- src-wikipedia-simcity-2013
status: sourced
provenance:
  created: 2026-10-24-taxonomy-m7
  reviewed:
  - 2026-10-24-review-fixes
  - 2026-10-29-shreyko-antim-rate-scores-19
ratings:
- field: legibility
  value: 3
  run: 2026-10-24-taxonomy-m7
  rationale: original score
- field: legibility
  value: 3
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Players must inspect flows and wait through synchronization delays to understand distant
    causes and dependencies. This needs deliberate attention and info tools rather than mostly intuitive
    local feedback (4), while external wikis are not inherently necessary (2).
- field: emergence_potential
  value: 3
  run: 2026-10-24-taxonomy-m7
  rationale: original score
- field: emergence_potential
  value: 4
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Specialization, cross-border pollution and service dependencies propagate other players'
    choices through several systems. These are frequent consequence chains beyond 3, but exported boundary
    flows do not universally become primary story engines (5).
- field: authoring_cost
  value: 2
  run: 2026-10-24-taxonomy-m7
  rationale: original score
- field: authoring_cost
  value: 2
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Export schemas, service/resource types and shared-project definitions are small tables. Networking
    engineering is not per-variety content, keeping this above rules-only authoring (1) but below moderate
    bespoke assets for each exchange (3).
- field: compute_cost
  value: 2
  run: 2026-10-24-taxonomy-m7
  rationale: original score
- field: compute_cost
  value: 2
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Periodic compact-state publication and boundary-flow imports are modest linear processing
    at typical region size. Serialization and reconciliation exceed negligible work (1), while server
    outages and latency do not establish compute slowdown at level 3.
- field: tuning_difficulty
  value: 3
  run: 2026-10-24-taxonomy-m7
  rationale: original score
- field: tuning_difficulty
  value: 4
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Rates, export limits and offline fallback can make dependence or specialization dominant
    and propagate shortages between players. This exceeds routine interacting-parameter tuning (3), but
    capped flows and robust fallback can stabilize outcomes below 5.
- field: ai_leverage
  value: 3
  run: 2026-10-24-taxonomy-m7
  rationale: original score
- field: ai_leverage
  value: 2
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: AI can help tune matching, flow estimates or abandoned-neighbor fallback, incremental improvements
    above little change (1). Asynchronous export/import remains the design ceiling; notable new variety
    or content-cost change at 3 is not evident.
