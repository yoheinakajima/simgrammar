id: agent-skills
type: mechanic
name: Agent skills
aliases:
- skill levels
- learning by doing
- experience levels
summary: Agents gain skill through practice or training, and skill sets work speed, quality, and access
  to tasks.
family: agents-behavior
substrate:
- agent-based
- aggregate-stocks
definition: 'Each agent holds an experience stock and level per skill. Doing a task adds experience at
  a rate scaled by learning modifiers; crossing thresholds raises the level, and some games decay unused
  high levels. Level feeds work speed, success or botch chance, output quality, and minimum-level gates.
  RimWorld uses levels 0-20; experience to the next level rises from 1,000 at level 0 to 30,000 at level
  19; passion sets learning to 35% (none), 100%, or 150%; skills above 9 decay by 30 to 3,600 XP per day;
  a daily cap of 4,000 XP per skill cuts further gains to 20%; construction speed is 50% plus 15% per
  level; some backstories make pawns incapable of a work type. The Sims raises skills through objects
  such as bookshelves and easels and gates promotions on them; Dwarf Fortress dwarves improve by repeating
  labors. Inputs: task time, learning modifiers. Outputs: speed, quality, eligibility for tasks.'
player_experience: Agents become individuals with track records. The player assigns specialists, trains
  newcomers on low-stakes work, and feels the loss when a master crafter dies. Skill growth gives each
  character a slow progression arc that runs alongside the base's growth.
design_levers:
- experience curve shape and level cap
- learning-rate modifiers such as passions, traits, age, and teachers
- decay of unused skills and daily learning caps
- effect curves per level on speed, quality, and failure chance
- hard gates (minimum level, incapable) versus soft penalties
failure_modes:
- Uncapped or linear growth turns every long-lived agent into a master, flattening differences between
  characters.
- 'Grinding: players set agents to repeat cheap tasks to farm experience, which RimWorld counters with
  a daily learning cap.'
- Steep effect curves make low-skill recruits useless, so new agents are dead weight rather than trainees.
- Decay without clear feedback reads as random loss of competence.
dynamics:
- 'Specialization snowballs: the best agent at a job gets assigned it, which raises that skill further
  and widens gaps.'
- Losing a specialist opens a capability hole that forces retraining or recruitment; with permadeath this
  is a common crisis.
- Coupled with quality tiers, item value depends on who made it, so assignment becomes an economic decision.
math_basis:
- system-dynamics
- probability-statistics
feedback: both
player_interface:
- observation
- parameter
legibility: 4
emergence_potential: 3
authoring_cost: 2
compute_cost: 1
tuning_difficulty: 3
ai_leverage: 2
maturity: classic
synergy:
- id: staff-hiring
  note: Hiring trades wage cost against skill, and skills grow with time on the roster.
- id: work-priorities
  note: Priorities route skilled agents to the jobs they do best.
- id: quality-tiers
  note: Skilled workers produce higher-quality goods.
open_questions:
- Can skills be represented as learned competence (policies that actually improve) rather than numeric
  multipliers, and does that change player attachment?
- Which decay and cap settings keep specialization meaningful without rewarding grinding?
sources:
- src-rimworldwiki-2026-skills
status: sourced
provenance:
  created: 2026-10-24-taxonomy-m3
  reviewed:
  - 2026-10-29-shreyko-antim-rate-scores-19
ratings:
- field: legibility
  value: 4
  run: 2026-10-24-taxonomy-m3
  rationale: original score
- field: legibility
  value: 4
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Practice improving competence and higher skills improving output are intuitive. Decay, passion
    and caps cause occasional surprises, excluding 5; the basic progression and specialization model does
    not require deliberate investigation (3).
- field: emergence_potential
  value: 3
  run: 2026-10-24-taxonomy-m3
  rationale: original score
- field: emergence_potential
  value: 4
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Specialization reinforces assignments, changes economic quality, and makes specialist death
    a capability crisis. These are cross-system chains beyond isolated interactions (3), but skills alone
    are not a primary story engine wherever used (5).
- field: authoring_cost
  value: 2
  run: 2026-10-24-taxonomy-m3
  rationale: original score
- field: authoring_cost
  value: 2
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Experience curves, task modifiers, gates and level effects are small tables. They require
    more than content-free rules (1), without bespoke assets for every skill level or progression variant
    (3).
- field: compute_cost
  value: 1
  run: 2026-10-24-taxonomy-m3
  rationale: original score
- field: compute_cost
  value: 2
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Experience accumulation, threshold checks and decay scale linearly over agent skills with
    modest constants. At colony scale this exceeds negligible one-value bookkeeping (1), but it is not
    a usual slowdown source (3).
- field: tuning_difficulty
  value: 3
  run: 2026-10-24-taxonomy-m3
  rationale: original score
- field: tuning_difficulty
  value: 4
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Small growth or output-curve changes can make grinding optimal, specialists snowball or recruits
    useless. That dominant-strategy sensitivity exceeds ordinary multi-parameter tuning (3), while caps,
    decay and soft gates can settle balance below 5.
- field: ai_leverage
  value: 2
  run: 2026-10-24-taxonomy-m3
  rationale: original score
- field: ai_leverage
  value: 2
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: AI can assist experience curves, training advice and balance checks, incremental changes
    above little expected impact (1). It does not materially change the stock-level-task-effect mechanic
    or its variety enough for 3.
