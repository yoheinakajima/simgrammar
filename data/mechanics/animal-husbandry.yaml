id: animal-husbandry
type: mechanic
name: Animal husbandry
aliases:
- livestock
- ranching
- animal breeding
summary: Domestic animals are housed, fed, tended, and bred, and they yield products whose quantity and quality depend on
  their care.
family: biology-health
substrate:
- agent-based
- aggregate-stocks
definition: 'Owns a herd of individual animals or a count per species, each with growth stage, food state, often affection
  or mood, and sometimes pregnancy and genes. Each day animals eat from grazing or stored fodder, grow toward maturity, and
  roll for products such as milk, eggs, or wool and for births; care actions raise affection or mood, which scales yield and
  quality. Stardew Valley tracks friendship from 0 to 1000 and mood from 0 to 255: unfed animals stop producing but do not
  die, mood under 70 can skip production, quality products need mood 150, and a nightly birth check governs pregnancies. RimWorld
  and Dwarf Fortress breed animals that must be fed, sheltered, trained, or slaughtered; Farming Simulator ties livestock
  productivity to feed. Inputs are feed, housing, and care; outputs are products, meat, and offspring.'
player_experience: 'Routine care with compounding returns. The player builds pens and barns, keeps feed stocked through winter,
  and turns daily tending into reliable income. Animals can become personal: named, petted, and missed when lost to a predator
  or a hard winter.'
design_levers:
- feed requirement per animal and the balance between grazing and stored fodder
- time to maturity and product cycle per species
- how care, mood, and affection scale yield and quality
- breeding rate and population caps from housing size
- 'losses: disease, predators, exposure, slaughter decisions'
failure_modes:
- Unchecked breeding produces runaway herds that eat all fodder and then starve, a recurring colony-sim problem.
- Daily care actions with no decisions become chores players automate away or abandon.
- Animals that can never die or fall ill turn husbandry into passive income.
dynamics:
- Feed demand links husbandry to crop fields and storage, especially before winter.
- Herds become targets for predators and raids, requiring fences and defense.
- Breeding for traits ties husbandry to inheritance and long-term planning.
math_basis:
- population-dynamics
- genetics-evolution
- system-dynamics
feedback: both
player_interface:
- direct-manipulation
- placement
- orders
legibility: 4
emergence_potential: 3
authoring_cost: 3
compute_cost: 2
tuning_difficulty: 3
ai_leverage: 2
maturity: classic
open_questions:
- Can learned animal behavior and animation make individually simulated livestock expressive enough to deepen attachment without
  bespoke animation per species?
sources:
- src-stardewvalleywiki-2026-animals
status: sourced
provenance:
  created: 2026-10-24-taxonomy-m5
  reviewed:
  - 2026-10-29-shreyko-antim-rate-scores-19
ratings:
- field: legibility
  value: 4
  run: 2026-10-24-taxonomy-m5
  rationale: original score
- field: legibility
  value: 4
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Feeding, tending and breeding to improve output is mostly intuitive. Hidden mood thresholds
    and birth rolls create occasional surprises below 5, while ordinary herd management need not require
    deliberate info-tool analysis (3).
- field: emergence_potential
  value: 3
  run: 2026-10-24-taxonomy-m5
  rationale: original score
- field: emergence_potential
  value: 4
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Breeding affects fodder demand, crop storage, winter survival and defense against predators
    or raids. These frequent chains exceed isolated unplanned situations (3), but husbandry is not a primary
    story engine wherever implemented (5).
- field: authoring_cost
  value: 3
  run: 2026-10-24-taxonomy-m5
  rationale: original score
- field: authoring_cost
  value: 3
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Animal species need distinct models, products, stages and care behaviors, moderate bespoke
    content beyond small tables (2). Reused care and breeding rules generate much variety without requiring
    a large writing or voice pipeline (4).
- field: compute_cost
  value: 2
  run: 2026-10-24-taxonomy-m5
  rationale: original score
- field: compute_cost
  value: 2
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Typical herds use modest linear updates for feeding, growth, yields and births. This exceeds
    negligible stock bookkeeping (1), but runaway herd sizes are a failure case rather than a reason to
    call ordinary use a common slowdown (3).
- field: tuning_difficulty
  value: 3
  run: 2026-10-24-taxonomy-m5
  rationale: original score
- field: tuning_difficulty
  value: 4
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Breeding and yield feedback can make small rate changes create runaway herds, famine or passive-income
    dominance. This exceeds routine interacting-parameter tuning (3), but feed costs and housing constraints
    can stabilize balance below 5.
- field: ai_leverage
  value: 2
  run: 2026-10-24-taxonomy-m5
  rationale: original score
- field: ai_leverage
  value: 3
  run: 2026-10-29-shreyko-antim-rate-scores-19
  rationale: Generated animal variants and more adaptive care behavior can notably expand variety or reduce
    content cost beyond incremental tuning (2). The herd-care-products role persists, and a substantially
    new form at 4 is not established.
