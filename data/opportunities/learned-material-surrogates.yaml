id: learned-material-surrogates
type: opportunity
name: Learned material surrogates at world scale
summary: Use learned and GPU-parallel physics surrogates to bring per-particle fluids, gases, and destruction
  from small arenas to large persistent worlds.
opportunity_type: infrastructure
thesis: Noita, Teardown, BeamNG, and Oxygen Not Included show players love worlds where every particle
  or voxel is simulated, but compute caps these simulations to small areas or 2D. Graph-network simulators
  and neural operators learn fluid, cloth, and deformation dynamics at large speedups, and GPU-parallel
  simulators make the remaining numerical work cheap. Combining a learned surrogate for the far field
  with exact simulation near the player could extend material simulation to whole maps.
design_sketch: A colony or sandbox world where water, heat, gas, and structural stress are simulated everywhere
  at coarse resolution by a learned surrogate and exactly within a radius of active play, with consistent
  hand-off at the boundary. Players can flood a valley or collapse a mountain and see effects propagate
  realistically across the map.
involves:
- fluid-gas-simulation
- heat-transfer
- voxel-destruction
- falling-sand-materials
- structural-integrity
- soft-body-deformation
applies:
- graph-network-simulators
