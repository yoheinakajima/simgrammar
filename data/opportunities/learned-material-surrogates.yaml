novelty: 4
feasibility: 2
impact: 4
horizon: 3-5y
key_risks:
- Surrogates break conservation laws, producing exploitable infinite water or energy.
- Boundary artifacts between surrogate and exact zones.
- Determinism across GPUs for multiplayer.
validation_experiment: 'Train a graph-network surrogate on a 2D falling-sand fluid simulator and measure
  mass conservation error and speedup over 10,000 steps at four times the training domain size. Success:
  mass error under 1 percent with a speedup above 10 times.'
falsifiable_signal:
  prediction: A game will use a learned surrogate model to simulate fluid, gas, or destruction at runtime.
  resolve_by: '2029-12-31'
  criteria: 'Released after 2026-10-24 with at least 1,000 Steam user reviews or a console release; developer
    documentation or a technical talk confirms that a trained neural model computes physical material
    behavior during play, not only visual effects. Technique class: trained neural models only, so this
    is a technique test.'
claims:
