id: teachable-sim-companion
type: opportunity
name: Teachable sim companion
summary: A co-player agent that learns factory, colony, or farm routines from demonstration and language,
  and grows a library of reusable skills the player can inspect.
opportunity_type: new-mechanic
thesis: 'Generalist game agents (SIMA, SIMA 2) follow language instructions across 3D games, and Voyager
  showed skill libraries of reusable code that grow over play. Automation games already reward teaching:
  Autonauts made programming bots by demonstration the core loop. A companion that learns skills from
  the player and stores them as inspectable, shareable routines turns automation from wiring to mentoring.'
design_sketch: The player demonstrates 'set up a smelting column' once while narrating; the companion
  abstracts it into a named skill with parameters, shows the generated plan, and reuses it elsewhere.
  Skills can be edited, combined, and shared. The companion asks clarifying questions when a skill fails.
involves:
- delegation-to-ai
- blueprints
- player-programming
- natural-language-interaction
applies:
- generalist-game-agents
- voyager-skill-libraries
- on-device-language-models
precedent:
- autonauts
- factorio
- minecraft
- satisfactory
- black-and-white
novelty: 3
feasibility: 3
impact: 3
horizon: 1-2y
key_risks:
- Agents that play the game for you can remove the core pleasure.
- Skill abstraction from one demonstration often over- or under-generalizes.
- Runtime cost of a capable agent on consumer hardware.
validation_experiment: 'In a voxel automation prototype, have players teach five routines by demonstration
  and narration; measure how often the learned skill succeeds in a new location and whether players report
  more or less enjoyment than blueprints. Success: 70 percent transfer success and preference over blueprints
  for at least half of players.'
falsifiable_signal:
  prediction: An automation or sandbox game will ship an in-game companion that learns reusable skills
    from player demonstration or instruction.
  resolve_by: '2028-12-31'
  criteria: 'Feature first shipped after 2026-10-24 in a title with at least 1,000 Steam user reviews;
    store page or developer documentation describes companion skills learned from the player that persist
    and can be reused on new tasks. Technique class: any method counts, classical programming by demonstration
    included, so this is a feature test.'
claims:
- text: Autonauts teaches its bots tasks by having them repeat the player's actions, stored as visual
    programs, a shipped form of skills learned from demonstration.
