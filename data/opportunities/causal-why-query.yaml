novelty: 4
feasibility: 4
impact: 5
horizon: 1-2y
key_risks:
- Ungrounded but fluent answers teach players wrong models of the system.
- Event logs in shipped engines often lack cause links; instrumenting them is real work.
- Explanations can make optimal play too easy, flattening difficulty.
- Feasibility 4 rates shipping the query box on a cause-linked log. The techniques it applies are a prototype
  and a research result in games, and answering at the validation experiment's 95 percent supported-sentence
  bar is an open problem; the score assumes that bar can be met.
validation_experiment: 'Instrument an open-source simulation (a city or colony sim) to log events with
  parent-cause ids. Give two player groups the same failing save; one gets the why-query. Measure time
  to correct diagnosis and the share of answer sentences whose cited events actually support them (human
  audit). Success: 40 percent faster diagnosis with at least 95 percent supported sentences.'
falsifiable_signal:
  prediction: A widely played simulation or strategy game will let players ask in natural language why
    something happened in their own game and answer from game state.
  resolve_by: '2027-12-31'
  criteria: 'Feature first shipped after 2026-10-24 in a title with at least 10,000 Steam user reviews;
    release notes or the store page describe free-text causal questions answered from the player''s own
    save state, not from a wiki or general help text. Technique class: any method that answers free text
    from save state counts, so this is a feature test; it shows language-model explanation landed only
    if the notes say a language model writes the answers.'
