id: causal-why-query
type: opportunity
name: Why-query over the simulation log
summary: Let players ask why something happened and answer from the simulation's own event log, making
  deep systemic games legible without simplifying them.
opportunity_type: legibility-layer
thesis: 'The strongest constraint on simulation depth has been legibility: players abandon systems they
  cannot diagnose, so designers cap coupling. Overlays and causal tooltips help with current values but
  not with histories (''why did the hospital close?''). If the simulation records an event log with causes,
  a language model can retrieve the relevant chain and narrate it with citations to specific events, and
  a constrained output format can force every claim to point at a logged record. This turns the event
  log, which many engines already keep for replays and debugging, into a player-facing explanation layer.
  It needs only a log of the game''s own events with parent causes, plus the player''s save; it does not
  wait for the event-sourced runtime with model-call logging proposed separately.'
design_sketch: A query box and a right-click 'why?' on any entity. The answer is three to six sentences,
  each linked to log events the player can jump to on the timeline, plus a small causal graph. Answers
  that cannot be grounded say so. Advisors use the same pipeline proactively when a key indicator crosses
  a threshold.
involves:
- causal-tooltips
- agent-inspection
- advisors
- history-chronicle
- stats-dashboards
- alerts-feed
applies:
- llm-explanation-of-state
- constrained-decoding
precedent:
