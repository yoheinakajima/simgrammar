id: generated-recipe-graphs
type: opportunity
name: Generated recipe graphs
summary: Generate solvable, non-degenerate, on-theme production recipe graphs and tech trees, verified
  by agents, to cut content cost for factory and crafting games.
opportunity_type: authoring-tool
thesis: 'Recipe graphs and tech trees are among the most prevalent content structures in the catalog,
  and their design is slow: each new item must be reachable, useful, and not dominated. Automated rule
  generation and quality-diversity search can propose graph variants, and agent playtests can check reachability,
  ratio complexity, and whether alternate recipes create real choices. Modding communities could use the
  same tool for overhaul mods.'
design_sketch: Designers set a theme, resource set, and target depth; the tool proposes recipe graphs
  with cycle times and alternates, simulates optimal and novice factories, and returns an archive ranked
  by depth, branching, and degeneracy checks. Designers edit and lock items they like.
involves:
- production-chain
- tech-tree
- hand-crafting
- milestone-unlocks
applies:
- automated-rule-generation
- quality-diversity-search
- automated-playtesting
- alphaevolve-algorithm-discovery
precedent:
- factorio
- satisfactory
- dyson-sphere-program
- minecraft
- infinite-craft
novelty: 3
feasibility: 4
impact: 2
horizon: 1-2y
key_risks:
- Generated graphs feel arbitrary without thematic logic.
- Agents optimize for metrics that miss what makes a recipe satisfying.
validation_experiment: 'Generate 100 recipe graphs for a fixed resource set and have experienced factory
  players rate a sample against an authored graph blind. Success: top-decile generated graphs rated equal
  to the authored one.'
falsifiable_signal:
  prediction: A factory or crafting game or overhaul mod will credit algorithmic or model-based generation
    for its recipe graph or tech tree.
  resolve_by: '2028-12-31'
  criteria: 'Released after 2026-10-24; a game with at least 1,000 Steam user reviews, or a mod with at
    least 10,000 downloads on its official mod portal; the developer or mod author states that the shipped
    recipe graph was produced or substantially shaped by a generative tool. Technique class: any generative
    tool counts, classical procedural generators and search included, so this is a feature test.'
claims:
- text: exfret's randomizer, a Factorio mod, regenerates recipe ingredients and technology prerequisites
    at game start.
  sources:
  - src-exfret-2022-factorio-randomizer
  confidence: high
  quote: This mod randomizes various game properties on game startup, like recipe ingredients, technology
    prerequisites, inserter speeds, module slots, and even what ores you mine from the ground.
  locator: Introduction
- text: The randomizer is tuned so the generated game stays completable, a solvability check without agent
    playtests.
  sources:
  - src-exfret-2022-factorio-randomizer
  confidence: high
  quote: Every property has been tested and fine-tuned so that the game is still completable and interesting.
  locator: This mod features..., Balanced randomization
- text: Infinite Craft's new elements, and so its recipe graph, are generated by language models.
  sources:
  - src-wikipedia-infinite-craft
  confidence: medium
  quote: The game uses Llama 2 and Mistral AI, a large language model, to create new elements and assign
    emojis.
  locator: Gameplay
