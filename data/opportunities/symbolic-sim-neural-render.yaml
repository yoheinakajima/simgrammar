novelty: 3
feasibility: 2
impact: 4
horizon: 3-5y
key_risks:
- Rendered frames that misrepresent symbolic state confuse players (a building that looks like a hospital
  but is not).
- Inference cost per frame on consumer GPUs.
- Temporal flicker and style drift across sessions.
validation_experiment: 'Condition an open video or image model on a 32x32 symbolic city grid and measure
  per-tile semantic fidelity (does a rendered tile read as its type to human raters) and frame time. Success:
  over 95 percent rater agreement with the symbolic type at 10 frames per second on a current consumer
  GPU.'
falsifiable_signal:
  prediction: A game will render its primary view with a generative model conditioned on an explicit symbolic
    game state.
  resolve_by: '2029-12-31'
  criteria: 'Title released after 2026-10-24 with at least 1,000 Steam user reviews or a console release;
    developer documentation shows that gameplay state is symbolic and that the main viewport is produced
    frame by frame by a learned generative renderer. Technique class: learned generative renderers only,
    so this is a technique test.'
claims:
- text: DLSS 5 renders each output frame with a generative model, one frame in and one frame out.
  sources:
  - src-nvidia-2026-dlss-5
  confidence: high
  quote: Unlike video generation models that operate on batch frame sequences, DLSS 5 operates on a strict
    one-frame-in, one-frame-out model.
  locator: DLSS 5 Introduces 3D-Guided Neural Rendering (temporal stability paragraph)
- text: DLSS 5 conditions on the engine's rendered colour and motion vectors, not on symbolic game state,
    so it still needs a conventional renderer and art.
  sources:
  - src-nvidia-2026-dlss-5
  confidence: high
  quote: DLSS 5 takes a frame's color and motion vectors as input to deliver lifelike lighting and materials
    that are deterministic, temporally stable and anchored to the game's content
  locator: DLSS 5 Introduces 3D-Guided Neural Rendering
- text: The Oasis 2.0 mod transforms Minecraft's view in real time over the game's own symbolic world,
