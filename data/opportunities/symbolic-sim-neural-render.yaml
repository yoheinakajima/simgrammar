id: symbolic-sim-neural-render
type: opportunity
name: Symbolic simulation, neural rendering
summary: Keep gameplay in a small deterministic symbolic simulation and let a generative world model render
  it, decoupling visual variety from simulation cost and art budgets.
opportunity_type: infrastructure
thesis: 'Generative world models (GameNGen, Genie 3, Muse, Oasis) produce convincing interactive frames
  but drift, forget, and cannot be trusted as game state. Simulation games need the opposite: exact, persistent,
  inspectable state. Splitting the stack resolves the conflict: the authoritative simulation stays symbolic
  (grids, agents, stocks), and a conditioned generative model renders it, so visual variety becomes nearly
  free while rules, saves, replays, and multiplayer sync remain deterministic.'
design_sketch: A city builder whose simulation is a tile grid of typed buildings, agents, and fields.
  A renderer conditioned on the grid, time of day, and a style prompt produces the view; players restyle
  their city as medieval, solarpunk, or watercolor without new art. Inspection tools always read the symbolic
  state.
