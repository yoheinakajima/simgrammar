id: generated-inspection-shifts
type: opportunity
name: Generated inspection shifts
summary: Rule-checking job sims with generated documents, items, and rule changes each shift, verified
  against an answer key so infinite variety stays fair.
opportunity_type: mechanic-upgrade
thesis: Papers, Please and its successors are limited by hand-built document sets that players memorize.
  Constrained generation can produce documents, forgeries, and edge cases from a formal rule set, and
  because the rules are formal, every generated case has a computable correct answer. That combination
  gives endless fair variety, which ordinary procedural generation struggles to make interesting and unconstrained
  generation cannot make fair.
design_sketch: Each day introduces rule changes written as formal predicates and rendered as in-world
  memos. Applicants, documents, and stories are generated to exercise boundary cases of the current rules.
  The game knows the correct ruling for every case and scores accordingly.
involves:
- rule-checking-inspection
- contracts-orders
- dilemma-cards
- procedural-characters
applies:
- constrained-decoding
- llm-game-master
- automated-rule-generation
precedent:
- papers-please
- contraband-police
novelty: 2
feasibility: 5
impact: 2
horizon: now
key_risks:
- Generated text leaks the answer or contradicts the formal case.
- Repetitive tone across generated applicants.
validation_experiment: 'Generate 1,000 inspection cases from a 30-predicate rule set and have a checker
  and two humans verify the answer key on a sample of 200. Success: 99 percent agreement between generated
  answers and human rulings.'
falsifiable_signal:
  prediction: An inspection or bureaucracy job sim will generate documents or applicants at runtime and
    score the player against an answer key derived from formal rules.
  resolve_by: '2027-12-31'
  criteria: 'Released after 2026-10-24 with at least 1,000 Steam user reviews; store page or developer
    statement describes runtime-generated cases whose correct outcome is computed from the game''s rules,
    not authored per case. Technique class: classical procedural generation checked by a rule engine counts,
    so this is a feature test.'
