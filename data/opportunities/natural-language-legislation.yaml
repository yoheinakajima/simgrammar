novelty: 3
feasibility: 3
impact: 3
horizon: 1-2y
key_risks:
- Players write laws the simulation cannot represent; the unmapped remainder must be visible.
- Group rhetoric can diverge from the computed welfare that actually drives votes.
- Politically sensitive content needs moderation.
validation_experiment: 'Build a policy compiler over a 40-parameter city model. Collect 300 player-written
  laws, have the compiler map them, and have two humans judge mapping fidelity. Success: 85 percent of
  laws mapped faithfully or with clearly flagged gaps, and playtesters prefer authoring to menus in a
  within-subjects test.'
falsifiable_signal:
  prediction: A political or city-building game will let players enact free-text laws that change simulation
    parameters.
  resolve_by: '2028-12-31'
  criteria: 'Feature first shipped after 2026-10-24 (early access counts) in a title with at least 1,000
    Steam user reviews; documentation shows free-text law input mapped to changes in simulation rules
    or parameters. Technique class: any parser counts, a keyword or grammar-based one included, so this
    is a feature test; it shows language models landed only if the documentation says one maps the laws.'
claims:
- text: EQUILIBRIUM (Steam early access, 2026) analyzes a law typed in plain language and turns it into
    a structured government dossier.
  sources:
