  confidence: high
  quote: When a player types a directive or law in natural language (e.g., "Abolish the luxury car tax"),
    the AI Engine analyzes the request in real time and generates a structured governmental dossier
  locator: AI Generated Content Disclosure
- text: EQUILIBRIUM confines the model's output to developer-defined fields and clamps its numeric effects
    in the simulation engine, the typed compilation this opportunity proposes.
