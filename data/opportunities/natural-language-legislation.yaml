id: natural-language-legislation
type: opportunity
name: Natural-language legislation
summary: Players write laws in plain language that are compiled into typed policy parameters, while simulated
  interest groups argue, lobby, and comply.
opportunity_type: new-mechanic
thesis: 'Policy mechanics have been menus: a fixed list of toggles chosen by designers. Constrained decoding
  can compile free-text proposals into a typed policy object over the simulation''s actual parameters,
  and language-model interest groups can respond in character with positions grounded in how the policy
  affects their simulated welfare. Player-written law moves governance games from choosing among authored
  options toward authoring rules, which A Tale in the Desert and Eco explored with players as legislators
  and humans as the parsers.'
design_sketch: The player drafts 'Ban coal plants within 2 km of housing; subsidize heat pumps by 30 percent.'
  The compiler returns a structured policy card listing the parameters it maps to and anything it could
  not map. Interest groups (miners, residents, industrialists) post positions computed from projected
  welfare changes and voiced by a model. Votes and compliance follow simulation state, not rhetoric.
