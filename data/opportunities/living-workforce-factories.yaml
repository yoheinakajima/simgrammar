  confidence: high
  quote: Follow your citizens from childhood to the end of their lives, providing them with essential
    goods such as food and clothes (and alcohol) while simultaneously ensuring they have access to opportunities
    in the form of education and employment.
  locator: About This Game
- text: In Workers & Resources schooling opens jobs and unlocks production capabilities, so the production
    network depends on a renewed, educated workforce.
  sources:
