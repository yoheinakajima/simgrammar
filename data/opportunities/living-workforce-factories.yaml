id: living-workforce-factories
type: opportunity
name: Factories with a living workforce
summary: Automation games whose workers age, learn, form families, and retire, so a production network
  is also a society that must be sustained across generations.
opportunity_type: new-genre
thesis: 'Production chains and agent lifecycles are both common yet share only two catalog games, the
  colony builders Dwarf Fortress and Timberborn: factory games are run by machines or faceless
  workers, and most games with aging, family-forming agents have no deep production. A factory
  whose throughput depends on a workforce with skills, schooling, households, and turnover couples
  production chains, among the ten most widely used mechanics in the catalog, to the systems that
  generate the most attachment. Salience-gated language agents make that workforce individually
  legible without per-tick cost.'
design_sketch: Machines need operators with trained skills; skilled workers age and retire; children of
  workers attend schools the player builds; housing, food, and morale affect shift output. A bottleneck
  can be a missing machine or a missing mentor. Generational play replaces the usual tech-tree endgame
  with succession planning for the workforce.
involves:
- production-chain
- lifecycle-aging
- agent-skills
- education-workforce
- needs-decay
- romance-family
applies:
- generative-agents
- on-device-language-models
- massively-parallel-simulation
precedent:
- captain-of-industry
- workers-and-resources
- oxygen-not-included
- dwarf-fortress
- banished
novelty: 3
feasibility: 4
impact: 3
horizon: now
key_risks:
- Workforce management can bury the logistics puzzle players came for.
- Agent counts at factory scale strain compute.
- Two audiences (automation and life-sim) may each find half the game unwanted.
validation_experiment: 'Prototype a small automation map where each machine needs a skilled operator drawn
  from a simulated population with aging and schooling; compare session length and self-reported attachment
  with a machines-only control. Success: longer sessions and higher attachment without lower throughput-puzzle
  ratings.'
falsifiable_signal:
  prediction: A factory or automation game in which workers age, train, and are replaced by a simulated
    next generation will reach 1,000 Steam user reviews.
  resolve_by: '2029-12-31'
  criteria: Title released after 2026-10-24; its Steam page describes generational workforce mechanics
    (aging, training, succession) in a factory or automation game, and it has at least 1,000 Steam user
    reviews by the resolve date.
