novelty: 3
feasibility: 4
impact: 3
horizon: now
key_risks:
- Workforce management can bury the logistics puzzle players came for.
- Agent counts at factory scale strain compute.
- Two audiences (automation and life-sim) may each find half the game unwanted.
validation_experiment: 'Prototype a small automation map where each machine needs a skilled operator drawn
  from a simulated population with aging and schooling; compare session length and self-reported attachment
  with a machines-only control. Success: longer sessions and higher attachment without lower throughput-puzzle
  ratings.'
falsifiable_signal:
  prediction: A factory or automation game in which workers age, train, and are replaced by a simulated
    next generation will reach 1,000 Steam user reviews.
  resolve_by: '2029-12-31'
  criteria: 'Title released after 2026-10-24; its Steam page describes generational workforce mechanics
    (aging, training, succession) in a factory or automation game, and it has at least 1,000 Steam user
    reviews by the resolve date. Technique class: any method counts, conventional agent simulation included,
    so this is a feature test.'
claims:
- text: Workers & Resources follows each citizen from childhood to death, with education and employment.
  sources:
