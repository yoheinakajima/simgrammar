id: living-workforce-factories
type: opportunity
name: Factories with a living workforce
summary: Automation games whose workers age, learn, form families, and retire, so a production network
  is also a society that must be sustained across generations.
opportunity_type: new-genre
thesis: 'Production chains and agent lifecycles are both common yet share only three catalog games,
  the colony sim Dwarf Fortress and the city builders Timberborn and Banished: factory games are run
  by machines or faceless workers, and most games with aging, family-forming agents have no deep
  production. A factory
  whose throughput depends on a workforce with skills, schooling, households, and turnover couples
  production chains, among the ten most widely used mechanics in the catalog, to the systems that
  generate the most attachment. Salience-gated language agents make that workforce individually
  legible without per-tick cost.'
design_sketch: Machines need operators with trained skills; skilled workers age and retire; children of
  workers attend schools the player builds; housing, food, and morale affect shift output. A bottleneck
  can be a missing machine or a missing mentor. Generational play replaces the usual tech-tree endgame
  with succession planning for the workforce.
