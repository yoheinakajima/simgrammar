- cities-skylines
- planet-coaster
novelty: 4
feasibility: 3
impact: 3
horizon: 3-5y
key_risks:
- Players notice when sampled individuals behave inconsistently with fields.
- Equilibrium solvers can be slow to converge under rapid change.
- Engineering cost to retrofit existing engines.
validation_experiment: 'Implement a mean-field traffic solver on a 100,000-trip city network and compare
  travel-time distributions with a full agent-based baseline. Success: within 10 percent on mean and 90th
  percentile travel times at a tenth of the compute.'
falsifiable_signal:
  prediction: A city builder will document a mean-field or continuum crowd model as its primary traffic
    or population simulation.
  resolve_by: '2029-12-31'
  criteria: 'Released or patched after 2026-10-24 in a title with at least 1,000 Steam user reviews; developer
    documentation names a mean-field, continuum, or equilibrium-field method used at runtime for the main
    traffic or population model. Technique class: classical continuum and equilibrium-field crowd models
    count, not only learned mean-field solvers, so this is a feature test.'
