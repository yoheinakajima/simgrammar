id: mean-field-crowds
type: opportunity
name: Mean-field crowds and traffic
summary: Simulate hundreds of thousands of agents with equilibrium-consistent route and choice behavior
  by combining mean-field approximations with sampled individuals.
opportunity_type: infrastructure
thesis: City builders face a ceiling where individually simulated agents cap population and aggregate
  models feel lifeless. Mean-field game theory describes how large populations of optimizing agents reach
  equilibrium, and GPU-parallel simulation makes iterating those fields cheap. A hybrid where the mean
  field sets congestion and choice probabilities and a sample of visible individuals follows them gives
  large populations that behave coherently.
design_sketch: Traffic and pedestrian flows are fields updated each tick from a mean-field equilibrium
  solver on the GPU; visible cars and citizens are samples drawn from those fields, so congestion is consistent
  at scale while inspection still shows individuals with plausible trips.
involves:
- traffic-congestion
- agent-pathfinding
- crowd-preferences
- public-transit
- service-queues
applies:
- mean-field-games
- massively-parallel-simulation
precedent:
