id: neural-npc-motion
type: opportunity
name: Learned motion for simulated crowds
summary: Physics-based learned character controllers let simulated agents move and react physically, so
  crowds, injuries, and labor look like what the simulation says is happening.
opportunity_type: mechanic-upgrade
thesis: Simulation games describe rich internal states (injured, exhausted, carrying heavy loads) but
  show them with a handful of canned animations, which undermines legibility and attachment. Learned physics-based
  controllers can produce motion conditioned on state at scale, so an agent with a leg wound limps believably
  and a tired hauler slows and stumbles.
design_sketch: Agent animation is driven by a learned controller conditioned on body-model state, load,
  and mood. The inspector shows the same state the motion expresses. Crowds use cheaper approximations
  at distance.
