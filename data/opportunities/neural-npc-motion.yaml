novelty: 3
feasibility: 3
impact: 2
horizon: 1-2y
key_risks:
- Runtime cost at crowd scale.
- Uncanny motion worse than stylized animation.
- Physics instability in edge cases.
validation_experiment: 'Drive 200 agents with a learned controller conditioned on three state variables;
  measure frame cost and whether observers can identify agent state from motion alone. Success: 80 percent
  identification at under 2 ms per frame.'
falsifiable_signal:
  prediction: A management or colony sim will ship learned physics-based motion for its simulated population.
  resolve_by: '2029-06-30'
  criteria: 'Feature first shipped after 2026-10-24 in a title with at least 1,000 Steam user reviews;
    developer documentation names learned motion control (a trained policy driving a physics character)
    for population agents, not only motion-matched animation. Technique class: trained control policies
    only, so this is a technique test.'
