id: llm-society-terrarium
type: opportunity
name: Language-agent society terrarium
summary: An observer-gardener genre where players seed and nudge a persistent society of language-model
  agents and watch institutions, cultures, and histories form.
opportunity_type: new-genre
thesis: 'Generative Agents (2023) and Project Sid (2024) showed that populations of language-model agents
  produce recognizable social structure: parties, roles, rules, shared beliefs. These are research demos,
  not games, but the experience they produce resembles the Game of Life and Dwarf Fortress legends: watching
  a world write its own history. With cheaper inference and chronicle tooling, a terrarium genre becomes
  viable where the player sets initial conditions and intervenes sparingly, and the product is the history.'
design_sketch: 'The player picks a map, founding traits, and scarcity levels, then seeds 50 to 500 agents.
  Interventions are god-scale and rare: a drought, a prophet, a trade caravan. A chronicle tool summarizes
  eras, factions, and turning points; players share worlds and replay them from saved event logs.'
involves:
- persistent-world
- gossip-propagation
- history-chronicle
- player-organizations
- god-powers
- faction-diplomacy
applies:
- llm-agent-societies
- generative-agents
- on-device-language-models
precedent:
- project-sid
- generative-agents-smallville
- dwarf-fortress
- game-of-life
- black-and-white
novelty: 5
feasibility: 2
impact: 4
horizon: 3-5y
key_risks:
- Inference cost for hundreds of agents over long runs.
- Agent societies may converge to bland or repetitive behavior without engineered diversity.
- Emergent content safety in open-ended social simulation.
validation_experiment: 'Run 100 agents for 30 simulated days on a small local model with a chronicle summarizer;
  have readers rate 20 generated histories against Dwarf Fortress legends excerpts for interest and coherence.
  Success: comparable interest ratings at under 1 dollar of inference per simulated day.'
falsifiable_signal:
  prediction: A game whose core loop is observing and nudging a society of at least 50 language-model
    agents will reach 1,000 Steam user reviews.
  resolve_by: '2029-12-31'
  criteria: 'Title released after 2026-10-24; its Steam page or developer documentation confirms an LLM-driven
    agent society of at least 50 agents as the core loop, and it has at least 1,000 Steam user reviews
    by the resolve date. Technique class: language-model agents only, so this is a technique test.'
