id: learned-weather-layer
type: opportunity
name: Learned regional weather
summary: Use machine-learned weather emulators to give farming, flight, and city sims realistic, cheap,
  regionally coherent weather and climate variability.
opportunity_type: mechanic-upgrade
thesis: Game weather is a Markov chain of states or a replay of real forecasts. ML weather models from
  2023 to 2025 produce physically coherent global fields orders of magnitude cheaper than numerical prediction,
  and ensemble methods sample plausible variability. Distilled regional emulators can drive crop growth,
  fire risk, flooding, and flight conditions with correlated, believable weather, including climate-shift
  scenarios that sims could never author.
design_sketch: A farm sim ships a small emulator per biome that rolls forward daily fields (temperature,
  precipitation, wind) from a seed and a climate scenario. Crops, fire spread, and hydrology read those
  fields. Players can choose a historical climate or a warming scenario and see droughts and storms arise
  at realistic frequencies.
involves:
- weather
- seasons
- crop-cultivation
- fire-spread
- hydrology
- planetary-climate
applies:
- ml-weather-models
- graph-network-simulators
precedent:
- microsoft-flight-simulator-2020
- farming-simulator-25
- simearth
- timberborn
novelty: 3
feasibility: 4
impact: 3
horizon: 3-5y
key_risks:
- Global models are too large for clients; distillation to regional scale may lose coherence.
- Realistic weather can be less fun than authored seasons.
- Licensing of model weights and training data.
- Both techniques it applies are research results for games with a 3 to 5 year horizon and no game deployment,
  so the 2028 prediction tests an early arrival.
validation_experiment: 'Distill a public ML weather model''s outputs into a sub-100 MB regional emulator
  for one biome; compare statistics (drought frequency, storm clustering) against reanalysis data and
  run it inside a farming prototype at under 1 ms per in-game day. Success: matched variability statistics
  within 20 percent and no measurable frame cost.'
falsifiable_signal:
  prediction: A farming, flight, or city sim will ship weather generated by a learned emulator rather
    than scripted states or live forecast feeds.
  resolve_by: '2028-12-31'
  criteria: 'Feature first shipped after 2026-10-24 in a title with at least 1,000 Steam user reviews
    or a console release; documentation or a developer statement describes a machine-learned weather emulator
    running in the shipped game. Technique class: machine-learned emulators only, so this is a technique
    test.'
claims:
- text: ACE is a learned emulator of a global atmospheric model, research prior art for a weather layer
    distilled from a learned model.
  sources:
  - src-wattmeyer-2023-ace
  confidence: high
  quote: We present ACE (AI2 Climate Emulator), a 200M-parameter, autoregressive machine learning emulator
    of an existing comprehensive 100-km resolution global atmospheric model.
  locator: Abstract
sources:
- src-wattmeyer-2023-ace
