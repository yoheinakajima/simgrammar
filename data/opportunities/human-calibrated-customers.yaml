id: human-calibrated-customers
type: opportunity
name: Human-calibrated customers
summary: Replace hand-tuned customer and crowd preference curves with models that predict human choices,
  so tycoon markets respond like real populations.
opportunity_type: mechanic-upgrade
thesis: 'Customer behavior in management games is a set of hand-tuned curves: price tolerance, ride intensity
  preference, satisfaction decay. Research in 2024 and 2025 showed language-model agents and choice models
  trained on large behavioral datasets predicting individual human responses with useful accuracy. Using
  such models to generate preference distributions, offline, gives tycoon games demand that behaves like
  real segments and lets players learn transferable intuitions. The same machinery serves product and
  policy research outside games.'
design_sketch: Guest archetypes are generated offline from a human-behavior model conditioned on demographics;
  each archetype yields compact preference parameters the runtime uses. Players see segment-level reasoning
  ('families find this ride too intense for the price'). A sandbox mode lets designers test offerings
  against segments.
involves:
- customer-value-choice
- crowd-preferences
- product-development
- supply-demand-pricing
applies:
- human-behavior-simulation-models
- simulation-based-inference
precedent:
- rollercoaster-tycoon
- planet-coaster
- game-dev-tycoon
- big-ambitions
novelty: 4
feasibility: 3
impact: 3
horizon: 1-2y
key_risks:
- Models encode demographic stereotypes that are offensive or wrong.
- Calibration to real data may make the game less fun than hand-tuned curves.
- Claims of realism invite scrutiny the model cannot survive.
validation_experiment: 'Generate preference parameters for a theme-park prototype from a behavior model,
  then compare predicted segment choices with a small real survey (n>=300) on the same priced options.
  Success: rank correlation above 0.6 between predicted and surveyed choices, and playtesters rate guest
  behavior as more plausible than the hand-tuned baseline.'
falsifiable_signal:
  prediction: A management or tycoon game will state that its customer or citizen preferences come from
    a model of human behavior learned from data.
  resolve_by: '2028-12-31'
  criteria: 'Released or patched after 2026-10-24 in a title with at least 1,000 Steam user reviews; developer
    blog, talk, or store text attributes in-game demand or preference parameters to a behavioral, survey-fitted,
    or language model. Technique class: classical behavioral or survey-fitted models, such as discrete-choice
    models, count as well as language models, so this is a feature test.'
