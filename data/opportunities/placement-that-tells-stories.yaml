id: placement-that-tells-stories
type: opportunity
name: Placement that tells stories
summary: City builders where where and what the player builds triggers specific, state-aware story events
  about the inhabitants of those buildings.
opportunity_type: new-mechanic
thesis: 'Building placement and triggered event chains are both common but share only three catalog
  games, Surviving Mars, Frostpunk, and Frostpunk 2, and in all three the events concern the colony or
  the city as a whole rather than where any building stands. City builders tell almost no stories about what players
  build, and event-driven games rarely have spatial building. Events keyed to placement,
  adjacency, and the inhabitants affected (a tavern next to the temple, a mill that floods a
  farmer''s field) give layout a narrative consequence. Constrained generation can instantiate
  such events from templates at scale while keeping effects inside the rules.'
design_sketch: When the player places or removes a building, the event system evaluates templates against
  neighbors, inhabitants, and history; a few fire as short vignettes with choices whose effects are typed
  (happiness, faction, resource). The chronicle records them so a district accumulates a history.
involves:
- free-placement
- triggered-event-chains
- adjacency-scoring
- villager-requests
- history-chronicle
applies:
- llm-game-master
- constrained-decoding
precedent:
- frostpunk
- manor-lords
- islanders
- crusader-kings-3
novelty: 4
feasibility: 4
impact: 3
horizon: now
key_risks:
- Event frequency that interrupts building flow.
- Players gaming layout for favorable events.
- Generated vignettes repeat in tone.
validation_experiment: 'Add 50 placement-triggered event templates to a small city-builder prototype and
  measure whether players recall and describe their towns in narrative terms more often than a control.
  Success: a significant increase in narrative descriptions with no drop in building time.'
falsifiable_signal:
  prediction: A city builder will advertise placement-triggered narrative events tied to named inhabitants
    as a core feature.
  resolve_by: '2028-12-31'
  criteria: 'Title or expansion released after 2026-10-24 with at least 1,000 Steam user reviews; store
    page or developer material lists events triggered by player placement decisions that affect specific
    named inhabitants. Technique class: any event system counts, authored triggers included, so this is
    a feature test.'
