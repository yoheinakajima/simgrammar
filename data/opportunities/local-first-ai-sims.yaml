id: local-first-ai-sims
type: opportunity
name: Local-first AI simulation games
summary: Ship small language and generative models inside the game so AI features run offline with no
  per-hour inference bill, changing the economics of AI-native simulation.
opportunity_type: business-model
thesis: Cloud inference makes AI features a variable cost per player-hour, which conflicts with the one-time-purchase
  model of most simulation games and their very long play sessions. Small models running on consumer GPUs
  and NPUs reached usable quality for constrained tasks in 2025 (inZOI's on-device characters are an example).
  Local-first design bounds cost, works offline, protects privacy, and survives the vendor's model deprecations.
design_sketch: The game ships a quantized model for dialogue, event generation, and explanation, with
  a schema-constrained interface. Higher-quality cloud calls are optional and clearly metered. Mods can
  swap models.
involves:
- natural-language-interaction
- generative-content
- procedural-characters
applies:
- on-device-language-models
- constrained-decoding
precedent:
- inzoi
- whispers-from-the-star
- suck-up
novelty: 2
feasibility: 4
impact: 4
horizon: now
key_risks:
- Hardware minimums shrink the audience.
- Model quality gap versus cloud models.
- Download size and VRAM competition with rendering.
validation_experiment: 'Benchmark a 1 to 4 billion parameter quantized model on the median Steam hardware
  survey GPU for schema-constrained NPC dialogue, measuring latency, VRAM, and frame-time impact. Success:
  under 500 ms first token with less than 10 percent frame-time impact.'
falsifiable_signal:
  prediction: At least five games with over 1,000 Steam user reviews will use an on-device language model
    at runtime without requiring an internet connection.
  resolve_by: '2027-12-31'
  criteria: 'Count titles whose local-model feature first shipped after 2026-10-24; store pages or documentation
    confirm local inference for runtime features, and each title has more than 1,000 Steam user reviews
    by the resolve date. Technique class: on-device language models only, so this is a technique test.'
