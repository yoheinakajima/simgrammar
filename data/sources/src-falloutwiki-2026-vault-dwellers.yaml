notes: Adult male and female dwellers in living quarters meet, talk, dance, and mate; related dwellers cannot mate
  except cousins, aunts and nephews, uncles and nieces; children become assignable adults three hours after birth;
  children have a 50% chance of inheriting either parent's highest SPECIAL stat, and maxed parents can produce
  higher-stat children; happiness rises with job fit and partners and falls with shortages, illness, and bodies
  left in the vault; survival mode forbids revival.
