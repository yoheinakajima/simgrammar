notes: 'Introduces the Curveball algorithm for randomizing presence-absence matrices without altering row and column
  totals, and reports that it samples the set of matrix configurations uniformly at far lower computational effort than
  earlier swap methods. The fixed-margin null of §5.3 uses its trade: two rows exchange a random part of the entries
  only one of them holds.'
