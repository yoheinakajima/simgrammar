notes: 'On p-values from randomly drawn permutations: counting the observed statistic among the draws gives (b + 1) /
  (m + 1), which cannot be zero, so with m draws the smallest attainable p-value is 1 / (m + 1). The paper prints a
  Monte Carlo p-value at that floor as an inequality.'
