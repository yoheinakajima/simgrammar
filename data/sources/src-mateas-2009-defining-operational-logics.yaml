notes: 'Read the full-text PDF (author order as printed there; the DiGRA record reverses it). Operational logics
  connect fundamental abstract operations, which determine the state evolution of a system, with how authors
  and players understand them; a logic is an authoring strategy, supported by abstract processes or lower-level
  logics, for the behaviors a system must show to be read as representing a domain. Discusses graphical and
  resource management logics.'
