notes: 'Read the DiGRA landing page and the full-text PDF. Introduces the Game Ontology Project, a hierarchy
  of game concepts abstracted from black-box analysis of many games with methods from prototype theory and
  grounded theory, grown middle-out. Top level: interface, rules, goals, entities, entity manipulation. Each
  entry has a name, a description, strong and weak example games, a parent, children, and part-of elements.
  Organizes design elements, not games, and gives no design advice.'
