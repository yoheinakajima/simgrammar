notes: Info box lists Android and iOS, developer and publisher Codebrew Games, released 2018-07-31, MSRP 4.99 USD.
  Zones are residential, commercial, and industrial; power plants and water towers sit on roads and a building
  within two tiles of a road gets power, water, and access, with no power lines, pipes, or elevation. Taxes trade
  revenue against emigration; disasters happen at random or on command; about a dozen resident quests; Expert
  difficulty needs bank loans; one campaign plus a sandbox.
