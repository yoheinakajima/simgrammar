accessed: '2026-10-31'
notes: 'Help page of clusterboot in fpc, by Christian Hennig. Resampling (bootstrap, subsetting, and others) compares each
  original cluster with its most similar resampled cluster by Jaccard similarity; the mean indexes the cluster''s stability
  (methods in Hennig 2007, Computational Statistics and Data Analysis 52). A stable cluster yields a mean of 0.75 or more;
  0.6 to 0.75 indicates patterns with doubtful members; below 0.6, not to be trusted; 0.85 and above, highly stable; 0.5 or
  less indicates a dissolved cluster. The page does not say whether a cluster is restricted to the subset''s points.'
