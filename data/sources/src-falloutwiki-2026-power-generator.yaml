notes: The Fallout Shelter power generator uses dwellers' Strength; three upgrade tiers; adjacent matching rooms
  of the same level merge with a production and upgrade cost bonus (single, double, triple); when power runs short,
  rooms stop working starting with those farthest from the power sources; the Nuclear Reactor unlocks at 60 dwellers.
