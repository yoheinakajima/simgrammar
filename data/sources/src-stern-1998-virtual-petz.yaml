notes: PF.Magic authors describe Virtual Petz as autonomous agents with real-time layered 3D animation and
  sound; primary motivation is attention and affection, neglected pets become lethargic and depressed and
  eventually run away; breed personalities (playful terriers, grumpy bulldogs, hyper Chihuahuas); users reward
  or discipline any behavior, discipline by water spray bottle, tricks trained by wiggling treats; hand-shaped
  cursor to touch, pet, and pick up; toys initiate play; pets grow up on the desktop.
