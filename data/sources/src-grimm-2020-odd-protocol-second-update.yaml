notes: 'Read the full text. "ODD consists of seven elements": purpose and patterns; entities, state variables
  and scales; process overview and scheduling; design concepts; initialization; input data; submodels. Element
  2 "lists the different types of entities represented in the model"; element 3 says when state variables are
  updated. Most elements apply to any simulation model, so ODD could provide "a lingua franca for simulation
  modelling".'
