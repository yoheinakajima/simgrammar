notes: 'Read the DiGRA landing page and the full-text PDF. Game design patterns describe recurring interaction
  relevant to gameplay, beside a structural framework of game components. A pattern has a name, a description,
  consequences, notes on using it, and relations to superior patterns, subpatterns, and potentially conflicting
  patterns; the collection forms a network with several base nodes. The authors report over 200 patterns identified.'
