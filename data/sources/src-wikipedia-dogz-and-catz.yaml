notes: Developed and published by PF.Magic for PC and Mac; Dogz 1995, Catz 1996; user adopts one of five
  animals after playing with each to sense its personality; mood and, over time, personality change with
  how the animal is treated; feeding, watering, toys, discipline; screensaver mode; reused Ballz rendering
  technology; about 200,000 copies of Dogz in its first year and more than 1.5 million units for the first
  games and sequels by early 1998.
