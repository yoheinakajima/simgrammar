notes: Earliest release listed is a Japanese DoCoMo phone version on 2008-11-04, then iOS 2010-10-09 (no Windows
  release listed). Contracts pay 100K to over 1,000K within about 6 to 13 weeks and cost the fee and reputation when
  failed; office upgrades unlock training, advertising, and hiring methods and two seats; advertising loses effect
  with repeated use; Gamedex each July; Global Game Awards each December, gated on review totals; fan letters shift
  popularity with age groups and genders.
