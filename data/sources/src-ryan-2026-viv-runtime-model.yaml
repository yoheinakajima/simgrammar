notes: Action targeting by role casting with backtracking over shuffled casting pools; knowledge manager
  forms memories for present characters with per-character salience and associations, relays knowledge
  of past actions cast in new actions or inscribed in items, and fades memories below a salience threshold;
  causal links recorded from action roles, reactions, knowledge relaying, inscription, and forced causes,
  with direct causes and transitive ancestors stored per action.
