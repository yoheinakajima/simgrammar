notes: 'Author''s PDF. PyVGDL describes a 2D arcade-style game by a sprite set, a level mapping, an interaction
  set (the effect when two sprite types collide) and a termination set, drawing on an ontology of building
  blocks; its library parses and instantly plays a description and gives learning and planning agents visual
  or abstract observations. The venue is from the py-vgdl README (github.com/schaul/py-vgdl).'
