notes: 'Publisher page with a long description; the book was not read. Group formation, cultural transmission,
  combat and trade "emerge" from "the interaction of individual agents following simple local rules" in
  Sugarscape, where agents with vision, metabolism and speed move over a landscape of sugar. The description
  then introduces seasons, sexual reproduction, tribes and combat, a second resource with trade (a market
  emerges), and pollution.'
