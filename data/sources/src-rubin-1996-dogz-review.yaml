notes: Review of the Mac release of the first Dogz, developed by PF.Magic and distributed by Virgin; five
  breeds to play with and adopt; ball, sneaker, food and water dishes, a spray water bottle, and three
  treats; the treats teach tricks (standing on one foot, somersaults, backflips, headstands), consistent
  feedback makes them reliable, and each treat can cue a different trick; Guard Dogz screen saver; ignored
  dogs look expectantly and fall asleep. Read as RTF from the archived disc through the operator's browser,
  since the site disallows automated fetchers.
