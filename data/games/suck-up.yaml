id: suck-up
type: game
name: Suck Up!
summary: A voice-controlled comedy game in which the player, as a disguised vampire, talks AI-driven townspeople
  into letting them inside, with each resident's replies generated by a language model from its personality and
  the player's words.
year: 2023
year_full_release: 2025
developer: Proxima Enterprises
platforms:
- pc
subgenre: ai-native
subgenre_secondary:
- social-sim
sim_domain:
- social-interpersonal
player_role: inhabitant
agency_model:
- conversational
- direct-avatar
time_model: real-time
sim_scale: individual
fidelity: stylized
perspective: third-person
win_structure: scenario-goals
failure_model: soft-recoverable
narrative_mode: generative
multiplayer:
- single
- async-shared
modding: content
production_tier: indie
agent_count_order: '10'
emergence: 2
influence: 1
boundary_case: true
core_loop: pick a disguise -> knock on a resident's door -> speak a pitch aloud -> the model replies in character
  and weighs trust -> get invited in and feed, or get refused -> next house
design_notes: 'At runtime a language model plays each resident: the player''s spoken words go to a hosted model
  (the Steam page lists ChatGPT from OpenAI; the December 2023 terms name GPT 3.5 and Llama 2 and meter use in tokens)
  along with the resident''s authored personality, and its reply decides whether the
  player has earned entry. The challenge is social engineering against characters whose personalities are meant to challenge
  players, so disguises (knight, superhero, a previous victim) work as context that changes the model''s judgment. Players
  author new residents'' personalities and whole neighborhoods and share them on Steam Workshop. It is a boundary
  case: the persuasion is judged by the model rather than by a simulated social state.'
mechanics:
- id: natural-language-interaction
  role: core
  note: The player talks to residents with a real microphone, and the store page says responses depend on tone and
    strategy.
- id: generative-content
  role: core
  note: A hosted language model (ChatGPT from OpenAI per the store page) generates each resident's reply and in-character
    decision in real time from its personality prompt and the conversation.
- id: personality-traits
  role: supporting
  note: Each resident has an authored personality and behaviors that condition the model, and players can write
    their own.
- id: content-sharing
  role: supporting
  note: Steam Workshop shares player-made characters and full neighborhoods.
- id: direct-avatar
  role: supporting
- id: scenario-objectives
  role: supporting
  note: Modes include Love Bites (split up couples at a Valentine's Day party) and Mic Drop (rap battles against
    characters).
claims:
- text: Suck Up! was publicly playable through Proxima's own launcher before its Steam 1.0 release on 2025-10-01;
    the site's terms, last updated 2023-12-05, already metered AI-model use in tokens, and the site calls the launcher
    build early access.
