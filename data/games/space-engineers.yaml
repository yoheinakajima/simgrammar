core_loop: mine ore from voxel asteroids and planets -> refine and assemble components -> weld blocks
  into ship or station grids -> power and pilot under inertia -> collide, fight, or deform -> repair and
  redesign
design_notes: Space Engineers treats a ship as a grid of blocks where each block has mass, inertia, and
  hit points, and functional blocks (thrusters per direction, gyroscopes, reactors, cockpits) decide whether
  it can move at all; there is no ship stat sheet apart from the blocks. Collisions and weapons deform
  or destroy individual blocks, and terrain is editable voxels, so construction, mining, and damage share
  one physical model. Survival mode adds a refine-assemble production chain and suit oxygen and energy,
  and an in-game programmable block lets players automate ships with scripts.
mechanics:
- id: modular-assembly
  role: core
  note: Ships and stations are small or large grids of armor and functional blocks; thrusters only push
    along their facing, so thrust coverage on each axis, gyroscope count, and power supply decide handling.
- id: rigid-body-physics
  role: core
  note: Volumetric physics gives every block mass and inertia; ships drift under Newtonian motion with
    optional inertia dampeners, and gravity generators and planets pull loose objects.
- id: voxel-destruction
  role: core
  note: Asteroid and planet voxels can be drilled and carved, and armor blocks deform or break block by
    block under collisions and weapon fire.
- id: resource-extraction
  role: supporting
  note: Hand drills and ship drills mine ore from voxel deposits.
- id: production-chain
  role: supporting
  note: Refineries turn ore into ingots and assemblers turn ingots into components for welding.
- id: conveyor-transport
  role: supporting
  note: Conveyor blocks connect inventories so refineries, assemblers, and cargo containers move items
    automatically, with sorters filtering flow.
- id: power-grid
  role: supporting
  note: Reactors, solar panels, batteries, and hydrogen engines feed every functional block on a grid;
    unpowered blocks stop.
- id: player-programming
  role: supporting
  note: The programmable block runs player-written C# scripts that read and command blocks on the grid.
- id: signal-circuits
  role: supporting
  note: Sensors, timer blocks, and event controllers trigger block actions without code.
- id: survival-meters
  role: supporting
  note: In survival the suit tracks health, energy, oxygen, and hydrogen.
- id: fluid-gas-simulation
  role: supporting
  note: Air vents pressurize sealed rooms with oxygen; breaches depressurize them.
- id: blueprints
  role: supporting
  note: Grids save as blueprints that a projector block displays for welding and that are shared on Steam
    Workshop.
- id: modding-api
  role: supporting
  note: A C# modding API, Workshop, and mod.io support custom blocks and logic.
- id: subsystem-damage
  role: supporting
  note: Each block has hit points, and damaged functional blocks such as thrusters, reactors, and gyroscopes
    stop working until welded back.
- id: content-sharing
  role: supporting
  note: Ships and stations are saved as blueprints and shared, and mods and blueprints are browsed and
    downloaded through the Steam Workshop.
