core_loop: play with the five breeds in the adoption area and adopt one -> pet, feed, and play with it
  using the hand cursor and toys -> reward behavior with treats or squirt it with the spray bottle ->
  it learns tricks and grows to full size -> keep it company or it howls for attention
design_notes: 'The record covers the series and is dated by its first game. Dogz (1995 for Windows, 1996
  for Mac) and Catz (1996) began it, and the mechanics tagged here are documented for that first game. In Dogz the player adopts one of five breed pups and keeps one dog at a time. The
  player acts only through a hand cursor that pets, feeds, calls, and offers toys from a toolbox, so every
  intervention is a stimulus the pet interprets. Treats reward and a water spray bottle punishes, and
  consistent feedback trains tricks that differ by breed. The dog gets hungry and howls when neglected
  but cannot starve or die, and it reaches full size after 15 days. PF.Magic''s 1997 and 1998 papers
  describe the later releases: several pets on one desktop that form friendships and feuds, individual
  likes, dislikes, and quirks, a toy shelf pets use on their own, and pets that run away after long neglect.
  Those features are not tagged on this 1995-dated record. The papers call the pets autonomous, socially
  intelligent agents. Andrew Stern, one of their authors, later co-created Facade.'
mechanics:
- id: creature-care
  role: core
  note: The player pets, feeds, waters, and plays with the dog through a hand cursor and a toolbox of
    toys; a neglected dog howls for attention.
- id: creature-learning
  role: core
  note: Treats are positive reinforcement and the spray bottle negative reinforcement, and consistent
    feedback teaches tricks such as somersaults, backflips, and headstands, cued by which treat is offered.
- id: personality-traits
  role: core
  note: Each of the five breeds has its own personality, which players test in the adoption area before
    choosing; later releases add individual likes, dislikes, and quirks.
- id: needs-decay
  role: supporting
  note: The dog gets hungry and wants attention, and food and water dishes empty as it uses them, though
    it cannot starve.
