type: game
name: EVE Online
aliases:
- Eve Online
- EVE
summary: A single-universe space MMO in which players mine, manufacture, trade, and fight in ships that
  are destroyed for good, inside a player-made economy and a galaxy of high-, low-, and null-security
  space where player alliances claim sovereignty.
year: 2003
developer: CCP Games
