id: frostpunk-2
type: game
name: Frostpunk 2
summary: The sequel to Frostpunk, in which the Steward builds whole districts on the frost and must pass
  laws through a council of 100 faction delegates while faction tension can escalate into civil war.
year: 2024
developer: 11 bit studios
platforms:
- pc
- console
subgenre: city-builder
subgenre_secondary:
- political-sim
- survival-sim
sim_domain:
- urban
- political-governance
- planetary-natural
player_role: ruler-statesman
agency_model:
- zoning-placement
- policy-parameter
time_model: real-time-pausable
sim_scale: city
fidelity: stylized
perspective: free-3d
win_structure: campaign
failure_model: hard-restart
narrative_mode: hybrid
multiplayer:
- single
modding: content
production_tier: aa
agent_count_order: aggregate
emergence: 3
influence: 1
core_loop: build food, housing, extraction, and industry districts -> heat districts from the generator
  -> factions propose ideas and laws -> negotiate council votes -> faction tension rises or falls -> survive
  whiteouts and found colonies
design_notes: 'Frostpunk 2 moves from single buildings to districts and from one leader''s decree to a
  council: 100 delegates, each tied to a faction, vote on every proposed law, with 51 votes for most laws
  and two thirds for laws that expand the Steward''s power. Negotiated promises that are not kept anger
  factions, and tension between factions can escalate into murder and civil war, so the developer describes
  social survival as more important than environmental threats. Population is handled as district-level
  aggregates rather than individual workers.'
mechanics:
- id: zoning
  role: core
  note: Districts for food, housing, extraction, and industry are placed on frost; buildings inside add
    functions.
- id: elections
  role: core
  note: A council of 100 faction delegates votes on each proposed law; 51 votes pass most laws, two thirds
    pass laws that grant the Steward more power.
- id: interest-groups
  role: core
  note: Factions with conflicting ideals react to adopted ideas and laws; radicals grow within factions.
- id: policy-toggles
  role: core
  note: Laws are proposed, negotiated with promises, and enacted when the council approves.
- id: stability-unrest
  role: supporting
  note: Faction tension can escalate into murder and civil war.
- id: tech-tree
  role: supporting
  note: An Idea Tree of faction-proposed ideas to solve problems.
- id: crisis-countdown
  role: supporting
  note: Whiteouts are severe storms prepared for with fuel reserves.
- id: resource-extraction
  role: supporting
  note: Food, coal, oil, and steam come from frostland deposits and districts.
- id: scenario-objectives
  role: supporting
  note: Utopia Builder mode sets an objective and optional challenges that fail the run if missed.
- id: variable-speed
  role: supporting
- id: free-placement
  role: supporting
- id: triggered-event-chains
  role: supporting
  note: Consequence Arcs open when the city meets a condition, such as the generator kept off while fuel is available
    or repeated failed promises to a hostile faction, and play out as follow-up events the Steward can complete.
influenced_by:
- frostpunk
