core_loop: dig and build rooms in the vault cross-section -> drag dwellers into rooms matching their SPECIAL
  stats -> rooms produce power, food, and water on timed cycles -> rush a cycle at the risk of an incident
  -> recruit, rescue, and breed dwellers -> population thresholds unlock rooms and stronger attackers
design_notes: 'Fallout Shelter is a side-on cross-section of an underground vault built downward from the door,
  with elevators linking floors. Each production room reads one SPECIAL stat (Strength for power), and dwellers
  with more of that stat finish its cycle faster; adjacent rooms of the same type and level merge up to three
  wide, which raises output and cuts the upgrade cost per room. Power is shed by distance: when supply falls short,
  rooms farthest from the power sources stop first. Rushing a room completes its cycle at once but can trigger an
  incident; incidents also fire from a background timer whose chance rises until one is guaranteed, spread only
  from empty rooms to neighbours without revisiting a room, and grow stronger with average dweller level, room
  level, and room width. Dweller happiness settles at 50 percent, or 75 percent in a room matching the dweller''s
  best stat, rises with successful rushes and breeding, and falls with injury, radiation, and bodies left in the
  vault. Wasteland exploration sends one dweller out alone for hours of real time to fight and collect caps, junk,
  weapons, and outfits, spending the stimpaks and RadAway they carry, until recalled, full, or dead (proposed as
  timed-expedition). When it loads, the game generates what happened while it was closed from the device clock
  and the last played time, but incidents only occur while it runs in the foreground.'
mechanics:
- id: goods-consumption
  role: core
  note: Dwellers draw down vault stocks of food and water; shortages injure and irradiate dwellers and lower their
    happiness.
- id: power-grid
  role: core
  note: Power generators staffed by high-Strength dwellers supply almost every room; when output falls short, rooms
    stop working starting with those farthest from the power sources.
- id: agent-skills
  role: core
  note: Each dweller has seven SPECIAL stats that training rooms raise one point at a time to 10; the matching stat
    sets production speed, and level-ups add health scaled by Endurance.
- id: romance-family
  role: core
  note: An adult man and woman placed in living quarters meet, talk, dance, and mate; related dwellers other than
    cousins, aunts, uncles, nephews, and nieces cannot mate.
- id: trait-inheritance
  role: supporting
  note: A child has a 50 percent chance of inheriting either parent's highest SPECIAL stat, and parents with maxed
    stats can produce children with far higher stat totals.
- id: lifecycle-aging
  role: supporting
  note: Pregnant dwellers give birth only when the vault has space, and children wander the vault for three hours
    before becoming assignable adults.
- id: unit-commands
  role: supporting
  note: The player drags individual dwellers into rooms, out to the wasteland, or into a room with an incident;
    dwellers do not choose their own jobs.
- id: free-placement
  role: supporting
  note: Rooms are dug into the rock on a grid next to existing rooms and elevators, and matching rooms placed side
    by side merge into double and triple rooms.
- id: vertical-layers
  role: supporting
  note: The vault is a stack of underground floors connected by elevator shafts, with the vault door at the top.
- id: milestone-unlocks
  role: supporting
  note: Room types unlock as the dweller population passes thresholds, such as the Nuclear Reactor at 60 dwellers.
- id: random-disasters
  role: supporting
  note: Fires, radroaches, mole rats, and radscorpions break out from a background timer or a failed rush and spread
    from empty rooms to adjacent ones.
- id: raid-defense
  role: supporting
  note: Raiders, feral ghouls, and deathclaws attack from outside through the vault door, and dwellers armed with
    scavenged weapons fight them in the rooms they reach.
- id: adaptive-threat-scaling
  role: supporting
  note: Incident and attack strength rises with the vault's average dweller level and with the level and width of
    the room under attack, and each attacker type appears only above a population threshold.
- id: hand-crafting
  role: supporting
  note: A 2016 update added workshop rooms that craft weapons and outfits from scavenged junk using found recipes.
- id: permadeath
  role: supporting
  note: In survival mode dead dwellers cannot be revived; in normal mode they can be revived for caps.
- id: real-time-clock
  role: supporting
  note: On load the game computes everything that happened since the last session from the device clock, so
    changing the device time breaks room timers.
