id: jurassic-world-evolution
type: game
name: Jurassic World Evolution
summary: A dinosaur park management game in which the player excavates fossils for DNA, breeds and modifies
  dinosaurs, and keeps them contained through storms, sabotage, and breakouts while balancing three division
  contracts.
year: 2018
developer: Frontier Developments
