id: railroad-tycoon
type: game
name: Railroad Tycoon
aliases:
- Sid Meier's Railroad Tycoon
summary: A railroad business sim in which the player lays track, builds stations, schedules trains to
  meet regional supply and demand, and battles rival barons through the stock market.
year: 1990
developer: MPS Labs (MicroProse)
platforms:
- pc
subgenre: transport-logistics
subgenre_secondary:
- business-economic-sim
sim_domain:
- industrial-logistics
- economic
player_role: manager-owner
agency_model:
- zoning-placement
- direct-unit
- policy-parameter
