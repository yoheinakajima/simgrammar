id: timberborn
type: game
name: Timberborn
summary: A city builder for beaver colonies in which simulated water flows over terrain, recurring droughts
  and toxic badtides cut or poison it, and players dam, channel, and store water while building upward.
year: 2021
year_full_release: 2026
