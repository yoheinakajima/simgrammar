core_loop: study Sauron's army on the Nemesis screen -> hunt a captain or warchief, exploiting its
  strengths and weaknesses -> kill, brand, or flee from it -> survivors and killers of Talion are promoted
  and remember the encounter -> turn branded captains against their warchiefs to take over the army
design_notes: 'A boundary case: the core loop is authored third-person combat and stealth, and the record
  is included for the Nemesis system. Sauron''s army is a ranked hierarchy of warchiefs and the captains
  under them, each a procedurally generated orc with a name, strengths, weaknesses, and personality.
  The hierarchy updates from the outcomes of the player''s encounters rather than from a script: an orc
  that survives a fight or kills Talion is promoted and gains power, and its later taunts refer back to
  the earlier encounter. Talion cannot die permanently, so each player death feeds the hierarchy instead
  of ending the run. Infighting between orcs can be triggered, and in the second half branded captains
  serve Talion, so the player reorganizes the same hierarchy from inside. No mechanic in the vocabulary
  owns a persistent, ranked roster of rivals whose standing changes with each encounter, so the run files
  a new-mechanic proposal rather than force-fitting career-ladder. Warner Bros. patented the system, and
  only the sequel, Shadow of War, has used it.'
