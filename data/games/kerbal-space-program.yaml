id: kerbal-space-program
type: game
name: Kerbal Space Program
aliases:
- KSP
summary: A space flight sim where the player assembles rockets from parts and flies them under patched-conic
  orbital physics and atmospheric aerodynamics through a scaled-down planetary system.
year: 2011
year_full_release: 2015
developer: Squad
