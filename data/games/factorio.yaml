core_loop: mine ore -> smelt and assemble on belts and inserters -> feed science packs to labs -> research
  new machines -> pollution draws biter attacks -> defend and expand outposts by rail -> launch a rocket
design_notes: 'Lead designer Michal Kovarik cited the Minecraft tech mods IndustrialCraft and BuildCraft;
  Factorio turned their pipes and machines into a standalone game where ratio planning and layout are
  the challenge. Item movement is discrete and deterministic (belts carry 15, 30, 45, or 60 items per
  second across two lanes), which makes throughput legible and lets the lockstep multiplayer simulate
  identical worlds. Pollution couples industry to combat: chunks above 15 units diffuse 2% to neighbors,
  spawners that absorb it send attack groups, and total pollution produced drives the enemy evolution
  factor. Each layer of logistics (belts, trains with block signals, roboport-based logistic and construction
  robots, circuit combinators) is a mechanic the player adopts when the previous one stops scaling, and
  blueprints let solved layouts be reused. Speed, productivity, and efficiency modules and beacons that
  trade power for throughput, and the rocket silo as a terminal sink for produced parts, have no taxonomy
  entry; this run proposed both.'
mechanics:
- id: production-chain
  role: core
  note: Assembling machines, furnaces, chemical plants, and refineries run fixed recipes with crafting
    times; science packs require multi-step trees from ore to circuits, oil products, and rocket parts.
- id: conveyor-transport
  role: core
  note: Two-lane belts in four tiers carry 15, 30, 45, or 60 items per second; splitters, undergrounds,
    and lane priorities shape flow, and inserters move items between belts and machines.
- id: tech-tree
  role: core
  note: Labs consume science packs of rising recipe complexity to research a technology graph that leads
    through oil processing, robots, and nuclear power to the rocket silo.
- id: resource-extraction
  role: core
  note: Electric and burner mining drills extract iron, copper, coal, stone, and uranium from ore patches
    at rates set by drill tier and mining productivity research; pumpjacks extract crude oil.
- id: pollution-spread
  role: core
  note: Machines emit pollution into 32x32 chunks; above 15 units a chunk diffuses 2% to each cardinal
    neighbor every 64 ticks, and water, grass, and trees absorb it.
- id: raid-defense
  role: core
  note: Biter and spitter nests send attack groups when their chunk absorbs pollution, recruiting units
    at pollution costs from 4 for a small biter to 400 for a behemoth; turrets, walls, and flamethrowers
    defend.
- id: adaptive-threat-scaling
  role: core
  note: An evolution factor rises with elapsed time, total pollution produced, and spawners destroyed,
    squashed as total over one plus total, and unlocks medium, big, and behemoth enemies.
- id: power-grid
  role: core
  note: Steam engines, solar panels, accumulators, and nuclear reactors feed a pole-connected grid; under
    shortage power is shared evenly so all machines slow proportionally.
- id: blueprints
  role: supporting
  note: Selected areas save to blueprints, books, and a personal library that persists across saves; exchange
    strings are shared online, and construction robots build pasted ghosts.
- id: rail-signaling
  role: supporting
  note: Rail and chain signals divide track into blocks that one train reserves at a time, letting train
    networks share track.
- id: vehicle-route-scheduling
  role: supporting
  note: Trains run schedules of stations with wait conditions on cargo, time, inactivity, or circuit signals.
- id: signal-circuits
  role: supporting
  note: Red and green wires carry item-count signals into arithmetic, decider, constant, and (in 2.0)
    selector combinators that control inserters, belts, train stops, and lamps.
- id: fluid-pipe-network
  role: supporting
  note: Pipes and pumps carry water, crude oil, petroleum, and steam; version 2.0 merged pipes into segments
    that share contents.
- id: deposit-depletion
  role: supporting
  note: Ore tiles run out as they are mined, and crude oil wells decline toward a 20% yield floor, pushing
    expansion to new patches.
- id: storage-capacity
  role: supporting
  note: Chests, storage tanks, and the logistic network's storage chests buffer items, and full outputs
    stall machines upstream.
- id: hand-crafting
  role: supporting
  note: The engineer crafts early buildings and items from inventory using the same recipes as assemblers,
    with a crafting queue.
- id: quality-tiers
  role: supporting
  note: The Space Age expansion adds five quality levels from normal to legendary, raised by chance from
    quality modules, with a recycler that returns 25% of ingredients.
- id: spoilage
  role: supporting
  note: In Space Age, Gleba's agricultural products spoil over fixed timers into spoilage, and recipe
    outputs inherit ingredient freshness.
- id: modding-api
  role: supporting
  note: Mods use a modified Lua 5.2 with data and control stages and are distributed through an in-game
    mod portal; overhauls such as Krastorio 2 replace progression.
- id: stats-dashboards
  role: supporting
  note: Production and consumption graphs per item over time windows and an electric network panel show
    where ratios fail.
- id: procedural-terrain
  role: supporting
  note: Maps are generated from a seed with settings for ore frequency, size, and richness, water, cliffs,
    and enemy bases.
- id: vertical-layers
  role: supporting
  note: Space Age elevated rails let a second track layer cross over ground tracks and buildings.
- id: direct-avatar
  role: supporting
  note: The engineer walks the map, mines by hand early, and places buildings within reach, later driving
    cars, tanks, and spidertrons.
- id: megaproject-sink
  role: supporting
  note: The rocket silo consumes rocket parts for each launch, and launching a rocket ends the base game;
    Space Age moves the goal to a space platform reaching the edge of the solar system.
- id: machine-boosting
  role: supporting
  note: Speed, productivity, efficiency, and (Space Age) quality modules fill machine slots, and beacons
    project module effects onto neighboring machines at a power cost; productivity bonuses are capped
    at +300%.
- id: request-provider-logistics
  role: supporting
  note: Roboports define logistic zones where logistic robots carry items among active provider, passive
    provider, storage, buffer, and requester chests by priority, one item per trip at 3 tiles per second
    before research.
- id: track-laying
  role: supporting
  note: Straight and curved rail pieces are placed to build train networks, with elevated rails in Space
    Age, and the rail planner lays segments between points.
- id: free-placement
  role: supporting
- id: scenario-objectives
  role: supporting
  note: 'Besides the freeplay sandbox, scenarios set goals and limits: Wave defense is won by launching a
    satellite on wave 20, and the Tight spot missions give little space, limited resources, and a fixed amount
    of time.'
