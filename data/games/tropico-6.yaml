id: tropico-6
type: game
name: Tropico 6
summary: A political city builder in which El Presidente develops an island archipelago across four eras
  while individually simulated citizens' happiness and faction loyalties decide elections, protests, and
  revolts.
year: 2019
developer: Limbic Entertainment
platforms:
- pc
- console
- handheld
subgenre: city-builder
subgenre_secondary:
- political-sim
sim_domain:
- urban
- political-governance
- economic
player_role: ruler-statesman
agency_model:
- zoning-placement
- policy-parameter
time_model: real-time-pausable
sim_scale: nation
fidelity: stylized
perspective: free-3d
win_structure: scenario-goals
failure_model: hard-restart
narrative_mode: hybrid
multiplayer:
- single
- coop
- competitive
modding: none
production_tier: aa
agent_count_order: 1k
emergence: 3
influence: 1
core_loop: build housing, jobs, and services across the islands -> each citizen's happiness and faction
  alignment shift with conditions -> issue edicts, trade, and raid to fund the treasury -> advance through
  four eras -> win elections or suppress rebels to stay in power
design_notes: 'Tropico couples a conventional production and services city builder to a political layer:
  each simulated citizen holds happiness and faction alignments, and those aggregate into election results
  and rebel recruitment. Edicts and policies trade one faction''s approval against another''s, so building
  decisions double as political ones. Tropico 6 moves play to an archipelago joined by bridges from the
  World Wars era onward and organizes progress into Colonial, World Wars, Cold War, and Modern eras.'
mechanics:
- id: interest-groups
  role: core
  note: Political factions each approve or disapprove of El Presidente based on conditions and decisions
    that match their ideology.
- id: elections
  role: core
  note: Elections can be held or rigged; losing one removes El Presidente and ends the game.
- id: citizen-satisfaction
  role: core
  note: Each citizen's happiness across categories such as food, housing, and liberty aggregates into
    approval.
- id: policy-toggles
  role: supporting
  note: Edicts with costs and effects on factions and citizens.
- id: stability-unrest
  role: supporting
  note: Low approval breeds rebels, protests, and coup attempts.
- id: free-placement
  role: supporting
  note: Buildings placed freely across the islands; bridges connect islands from the World Wars era.
- id: trade-routes
  role: supporting
  note: Exports through docks fund the treasury.
- id: production-chain
  role: supporting
- id: budget-treasury
  role: supporting
- id: education-workforce
  role: supporting
  note: Skilled jobs require citizens with high school or college education.
- id: faction-diplomacy
  role: supporting
  note: Relations with foreign powers affect trade and aid.
- id: variable-speed
  role: supporting
- id: scenario-objectives
  role: supporting
  note: Single-player missions set objectives on preset islands, alongside the sandbox mode.
