- 'Generative Agents: Interactive Simulacra of Human Behavior'
summary: A research sandbox in which 25 language-model agents in a Sims-like town keep natural-language memory streams,
  reflect, and plan their days, producing unscripted information spread and social coordination.
year: 2023
developer: Stanford University and Google Research
