id: theme-hospital
type: game
name: Theme Hospital
summary: A hospital management game where the player builds rooms, hires and trains staff, and routes
  patients with comic diseases through diagnosis and treatment to meet level goals.
year: 1997
developer: Bullfrog Productions
platforms:
- pc
- console
subgenre: management-tycoon
subgenre_secondary:
- medical-sim
sim_domain:
- medical
- economic
player_role: manager-owner
agency_model:
- zoning-placement
- policy-parameter
- direct-unit
time_model: real-time-pausable
sim_scale: facility
fidelity: stylized
perspective: isometric
win_structure: scenario-goals
failure_model: hard-restart
narrative_mode: none
