id: where-winds-meet
type: game
name: Where Winds Meet
summary: An open-world martial-arts RPG whose NPCs answer free-text and voice chat through a live language
  model, included as an early large-audience deployment of runtime LLM characters.
year: 2024
developer: Everstone Studio (NetEase Games)
platforms:
- pc
subgenre: rpg-sim
