- conversational
time_model: real-time
sim_scale: individual
fidelity: stylized
perspective: third-person
win_structure: campaign
failure_model: soft-recoverable
narrative_mode: hybrid
multiplayer:
- single
- coop
modding: none
production_tier: aaa
agent_count_order: '100'
emergence: 2
influence: 2
boundary_case: true
core_loop: explore the open world -> talk to NPCs in free text or voice -> take quests and fights -> build
  reputation and skills -> explore further
design_notes: Included as a boundary case for natural-language interaction at scale. The Steam AI disclosure
  describes NPC text and voice chat generated in real time from player input. The main questline and combat
  remain authored and rule-based, so the language model sits beside the simulation rather than inside
  its state. `year` is the first public release, the open beta for PC in China in December 2024; the
  worldwide release followed in November 2025. The Chinese and global versions are operated separately,
  and the mechanics here are those of the global version that the Steam AI disclosure describes.
