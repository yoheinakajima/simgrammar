id: whispers-from-the-star
type: game
name: Whispers from the Star
summary: A voice-driven sci-fi narrative game in which the player helps stranded astronaut Stella survive on the
  planet Gaia through open-ended spoken or typed conversation answered by an AI-generated, voiced performance.
year: 2025
developer: Anuttacon
platforms:
- pc
- mobile
subgenre: ai-native
