type: game
name: 'Workers & Resources: Soviet Republic'
aliases:
- Workers and Resources
summary: A planned-economy city builder in which every building, commodity, and citizen moves through
  explicit logistics, from construction materials delivered by truck to exports at border customs for
  rubles or dollars.
