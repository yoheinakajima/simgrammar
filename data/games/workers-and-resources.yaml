core_loop: set up construction offices and deliver materials to sites -> extract and process over 30 commodities
  by truck, rail, conveyor, and pipe -> house citizens near jobs and transit -> supply food, clothing,
  heat, and services to keep health, happiness, and loyalty -> export at customs for rubles or dollars
  -> import what the republic lacks
design_notes: 'Workers & Resources treats construction itself as logistics: buildings and roads need delivered
  concrete, steel, and prefab panels plus workers from the player''s construction offices, or imported
  foreign labor at a cost, a system the taxonomy lacks (see run proposal). Over 30 commodities move by
  mode suited to their form (pipes and tanks for liquids, conveyors and trucks for ores, covered vehicles
  for goods), so freight network design is the main puzzle. Trade runs through East and West customs houses,
  flooding one bloc''s market lowers returns, and heating demand rising in winter ties utilities to the
  calendar.'
mechanics:
- id: production-chain
  role: core
  note: Over 30 commodities are extracted, processed, and stored in staffed plants.
- id: vehicle-route-scheduling
  role: core
  note: Trucks, trains, ships, and aircraft are assigned to depots and routes that move goods and workers
    between buildings.
- id: trade-routes
  role: core
  note: Exports and imports pass through customs houses at Eastern (rubles) and Western (dollars) borders.
- id: conveyor-transport
  role: supporting
  note: Conveyors move ores and bulk goods between facilities.
- id: fluid-pipe-network
  role: supporting
  note: Liquids, water, and heating travel through pipes and tanks.
- id: public-transit
  role: supporting
  note: Buses, trams, trains, subways, ships, and planes carry citizens.
- id: rail-signaling
  role: supporting
  note: Rail signals and interchanges govern shared track.
- id: supply-demand-pricing
  role: supporting
  note: Flooding one market lowers returns there.
- id: goods-consumption
  role: supporting
  note: Citizens need food, clothing, and alcohol from shops.
- id: citizen-satisfaction
  role: supporting
  note: Health and happiness decide whether citizens stay; low loyalty raises crime and lowers work efficiency.
- id: education-workforce
  role: supporting
  note: Optional complex education gates skilled jobs.
- id: seasons
  role: supporting
  note: Optional seasons raise heating demand in winter.
- id: storage-capacity
  role: supporting
- id: variable-speed
  role: supporting
- id: free-placement
  role: supporting
- id: budget-treasury
  role: supporting
  note: The republic earns money by exporting goods through border customs houses and spends it on
    imports and construction.
