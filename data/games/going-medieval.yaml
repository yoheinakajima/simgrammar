id: going-medieval
type: game
name: Going Medieval
summary: A colony sim set after a plague in which settlers with traits, needs, and moods dig into and
  build up a multi-level voxel terrain to survive seasons and raids.
year: 2021
year_full_release: 2026
developer: Foxy Voxel
platforms:
- pc
subgenre: colony-sim
sim_domain:
- social-interpersonal
- physical-mechanical
- military-conflict
player_role: overseer
agency_model:
- order-queue
- zoning-placement
- indirect-incentive
- direct-unit
time_model: real-time-pausable
sim_scale: settlement
fidelity: systemic
perspective: free-3d
win_structure: open-sandbox
failure_model: cascading-collapse
narrative_mode: emergent
multiplayer:
- single
modding: content
production_tier: indie
agent_count_order: '10'
emergence: 3
influence: 1
core_loop: dig into and build up voxel terrain -> assign settlers to roles and jobs -> settlers meet needs
  and mood shifts -> seasons change food supply -> raiders and beasts attack the walls -> research, build
  higher, and take in newcomers
design_notes: 'It follows the RimWorld pattern of named settlers with traits, perks, skills, needs, and
  moods, and is widely compared to RimWorld and Dwarf Fortress. Its distinctive layer is a fully three-dimensional
  voxel map: the player can dig cellars and caverns, raise multi-storey stone and timber forts, and reshape
  earth and water, so defensive geometry and storage depth are design problems in three dimensions. Early
  access ran from June 2021 to the 1.0 release in March 2026.'
mechanics:
- id: terraforming
  role: core
  note: A 3D terrain toolset digs out or fills voxel earth and water on a randomly generated multi-level
    map, so cellars, moats, and caverns are carved from the ground.
- id: vertical-layers
  role: core
  note: Settlements stack multi-storey buildings above ground and cellars and caverns below, connected
    by stairs and ladders.
- id: needs-decay
  role: core
  note: Settlers track needs such as hunger, sleep, clothing preferences, and religion, and meeting them
    keeps settlers content.
- id: raid-defense
  role: core
  note: Repeated bandit raids and animal attacks are met with walls, traps, and settlers equipped and
    commanded in battle.
- id: mood-breakdown
  role: supporting
  note: Settlers in poor conditions become dissatisfied and may leave the settlement.
- id: personality-traits
  role: supporting
  note: Backgrounds, traits, and perks set at settler creation.
- id: agent-skills
  role: supporting
  note: Skills such as Animal Handling improve through use, including hunting and combat.
- id: work-priorities
  role: supporting
  note: Settlers are assigned to roles that fit their skills.
- id: designation-orders
  role: supporting
- id: structural-integrity
  role: supporting
  note: Built structures need support, and unsupported sections collapse.
- id: room-recognition
  role: supporting
  note: Workshops, chapels, libraries, and bedrooms are furnished and decorated rooms.
- id: seasons
  role: supporting
  note: Seasonal changes govern food production and storage.
- id: spoilage
  role: supporting
  note: Food keeps longer in cool storage such as cellars.
- id: crop-cultivation
  role: supporting
- id: animal-husbandry
  role: supporting
- id: tech-tree
  role: supporting
  note: Research unlocks medieval technology.
- id: permadeath
  role: supporting
- id: variable-speed
  role: supporting
- id: free-placement
  role: supporting
- id: utility-action-selection
  role: supporting
- id: storage-capacity
  role: supporting
- id: production-chain
  role: supporting
  note: At the fermenting station milk ferments into curdling milk and then cheese, which is cooked into a
    meal; rough wine ages into aged wine the same way.
