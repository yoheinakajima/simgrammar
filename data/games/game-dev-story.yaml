core_loop: hire staff -> pick a licensed platform, a genre, and a type -> staff build fun, creativity, graphics,
  and sound points while bugs appear -> debug, release, and four critics score the game -> weekly sales and
  fans fund training, ads, licenses, and office moves -> tally at year 20
design_notes: 'Game Dev Story turns a studio into a calendar of releases. Each game takes one genre and one type
  from lists that grow as staff gain experience, and each pairing is rated from poor to excellent, which strongly
  moves sales; the platform must be licensed unless it is PC. A development direction trades cost against speed,
  quality, and research data. Staff in four basic careers (coder, writer, designer, sound engineer) produce Fun,
  Creativity, Graphics, and Sound points plus bugs; debugging removes bugs and yields research data, and a game
  released early can be marked down for its bugs. Four critics score each release out of 10, and 32 of 40 enters
  the Hall of Fame and allows a sequel. Fictional consoles enter and leave the market on set dates with a
  three-month warning, and a studio with a hardware engineer in its third office can build its own console from
  a chosen type, CPU, and media. Calendar events recur yearly: a July convention where the studio buys a booth, a
  December awards show gated on review totals, and a salesman who sells the career change manual. Accomplishments
  are tallied at the 20-year mark, though play can continue.'
mechanics:
- id: product-development
  role: core
  note: Each game is a platform, genre, type, and direction choice; staff accumulate four point totals and bugs,
    and four critics turn the result into scores out of 40 and a weekly sales run.
- id: staff-hiring
  role: core
  note: The player hires staff with differing stats and salaries through recruiting methods unlocked by office size,
    and assigns them to the proposal, graphics, and sound of each game.
- id: agent-skills
  role: core
  note: Staff stats for program, scenario, graphics, and sound rise through paid training and levels gained in their
    current career.
- id: career-ladder
  role: supporting
  note: Each of eight careers levels to 5; level 5 in two basic careers opens director or producer, those open
    hardware engineer, and that opens hacker, applied with a career change manual.
- id: dated-tech-timeline
  role: supporting
  note: Fictional consoles become available and leave the market on fixed in-game dates, after which no new games
    can be made for them.
- id: contracts-orders
  role: supporting
  note: Between games the studio takes contract jobs with deadlines of several weeks that pay cash and research data,
    and failing one costs the fee and reputation.
- id: advertising-awareness
  role: supporting
  note: Paid advertising, from magazine ads up to far costlier campaigns unlocked with bigger offices, builds
    popularity and loses effect when the same type is repeated.
- id: reputation
  role: supporting
  note: Popularity with each age group and gender rises or falls with reviews, fan letters, and convention booths,
    and a failed contract costs reputation.
- id: milestone-unlocks
  role: supporting
  note: Office upgrades become available after set years and cost large sums, adding seats and new training,
    advertising, and hiring methods.
- id: budget-treasury
  role: supporting
  note: Salaries, licenses, training, and development costs draw on studio funds, and running out of money during
    development cancels the game.
