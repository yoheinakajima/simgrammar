id: anno-1800
type: game
name: Anno 1800
summary: An industrial-era city builder in which residents advance through five Old World tiers by consuming
  goods from multi-island production chains, linked to a New World session by trade routes and contested
  by AI rivals.
year: 2019
developer: Ubisoft Blue Byte
platforms:
- pc
- console
subgenre: city-builder
subgenre_secondary:
- transport-logistics
sim_domain:
- urban
- economic
- industrial-logistics
player_role: planner-mayor
agency_model:
- zoning-placement
- direct-unit
- policy-parameter
time_model: real-time-pausable
sim_scale: region
fidelity: stylized
perspective: free-3d
win_structure: open-sandbox
failure_model: soft-recoverable
narrative_mode: hybrid
multiplayer:
- single
- coop
- competitive
modding: content
production_tier: aaa
agent_count_order: aggregate
emergence: 3
influence: 2
core_loop: settle an island and house farmers -> meet tier needs with production chains -> houses advance
  to workers, artisans, engineers, and investors -> higher tiers need goods from other islands and the
  New World -> build ships and trade routes -> expand under rival pressure
design_notes: 'Demand is generated by population tiers: basic needs raise how many residents a house holds,
  luxury needs raise taxes and happiness, and a house advances only when full, supplied, and given construction
  materials, so each new tier opens a new set of chains. Each tier also staffs its own buildings, so advancing
  workers to artisans removes labor from worker-tier factories. Old World cities depend on goods from
  a parallel New World session, so ship routes between sessions are a logistics layer on top of island
  production.'
mechanics:
- id: population-strata
  role: core
  note: Old World tiers Farmers, Workers, Artisans, Engineers, Investors and New World Jornaleros and
    Obreros; a house advances when full, its basic needs met, and materials available.
- id: goods-consumption
  role: core
  note: Each residence consumes goods per second; basic needs add inhabitants per house, luxury needs
    add taxes and happiness.
- id: production-chain
  role: core
  note: Fixed-recipe buildings chain raw materials into goods; many chains span islands and both sessions.
- id: trade-routes
  role: core
  note: Ships carry goods between the player's islands, the New World session, and traders.
- id: vehicle-route-scheduling
  role: supporting
  note: Trade route ships follow ordered stops with load and unload amounts per good.
- id: labor-market
  role: supporting
  note: Each tier staffs only its tier's production buildings.
- id: storage-capacity
  role: supporting
  note: Warehouses set island storage limits and pickup range.
- id: rival-firms
  role: supporting
  note: AI opponents settle the same map and compete for islands and trade.
- id: milestone-unlocks
  role: supporting
  note: Reaching population thresholds of each tier unlocks buildings.
- id: blueprints
  role: supporting
  note: Blueprint mode places silhouettes that are built later with one click when resources exist.
- id: megaproject-sink
  role: supporting
  note: The World's Fair monument is built in stages, each consuming large deliveries of goods, and once
    complete hosts exhibitions.
- id: variable-speed
  role: supporting
- id: free-placement
  role: supporting
- id: budget-treasury
  role: supporting
  note: Residents generate the money balance and buildings draw upkeep from it; custom rules can scale
    resident income or switch building upkeep off.
claims:
- text: Custom game rules set how much money residents generate and can switch off building upkeep costs,
    which makes the game significantly easier.
